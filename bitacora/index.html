<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bitácora de Control — SGI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12161A;
  --panel:#1B2126;
  --panel-2:#212830;
  --border:#2B333B;
  --text:#E7ECEF;
  --muted:#8A96A1;
  --amber:#E0A030;
  --blue:#4A90D9;
  --red:#D9534F;
  --teal:#3FAE7A;
  --lime:#A8C63F;
  --violet:#8E7CE0;
  --ok:#3FAE7A;
  --warn:#E0A030;
  --bad:#D9534F;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
.mono{font-family:'JetBrains Mono',monospace;}
.display{font-family:'Space Grotesk',sans-serif;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;background:var(--panel-2);border:1px solid var(--border);color:var(--text);border-radius:6px;padding:8px 10px;font-size:13px;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:1px;}

#login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
.login-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:36px;max-width:420px;width:100%;}
.login-card h1{font-family:'Space Grotesk';font-size:22px;margin:0 0 4px;}
.login-card .sub{color:var(--muted);font-size:13px;margin-bottom:24px;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.role-btn{border:1px solid var(--border);background:var(--panel-2);border-radius:8px;padding:14px 10px;text-align:left;color:var(--text);transition:.15s;}
.role-btn:hover{border-color:var(--blue);}
.role-btn.active{border-color:var(--blue);background:#1B2A38;}
.role-btn .role-label{font-weight:600;font-size:13px;}
.role-btn .role-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;}
.login-card .code-row{display:flex;gap:8px;margin-bottom:10px;}
.login-card input{flex:1;letter-spacing:2px;}
.btn-primary{background:var(--blue);color:#0B1620;border:none;border-radius:6px;padding:10px 16px;font-weight:600;font-size:13px;}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;}
.error-msg{color:var(--bad);font-size:12px;margin-top:8px;min-height:16px;}
.setup-note{background:#241C10;border:1px solid #3A2E14;color:var(--amber);font-size:12px;border-radius:6px;padding:10px;margin-bottom:16px;}

#app{display:none;min-height:100vh;}
.app-grid{display:grid;grid-template-columns:220px 1fr;min-height:100vh;}
.sidebar{background:var(--panel);border-right:1px solid var(--border);padding:20px 0;display:flex;flex-direction:column;}
.brand{padding:0 20px 20px;border-bottom:1px solid var(--border);margin-bottom:12px;}
.brand .display{font-size:17px;font-weight:700;}
.brand .sub{color:var(--muted);font-size:11px;margin-top:2px;}
.nav-item{display:flex;align-items:center;gap:10px;padding:11px 20px;color:var(--muted);border-left:3px solid transparent;font-size:13px;font-weight:500;}
.nav-item .sq{width:8px;height:8px;border-radius:2px;flex-shrink:0;}
.nav-item:hover{color:var(--text);background:var(--panel-2);}
.nav-item.active{color:var(--text);background:var(--panel-2);border-left-color:var(--blue);}
.nav-item .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10px;padding:1px 6px;border-radius:10px;font-weight:700;}
.sidebar-footer{margin-top:auto;padding:14px 20px;border-top:1px solid var(--border);}
.who{font-size:12px;color:var(--muted);margin-bottom:8px;}
.who b{color:var(--text);}
.logout-btn{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:6px 10px;font-size:12px;width:100%;}
.logout-btn:hover{color:var(--text);border-color:var(--red);}

main{padding:26px 32px;overflow-x:auto;}
.view-header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.view-header h2{font-family:'Space Grotesk';font-size:21px;margin:0;}
.view-header .sub{color:var(--muted);font-size:13px;margin-top:3px;}

.cards-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:24px;}
.stat-card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px 18px;border-top:3px solid var(--border);}
.stat-card .label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;}
.stat-card .value{font-family:'Space Grotesk';font-size:24px;font-weight:700;margin-top:6px;}
.stat-card .note{font-size:11px;color:var(--muted);margin-top:4px;}

.panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;margin-bottom:22px;overflow:hidden;}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.panel-head h3{margin:0;font-size:14px;font-family:'Space Grotesk';}
.panel-body{padding:14px 18px;}
.alert-row{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);font-size:13px;gap:12px;align-items:flex-start;}
.alert-row:last-child{border-bottom:none;}
.pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;white-space:nowrap;}
.pill.ok{background:rgba(63,174,122,.15);color:var(--ok);}
.pill.warn{background:rgba(224,160,48,.15);color:var(--warn);}
.pill.bad{background:rgba(217,83,79,.15);color:var(--bad);}
.pill.info{background:rgba(74,144,217,.15);color:var(--blue);}
.empty{color:var(--muted);font-size:13px;padding:10px 0;}

.toolbar{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
.toolbar input,.toolbar select{font-size:12px;padding:7px 9px;}
.btn-add{background:var(--blue);color:#0B1620;border:none;border-radius:6px;padding:8px 14px;font-size:12px;font-weight:700;margin-left:auto;}
.btn-ghost{background:none;border:1px solid var(--border);color:var(--muted);border-radius:6px;padding:8px 12px;font-size:12px;}
.btn-ghost:hover{color:var(--text);}

.form-panel{background:var(--panel-2);border:1px solid var(--border);border-radius:10px;padding:18px;margin-bottom:18px;}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.form-grid label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px;}
.form-grid .field{display:flex;flex-direction:column;}
.form-grid input,.form-grid select,.form-grid textarea{width:100%;}
.form-actions{display:flex;gap:8px;margin-top:14px;justify-content:flex-end;}

table{width:100%;border-collapse:collapse;font-size:13px;}
th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.4px;padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
td{padding:10px 12px;border-bottom:1px solid var(--border);white-space:nowrap;}
tbody tr:hover{background:var(--panel-2);}
.num{font-family:'JetBrains Mono';}
.del-btn{background:none;border:none;color:var(--muted);font-size:14px;}
.del-btn:hover{color:var(--bad);}
.edit-btn{background:none;border:none;color:var(--muted);font-size:14px;}
.edit-btn:hover{color:var(--blue);}
::-webkit-scrollbar{height:8px;width:8px;}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px;}
@media (max-width:800px){
  .app-grid{grid-template-columns:1fr;}
  .sidebar{position:fixed;bottom:0;left:0;right:0;flex-direction:row;overflow-x:auto;padding:8px;z-index:10;border-right:none;border-top:1px solid var(--border);}
  .brand,.sidebar-footer{display:none;}
  .nav-item{flex-direction:column;gap:4px;border-left:none;border-top:3px solid transparent;font-size:10px;padding:8px 12px;}
  .nav-item.active{border-top-color:var(--blue);}
  main{padding:18px;padding-bottom:90px;}
}
</style>

/* ============================================================
   STORAGE HELPERS — vía Google Apps Script (funciona para cualquiera con el enlace)
   ============================================================ */
const API_URL = 'https://script.google.com/macros/s/AKfycbyvVTRRRA8LsO8Z_pRV8ym19tP_6SPqUDAo73lvSmYk_VxPK6f9U1mQbiSm1RzcZj_M/exec';
function apiConfigured(){ return API_URL && API_URL.indexOf('http') === 0; }

async function storageGet(key, shared){
  if(!apiConfigured()) return null;
  try{
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if(!data.found) return null;
    return JSON.parse(data.value);
  }catch(e){ return null; }
}
async function storageGetSafe(key, shared){
  // A diferencia de storageGet, aquí distinguimos "no hay datos todavía" de "falló la lectura",
  // para nunca confundir un error pasajero de red con que el almacenamiento esté vacío.
  if(!apiConfigured()) return { ok:false, value:null };
  try{
    const res = await fetch(`${API_URL}?action=get&key=${encodeURIComponent(key)}`);
    const data = await res.json();
    if(!data.found) return { ok:true, value:null };
    return { ok:true, value: JSON.parse(data.value) };
  }catch(e){
    return { ok:false, value:null };
  }
}
async function storageSet(key, value, shared){
  if(!apiConfigured()) return false;
  try{
    const res = await fetch(API_URL, {
      method:'POST',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({action:'set', key, value: JSON.stringify(value)})
    });
    let data;
    try{ data = await res.json(); }
    catch(parseErr){
      console.error('storageSet: la respuesta del servidor no es JSON válido (posible redirección de Apps Script)', parseErr);
      return false;
    }
    if(!data || data.ok !== true){
      console.error('storageSet: el servidor NO confirmó el guardado', data);
      return false;
    }
    return true;
  }catch(e){ console.error('storage error', e); return false; }
}

/* ============================================================
   AUTH
   ============================================================ */
async function loadAuthConfig(){ return await storageGet('auth-config', true); }
async function ensureAuthConfig(){
  let cfg = await loadAuthConfig();
  if(!cfg){ cfg = { roles:{} }; ROLES.forEach(r=> cfg.roles[r.id] = { code: null }); return {cfg, needsSetup:true}; }
  const missing = ROLES.some(r => !cfg.roles[r.id] || !cfg.roles[r.id].code);
  return {cfg, needsSetup: missing};
}
function renderRoleGrid(){
  const grid = document.getElementById('role-grid');
  grid.innerHTML = ROLES.map(r=>`
    <button class="role-btn" data-role="${r.id}">
      <span class="role-dot" style="background:${r.dot}"></span>
      <span class="role-label">${r.label}</span>
    </button>`).join('');
  grid.querySelectorAll('.role-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      selectedRole = btn.dataset.role;
      grid.querySelectorAll('.role-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('login-btn').disabled = false;
      document.getElementById('login-error').textContent = '';
    });
  });
}
async function hashCode(text){
  // Convierte el código en una "huella digital" (SHA-256) antes de guardarlo.
  // Así, quien abra la Hoja de Google directamente ve un texto sin sentido,
  // no el código real de acceso.
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest('SHA-256', enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function initLogin(){
  const noteSlot = document.getElementById('setup-note-slot');
  if(!apiConfigured()){
    noteSlot.innerHTML = `<div class="setup-note" style="background:#2A1414;border-color:#4A1E1E;color:var(--bad)">
      <b>Falta conectar el almacenamiento.</b> Reemplaza <code>API_URL</code> en el archivo con la URL de tu Apps Script (ver la guía de configuración). Mientras tanto, nada se va a guardar.
    </div>`;
    document.getElementById('role-grid').style.display='none';
    document.querySelector('.code-row').style.display='none';
    document.getElementById('login-btn').style.display='none';
    return;
  }
  renderRoleGrid();
  const {needsSetup} = await ensureAuthConfig();
  const codeInput = document.getElementById('code-input');
  const loginBtn = document.getElementById('login-btn');
  const errorEl = document.getElementById('login-error');
  if(needsSetup){
    noteSlot.innerHTML = `<div class="setup-note">Primera configuración: elige tu rol y define el código de acceso para ese rol. Repite el proceso para cada uno de los 8 roles.</div>`;
    codeInput.placeholder = 'Crea un código para este rol';
  }
  loginBtn.addEventListener('click', async ()=>{
    if(!selectedRole) return;
    const code = codeInput.value.trim();
    if(!code){ errorEl.textContent = 'Escribe un código.'; return; }
    const codeHash = await hashCode(code);
    let {cfg} = await ensureAuthConfig();
    const roleEntry = cfg.roles[selectedRole];
    if(!roleEntry || !roleEntry.code){
      cfg.roles[selectedRole] = { code: codeHash };
      await storageSet('auth-config', cfg, true);
      await proceedLogin(selectedRole);
    } else {
      if(roleEntry.code === codeHash){ await proceedLogin(selectedRole); }
      else { errorEl.textContent = 'Código incorrecto.'; }
    }
  });
  codeInput.addEventListener('keydown', e=>{ if(e.key==='Enter') loginBtn.click(); });
}
let autoRefreshTimer = null;
async function refreshData(){
  if(!session) return;
  const anyFormOpen = Object.values(formOpen).some(v=>v);
  if(anyFormOpen) return; // no interrumpir mientras alguien está llenando un formulario
  await loadAllData();
  renderNav();
  renderView();
}
async function proceedLogin(roleId){
  const role = ROLES.find(r=>r.id===roleId);

/* ============================================================
   DATA LOAD/SAVE
   ============================================================ */
async function loadAllData(){
  let anyFailed = false;
  for(const key of Object.keys(DATA)){
    const res = await storageGetSafe('data-'+key, true);
    if(res.ok){
      DATA[key] = res.value || [];
    } else {
      anyFailed = true; // mantenemos lo que ya había en memoria, no lo borramos
    }
  }
  window.FONDOS = window.FONDOS || { SPS:0, Choloma:0, General:0 };
  for(const sede of ['SPS','Choloma','General']){
    const fondoRes = await storageGetSafe('cajachica-fondo-'+sede, true);
    if(fondoRes.ok){
      window.FONDOS[sede] = fondoRes.value ? fondoRes.value.monto : 0;
    } else {
      anyFailed = true;
    }
  }
  return !anyFailed;
}
async function saveModule(mod){ return await storageSet('data-'+mod, DATA[mod], true); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function daysUntil(dateStr){
  if(!dateStr) return 9999;
  const d = new Date(dateStr+'T00:00:00');
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((d-now)/(1000*60*60*24));
}
function fmtMoney(n){ return 'L ' + Number(n||0).toLocaleString('es-HN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(s){ if(!s) return '—'; const [y,m,d]=s.split('-'); return `${d}/${m}/${y}`; }
function statusFromDays(days){
  if(days<0) return {label:'Vencido', cls:'bad'};
  if(days<=30) return {label:'Por vencer', cls:'warn'};
  return {label:'Vigente', cls:'ok'};
}
function liquidacionPillClass(estado){
  if(estado==='Liquidado') return 'ok';
  if(estado==='Aprobado por Gerencia') return 'info';
  if(estado==='Enviado a revisión' || estado==='Enviado a Contabilidad') return 'warn';
  return 'bad'; // Pendiente de liquidar / Pendiente de rendir
}
function estaCerradoPorMes(record){
  // Un gasto ya liquidado en un mes anterior al actual queda "cerrado":
  // ya no se puede editar ni borrar salvo que seas Admin. Esto evita que se
  // toquen meses que ya se auditaron/cerraron contablemente.
  if(!record || record.estado !== 'Liquidado' || !record.fechaLiquidacion) return false;
  const ymRegistro = record.fechaLiquidacion.slice(0,7);
  const ymActual = new Date().toISOString().slice(0,7);
  return ymRegistro !== ymActual;
}
function accionesFila(mod, record){
  // Devuelve el HTML de los botones de editar/borrar, respetando dos reglas:
  // 1) Mes cerrado (ya liquidado en un mes anterior) — solo Admin puede tocarlo.
  // 2) Ya avanzó más allá del primer paso (Enviado a revisión / Aprobado / Liquidado) —
  //    solo Admin puede editarlo o borrarlo, para no perder el rastro de auditoría
  //    justo antes de que Contabilidad lo procese.
  const esFlujoLiquidacion = (mod==='cajachica' || mod==='viajes');
  const first = FIRST_STAGE[mod];
  const yaAvanzo = esFlujoLiquidacion && record.estado && record.estado !== first;
  const cerrado = estaCerradoPorMes(record);
  const bloqueado = (cerrado || yaAvanzo) && session.roleId!=='admin';
  if(bloqueado){
    const motivo = cerrado
      ? 'Mes cerrado — ya fue liquidado en un mes anterior. Solo Admin puede modificarlo.'
      : 'Ya fue enviado a revisión/aprobado — solo Admin puede modificarlo para no perder el rastro de auditoría.';
    return `<span title="${motivo}" style="color:var(--muted);font-size:13px">🔒</span>`;
  }
  return `<button class="edit-btn" data-id="${record.id}" title="Editar">✎</button> <button class="del-btn" data-id="${record.id}">✕</button>`;
}
async function freshArray(mod){
  // Trae la versión más reciente del almacenamiento antes de escribir, para no pisar
  // cambios que otra persona haya guardado mientras tanto. Si la lectura falla,
  // usamos lo que ya tengamos en memoria como respaldo (nunca partimos de vacío).
  const res = await storageGetSafe('data-'+mod, true);
  return res.ok ? (res.value || []) : (DATA[mod] || []);
}
const MOD_LABELS = { cajachica:'Caja Chica', viajes:'Gastos de Viaje', almacen:'Almacén', extintores:'Extintores',
  incidentes:'Incidentes de Seguridad', botiquin:'Botiquín', ambiente:'Ambiente', marketing:'Marketing Digital',
  noconformidades:'No Conformidades', bitacora:'Historial de Cambios' };
function describirRegistro(mod, r){
  if(mod==='cajachica') return `${r.tipo||'—'}: ${r.concepto||''} · ${fmtMoney(r.monto)}${r.sede?(' ['+r.sede+']'):''}`;
  if(mod==='viajes') return `${r.viajero||''} — ${r.destino||''} · ${fmtMoney(r.monto)}`;
  if(mod==='almacen') return `${r.tipo||'—'}: ${r.producto||''} (${r.cantidad||''} ${r.unidad||''})`;
  if(mod==='botiquin') return `${r.tipo||'—'}: ${r.producto||''} (${r.cantidad||''} ${r.unidad||''})`;
  if(mod==='extintores') return `${r.codigo||''} — ${r.ubicacion||''}`;
  if(mod==='incidentes') return `${r.tipo||''} — ${r.lugar||''}`;
  if(mod==='noconformidades') return `${r.descripcion||''}`;
  if(mod==='marketing') return `${r.campana||''} (${r.plataforma||''})`;
  if(mod==='ambiente') return `Registro de luz · ${fmtMoney(r.costo)}`;
  return r.concepto || r.producto || r.descripcion || '(sin descripción)';
}
async function logBitacora(accion, mod, descripcion){
  try{
    const arr = await freshArray('bitacora');
    arr.push({ id: uid(), fecha: new Date().toISOString(), accion, modulo: MOD_LABELS[mod]||mod, descripcion, usuario: session?.label || 'Sistema' });
    // conservamos como máximo las últimas 500 entradas para no crecer sin límite
    DATA.bitacora = arr.slice(-500);
    await saveModule('bitacora');
  }catch(e){ console.error('bitacora error', e); }
}
async function addRecord(mod, record){
  record.id = uid();
  record.registradoPor = session.label;
  record.registradoEn = new Date().toISOString();
  const arr = await freshArray(mod);
  arr.push(record);
  DATA[mod] = arr;
  const ok = await saveModule(mod);
  if(!ok){
    alert('⚠️ No se pudo confirmar el guardado en la Hoja de Google. Revisa tu conexión e inténtalo de nuevo — si sales sin que esto se resuelva, este registro se puede perder.');
    return false;
  }
  await logBitacora('Creó', mod, describirRegistro(mod, record));
  return true;
}
async function deleteRecord(mod, id){
  const arr = await freshArray(mod);
  const registro = arr.find(r=>r.id===id);
  DATA[mod] = arr.filter(r=>r.id!==id);
  const ok = await saveModule(mod);
  if(!ok){
    alert('⚠️ No se pudo confirmar el borrado en la Hoja de Google. Revisa tu conexión e inténtalo de nuevo.');
    return false;
  }
  if(registro) await logBitacora('Eliminó', mod, describirRegistro(mod, registro));
  return true;
}
async function updateRecord(mod, id, patch){
  const arr = await freshArray(mod);
  const idx = arr.findIndex(r=>r.id===id);
  if(idx===-1){ DATA[mod] = arr; return false; }
  arr[idx] = {...arr[idx], ...patch, ultimaModificacionPor: session.label, ultimaModificacionEn: new Date().toISOString()};
  DATA[mod] = arr;
  const ok = await saveModule(mod);
  if(!ok){
    alert('⚠️ No se pudo confirmar el cambio en la Hoja de Google. Revisa tu conexión e inténtalo de nuevo — si sales sin que esto se resuelva, este cambio se puede perder.');
    return false;
  }
  const cambioEstado = patch.estado ? ` → estado: ${patch.estado}` : '';
  await logBitacora(patch.estado ? 'Cambió estado' : 'Editó', mod, describirRegistro(mod, arr[idx]) + cambioEstado);
  return true;
}
const FIRST_STAGE = { cajachica:'Pendiente de liquidar', viajes:'Pendiente de rendir' };
function getNextAction(moduleKey, estado, roleId){
  const perm = PERMISSIONS[roleId];
  if(!perm) return null;
  const hasAccess = perm.modules === 'all' || perm.modules.includes(moduleKey);
  if(perm.readOnly || !hasAccess) return null;
  const first = FIRST_STAGE[moduleKey];
  const cur = estado || first;
  if(cur===first){
    if(roleId!=='contabilidad') return {label:'Enviar a revisión', next:'Enviado a revisión'};
  } else if(cur==='Enviado a revisión'){
    if(roleId==='admin') return {label:'Aprobar', next:'Aprobado por Gerencia'};
  } else if(cur==='Aprobado por Gerencia'){
    if(roleId==='admin' || roleId==='contabilidad') return {label:'Marcar Liquidado', next:'Liquidado'};
  }
  return null;
}
function estadoActionButton(moduleKey, record){
  const action = getNextAction(moduleKey, record.estado, session.roleId);
  if(!action) return '';
  return `<button class="btn-add estado-action-btn" data-mod="${moduleKey}" data-id="${record.id}" data-next="${action.next}" style="padding:6px 12px;font-size:12px;margin-left:0">${action.label}</button>`;
}
function wireEstadoActionButtons(refreshFn){
  document.querySelectorAll('.estado-action-btn').forEach(b=>{
    b.onclick = async ()=>{
      const mod = b.dataset.mod, id = b.dataset.id, next = b.dataset.next;
      if(next === 'Liquidado' && mod === 'cajachica'){
        // Liquidar un gasto de caja chica solo confirma que ya se procesó, tal cual se ingresó.
        // El reembolso a la caja chica es un movimiento aparte (ver "Registrar reembolso a Caja Chica").
        if(!confirm('¿Confirmas que este gasto ya fue revisado y liquidado por Contabilidad?')) return;
        await updateRecord(mod, id, {estado:'Liquidado', fechaLiquidacion: todayISO()});
      } else if(next === 'Liquidado' && mod === 'viajes'){
        const record = DATA[mod].find(r=>r.id===id);
        const sugerido = record ? record.monto : '';
        const input = window.prompt('¿Cuánto se le va a reembolsar a la persona por este gasto de viaje?', sugerido);
        if(input === null) return; // canceló
        const montoReembolsado = Number(input || 0);
        if(isNaN(montoReembolsado) || montoReembolsado <= 0){ alert('Ingresa un monto válido mayor a 0.'); return; }
        await updateRecord(mod, id, {estado:'Liquidado', fechaLiquidacion: todayISO(), montoReembolsado});
      } else {
        await updateRecord(mod, id, {estado: next});
      }
      refreshFn();
    };
  });
}
async function registrarReembolsoCajaChica(sede, monto, concepto){
  const fecha = todayISO();
  await addRecord('cajachica', {
    fecha, sede, tipo:'Reposición de fondo',
    concepto: concepto || 'Reembolso de Contabilidad a Caja Chica',
    monto, estado:'Liquidado', fechaLiquidacion: fecha,
    responsable: session.label
  });
}
function montoSugeridoReembolso(sede){
  const fondo = Number((window.FONDOS && window.FONDOS[sede]) || 0);
  const saldo = cajaChicaSaldo(sede);
  const gap = fondo - saldo;
  return gap > 0 ? gap : 0;
}
function renderReembolsoForm(containerId, sedesDisponibles, onDone){
  const slot = document.getElementById(containerId);
  if(!slot) return;
  const sugerido = montoSugeridoReembolso(sedesDisponibles[0]);
  slot.innerHTML = `
    <div class="form-panel">
      <div class="form-grid">
        ${sedesDisponibles.length>1 ? `<div class="field"><label>Sede a reembolsar</label><select id="reemb-sede">${selOpts(sedesDisponibles, sedesDisponibles[0])}</select></div>` : `<input type="hidden" id="reemb-sede" value="${sedesDisponibles[0]}">`}
        <div class="field"><label>Monto total a reembolsar</label><input type="number" step="0.01" id="reemb-monto" value="${sugerido>0?sugerido.toFixed(2):''}" placeholder="Ej: 10000"></div>
        <div class="field" style="grid-column:1/-1"><label>Concepto (opcional)</label><input id="reemb-concepto" placeholder="Ej: Reposición mensual de caja chica"></div>
      </div>
      <div class="note" id="reemb-sugerencia" style="margin-top:-6px;margin-bottom:10px;color:var(--muted);font-size:12px">${sugerido>0 ? `Monto sugerido: ${fmtMoney(sugerido)} — es lo que hace falta para devolver el fondo a su nivel original.` : 'El fondo ya está completo, no hace falta reembolsar por ahora.'}</div>
      <div class="form-actions"><button class="btn-add" id="reemb-save">💰 Registrar reembolso</button></div>
    </div>`;
  document.getElementById('reemb-sede')?.addEventListener('change', (e)=>{
    const s = montoSugeridoReembolso(e.target.value);
    document.getElementById('reemb-monto').value = s>0 ? s.toFixed(2) : '';
    document.getElementById('reemb-sugerencia').textContent = s>0 ? `Monto sugerido: ${fmtMoney(s)} — es lo que hace falta para devolver el fondo a su nivel original.` : 'El fondo ya está completo, no hace falta reembolsar por ahora.';
  });
  document.getElementById('reemb-save').onclick = async ()=>{
    const sede = document.getElementById('reemb-sede').value;
    const monto = Number(document.getElementById('reemb-monto').value||0);
    const concepto = document.getElementById('reemb-concepto').value;
    if(!monto || monto<=0){ alert('Ingresa un monto válido mayor a 0.'); return; }
    if(Math.abs(monto - montoSugeridoReembolso(sede)) > 0.01){
      if(!confirm(`El monto sugerido para dejar el fondo en su nivel original era ${fmtMoney(montoSugeridoReembolso(sede))}, pero vas a registrar ${fmtMoney(monto)}. Si pones más, la caja chica quedará por encima de su fondo fijo. ¿Confirmas que quieres continuar con este monto?`)) return;
    }
    await registrarReembolsoCajaChica(sede, monto, concepto);
    alert(`Reembolso de ${fmtMoney(monto)} registrado para ${sede}. El saldo de esa sede ya se actualizó.`);
    onDone();
  };
}
function exportCSV(mod, columns){
  const rows = DATA[mod];
  if(!rows.length){ alert('No hay datos para exportar.'); return; }
  const header = columns.map(c=>c.label).join(',');
  const body = rows.map(r=> columns.map(c=> `"${(r[c.key]??'').toString().replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([header+'\n'+body], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = mod+'.csv'; a.click();
  URL.revokeObjectURL(url);
}

function countAlerts(){
  const botAlert = DATA.botiquin.filter(x=>x.tipo==='Entrada' && daysUntil(x.caducidad)<=30).length;
  const extAlert = DATA.extintores.filter(x=>daysUntil(x.vencimiento)<=30).length;
  const incAlert = DATA.incidentes.filter(x=>x.estado==='Abierto').length;
  const ncAlert = DATA.noconformidades.filter(x=>x.estado==='Abierta').length;
  const viajesAlert = DATA.viajes.filter(x=>x.estado!=='Liquidado').length;
  const pendApr = DATA.cajachica.filter(r=>r.tipo==='Gasto' && !['Aprobado por Gerencia','Liquidado','Rechazado'].includes(r.estado||'Pendiente de liquidar')).length
    + DATA.viajes.filter(r=>!['Aprobado por Gerencia','Liquidado','Rechazado'].includes(r.estado||'Pendiente de rendir')).length;
  const pendCont = DATA.cajachica.filter(r=>r.tipo==='Gasto' && (r.estado||'Pendiente de liquidar')!=='Liquidado').length
    + DATA.viajes.filter(r=>(r.estado||'Pendiente de rendir')!=='Liquidado').length;
  return { botiquin: botAlert, extintores: extAlert, incidentes: incAlert, noconformidades: ncAlert, viajes: viajesAlert, pendiente_aprobar: pendApr, pendiente_contabilizar: pendCont };
}
function renderNav(){
  const nav = document.getElementById('nav');
  const alerts = countAlerts();
  const visibleModules = MODULES.filter(m=> m.id==='config' || canSeeModule(m.id));
  nav.innerHTML = visibleModules.map(m=>{
    let badge = '';
    if(m.id==='botiquin' && alerts.botiquin>0) badge = `<span class="badge">${alerts.botiquin}</span>`;
    if(m.id==='extintores' && alerts.extintores>0) badge = `<span class="badge">${alerts.extintores}</span>`;
    if(m.id==='incidentes' && alerts.incidentes>0) badge = `<span class="badge">${alerts.incidentes}</span>`;
    if(m.id==='noconformidades' && alerts.noconformidades>0) badge = `<span class="badge">${alerts.noconformidades}</span>`;
    if(m.id==='viajes' && alerts.viajes>0) badge = `<span class="badge">${alerts.viajes}</span>`;
    if(m.id==='pendiente_aprobar' && alerts.pendiente_aprobar>0) badge = `<span class="badge">${alerts.pendiente_aprobar}</span>`;
    if(m.id==='pendiente_contabilizar' && alerts.pendiente_contabilizar>0) badge = `<span class="badge">${alerts.pendiente_contabilizar}</span>`;
    return `<div class="nav-item ${currentView===m.id?'active':''}" data-view="${m.id}">
      <span class="sq" style="background:${m.color}"></span>${m.label}${badge}
    </div>`;
  }).join('');
  nav.querySelectorAll('.nav-item').forEach(el=>{
    el.addEventListener('click', ()=>{ currentView = el.dataset.view; renderNav(); renderView(); });
  });
}

  if(currentView!=='config' && !canSeeModule(currentView)){
    main.innerHTML = `<div class="empty" style="padding:20px">No tienes acceso a esta sección.</div>`;

  const fn = VIEW_RENDERERS[currentView];
  if(fn) fn(main);

function applyReadOnlyRestrictions(){
  if(!isReadOnly()) return;
  ['btn-toggle-form','btn-import','btn-edit-fondo','btn-send-all','btn-aprobar-todos','btn-liquidar-todos','reemb-save'].forEach(id=>{
    const el = document.getElementById(id);

  document.querySelectorAll('.del-btn').forEach(b=> b.remove());
  document.querySelectorAll('.edit-btn').forEach(b=> b.remove());
  document.querySelectorAll('.estado-action-btn').forEach(b=> b.remove());

function cajaChicaSaldo(sede){
  // sede = 'SPS' | 'Choloma' | 'General' | undefined (undefined = todas sumadas)
  const sedes = sede ? [sede] : ['SPS','Choloma','General'];
  let total = 0;
  sedes.forEach(s=>{
    const fondo = Number((window.FONDOS && window.FONDOS[s]) || 0);
    const movs = DATA.cajachica.filter(m=> (m.sede||'General')===s);
    let saldo = fondo;
    movs.forEach(m=>{ saldo += (m.tipo==='Reposición de fondo' ? Number(m.monto||0) : -Number(m.monto||0)); });
    total += saldo;
  });
  return total;
}
function renderDashboard(main){
  const now = new Date();
  const ym = now.toISOString().slice(0,7);
  const ultimoDiaMes = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const nombresMes = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  const rangoMesTexto = `Del 1 al ${ultimoDiaMes} de ${nombresMes[now.getMonth()]} de ${now.getFullYear()}`;

  const cajaMes = DATA.cajachica.filter(g=>g.fecha && g.fecha.startsWith(ym));
  const gastoCajaMes = cajaMes.filter(g=>g.tipo==='Gasto').reduce((a,b)=>a+Number(b.monto||0),0);
  const saldoActual = cajaChicaSaldo();
  const cajaPendienteLiquidar = DATA.cajachica.filter(g=>g.tipo==='Gasto' && g.estado!=='Liquidado').reduce((a,b)=>a+Number(b.monto||0),0);

  const liquidadasMes = DATA.cajachica.filter(g=>g.tipo==='Gasto' && g.estado==='Liquidado' && g.fechaLiquidacion && g.fechaLiquidacion.startsWith(ym));
  const totalLiquidadoMes = liquidadasMes.reduce((a,b)=>a+Number(b.monto||0),0);
  const historialLiquidaciones = [...DATA.cajachica, ...DATA.viajes]
    .filter(r=>r.estado==='Liquidado' && r.fechaLiquidacion)
    .sort((a,b)=>(b.fechaLiquidacion||'').localeCompare(a.fechaLiquidacion||''))
    .slice(0,10);

  const viajesPendientes = DATA.viajes.filter(v=>v.estado!=='Liquidado');
  const anticipoPendiente = viajesPendientes.reduce((a,b)=>a+Number(b.anticipo||0),0);

  const entradasMes = DATA.almacen.filter(a=>a.fecha && a.fecha.startsWith(ym) && a.tipo==='Entrada').length;
  const salidasMes = DATA.almacen.filter(a=>a.fecha && a.fecha.startsWith(ym) && a.tipo==='Salida').length;

function normalizeHeader(s){
  if(s===null || s===undefined) return '';
  return String(s).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}
function excelDateToISO(v){
  if(v===null || v===undefined || v==='') return '';
  if(v instanceof Date){
    const y=v.getUTCFullYear(), m=String(v.getUTCMonth()+1).padStart(2,'0'), d=String(v.getUTCDate()).padStart(2,'0');
    return `${y}-${m}-${d}`;
  }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})/);
  if(m) return `${m[3]}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;
  return s;
}
const IMPORT_ALIASES = {

    evidencia:['evidencia de cierre']
  }
};
const IMPORT_SHEET_TO_MODULE = {
  'caja chica': 'cajachica', 'gastos de viaje': 'viajes', 'almacen': 'almacen',
  'extintores': 'extintores', 'incidentes de seguridad':'incidentes', 'incidentes':'incidentes',
  'botiquin': 'botiquin', 'ambiente': 'ambiente', 'no conformidades': 'noconformidades'
};
const DATE_FIELDS = ['fecha','ingreso','vencimiento','caducidad','fechaCompromiso','fechaCierre'];

function scoreSheetForModule(rows, moduleKey){
  const aliasMap = IMPORT_ALIASES[moduleKey];
  const fields = Object.keys(aliasMap);
  let headerRowIdx = -1, bestScore = 0, colIndex = {};
  for(let r=0; r<Math.min(rows.length,20); r++){
    const row = rows[r] || [];
    const normed = row.map(normalizeHeader);
    let score = 0; const tempMap = {};
    for(const f of fields){
      for(let c=0;c<normed.length;c++){
        if(aliasMap[f].includes(normed[c])){ tempMap[f]=c; score++; break; }
      }
    }
    if(score > bestScore){ bestScore = score; headerRowIdx = r; colIndex = tempMap; }
  }
  return {headerRowIdx, bestScore, colIndex};
}
function detectModuleForSheet(rows){
  let best = null, bestScore = 0;
  for(const moduleKey of Object.keys(IMPORT_ALIASES)){
    const {bestScore: score} = scoreSheetForModule(rows, moduleKey);
    if(score > bestScore){ bestScore = score; best = moduleKey; }
  }
  return bestScore >= 3 ? best : null;
}
const PRIMARY_FIELD = {
  cajachica: 'concepto', viajes: 'viajero', almacen: 'producto',
  extintores: 'codigo', botiquin: 'producto', ambiente: 'fecha',
  incidentes: 'descripcion', noconformidades: 'descripcion'
};
function parseImportSheet(rows, moduleKey){
  const aliasMap = IMPORT_ALIASES[moduleKey];
  const fields = Object.keys(aliasMap);
  const primary = PRIMARY_FIELD[moduleKey];
  const {headerRowIdx, bestScore, colIndex} = scoreSheetForModule(rows, moduleKey);
  if(headerRowIdx === -1 || bestScore < 2) return [];
  const records = [];
  let blankStreak = 0;
  for(let r = headerRowIdx+1; r < rows.length; r++){
    const row = rows[r] || [];
    const rowText = row.map(v=>String(v||'')).join(' ').toLowerCase();
    if(rowText.includes('total')) break;
    const rec = {}; let hasValue = false;
    for(const f of fields){
      const idx = colIndex[f];
      let v = idx!==undefined ? row[idx] : '';
      if(v===undefined || v===null) v='';
      if(DATE_FIELDS.includes(f)) v = excelDateToISO(v);
      else if(typeof v === 'string') v = v.trim();
      if(v!=='') hasValue = true;
      rec[f] = v;
    }
    if(!hasValue){ blankStreak++; if(blankStreak>=2) break; continue; }
    blankStreak = 0;
    if(primary && rec[primary]==='') continue; // fila sin el dato principal (ej. fila de total sin etiqueta) — se descarta
    if(moduleKey==='cajachica'){
      if(!rec.tipo) rec.tipo = 'Gasto';
      if(!rec.estado) rec.estado = 'Pendiente de liquidar';
      if(!rec.sede) rec.sede = 'General';
    }
    records.push(rec);
  }
  return records;
}

const IDENTITY_FIELDS = {
  cajachica: ['fecha','concepto','monto','sede'],
  viajes: ['fecha','viajero','destino','monto'],
  almacen: ['fecha','producto','cantidad','tipo','sede'],
  extintores: ['codigo'],
  botiquin: ['producto','fecha','lote','tipo'],
  ambiente: ['fecha','costo'],
  incidentes: ['fecha','descripcion'],
  noconformidades: ['fecha','descripcion'],
  marketing: ['fecha','campana','plataforma']
};
function esDuplicado(mod, rec, existentes){
  const campos = IDENTITY_FIELDS[mod];
  if(!campos) return false;
  return existentes.some(ex => campos.every(f => String(ex[f]??'').trim().toLowerCase() === String(rec[f]??'').trim().toLowerCase()));
}
async function handleExcelImport(e){
  const file = e.target.files[0];
  if(!file) return;
  e.target.value = '';
  const target = window.IMPORT_TARGET_MODULE;
  const targetLabel = target ? (MODULES.find(m=>m.id===target)?.label || target) : 'todos los módulos';
  if(!confirm(`¿Importar "${file.name}" para ${targetLabel}? Esto AGREGA los registros nuevos que encuentre (los que parezcan duplicados de algo que ya existe se van a omitir).`)) return;
  try{
    const buf = await file.arrayBuffer();
    const wbk = XLSX.read(buf, {type:'array', cellDates:true});
    const summary = [];
    for(const sheetName of wbk.SheetNames){
      const ws = wbk.Sheets[sheetName];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:''});
      let moduleKey = IMPORT_SHEET_TO_MODULE[normalizeHeader(sheetName)];
      if(!moduleKey) moduleKey = detectModuleForSheet(rows);
      if(!moduleKey) continue;
      if(target && moduleKey !== target) continue;
      const records = parseImportSheet(rows, moduleKey);
      const misede = myPermissions().sede;
      if((moduleKey==='cajachica' || moduleKey==='almacen') && misede){
        records.forEach(rec => { rec.sede = misede; });
      }
      let agregados = 0, duplicados = 0;
      for(const rec of records){
        if(esDuplicado(moduleKey, rec, DATA[moduleKey])){ duplicados++; continue; }
        await addRecord(moduleKey, rec);
        agregados++;
      }
      const moduleLabel = MODULES.find(m=>m.id===moduleKey)?.label || moduleKey;
      summary.push(`${sheetName} → ${moduleLabel}: ${agregados} nuevo(s)${duplicados>0 ? `, ${duplicados} duplicado(s) omitido(s)` : ''}`);
    }
    if(summary.length === 0){
      alert(target ? `No pude reconocer en ese Excel columnas que correspondan a "${targetLabel}".` : 'No pude reconocer el contenido de ninguna hoja del archivo.');
    } else {
      alert('Importación completada:\n\n' + summary.join('\n'));
    }
    renderNav();
    renderView();
  }catch(err){
    console.error(err);
    alert('No se pudo leer el archivo. Verifica que sea un .xlsx válido.');
  }
}

function tablaCajaChicaPorSede(registros, tituloPrefijo){
  const sedes = ['SPS','Choloma','General'];
  return sedes.map(sede=>{
    const rows = registros.filter(r=>(r.sede||'General')===sede);
    if(rows.length===0 && sede==='General') return ''; // no mostrar el bloque General si está vacío, para no saturar
    return `
    <div class="panel">
      <div class="panel-head"><h3>${tituloPrefijo} — ${sede} (${rows.length})</h3></div>
      <div class="panel-body" style="padding:0;overflow-x:auto">
        <table><thead><tr><th>Fecha</th><th>Concepto</th><th>Monto</th><th>Depto./Responsable</th><th>Comprobante</th><th>Estado</th><th>Ingresado por</th><th></th></tr></thead>
        <tbody>${rows.length ? rows.map(r=>`
          <tr><td class="mono">${fmtDate(r.fecha)}</td><td>${r.concepto||'—'}</td><td class="num">${fmtMoney(r.monto)}</td><td>${r.responsable||'—'}</td>
          <td class="mono">${r.comprobante||'—'}</td>
          <td><span class="pill ${liquidacionPillClass(r.estado||'Pendiente de liquidar')}">${r.estado||'Pendiente de liquidar'}</span></td>
          <td>${r.registradoPor||'—'}</td><td>${estadoActionButton('cajachica', r)}</td></tr>`).join('')
          : `<tr><td colspan="8" class="empty">No hay gastos de ${sede} en esta lista.</td></tr>`}</tbody></table>
      </div>
    </div>`;
  }).join('');
}
function descargarExcelPendientes(nombreArchivo, hojas){
  const wb = XLSX.utils.book_new();
  hojas.forEach(h=>{
    const hoja = h.filas.length ? XLSX.utils.json_to_sheet(h.filas) : XLSX.utils.aoa_to_sheet([['(sin datos)']]);
    XLSX.utils.book_append_sheet(wb, hoja, h.nombre.slice(0,31));
  });
  XLSX.writeFile(wb, `${nombreArchivo}-${todayISO()}.xlsx`);
}
async function aprobarTodosPendientes(refreshFn){
  const candidatosCaja = DATA.cajachica.filter(r=>r.tipo==='Gasto' && r.estado==='Enviado a revisión');
  const candidatosViajes = DATA.viajes.filter(r=>r.estado==='Enviado a revisión');
  const total = candidatosCaja.length + candidatosViajes.length;
  if(total===0){ alert('No hay nada "Enviado a revisión" para aprobar en este momento.'); return; }
  if(!confirm(`¿Aprobar los ${total} registro(s) que están "Enviado a revisión" (${candidatosCaja.length} de Caja Chica, ${candidatosViajes.length} de Gastos de Viaje)?`)) return;
  for(const r of candidatosCaja){ await updateRecord('cajachica', r.id, {estado:'Aprobado por Gerencia'}); }
  for(const r of candidatosViajes){ await updateRecord('viajes', r.id, {estado:'Aprobado por Gerencia'}); }
  alert(`Se aprobaron ${total} registro(s).`);
  refreshFn();
}
async function liquidarTodosPendientes(refreshFn){
  const candidatosCaja = DATA.cajachica.filter(r=>r.tipo==='Gasto' && r.estado==='Aprobado por Gerencia');
  const candidatosViajes = DATA.viajes.filter(r=>r.estado==='Aprobado por Gerencia');
  const total = candidatosCaja.length + candidatosViajes.length;
  if(total===0){ alert('No hay nada "Aprobado por Gerencia" listo para liquidar en este momento.'); return; }
  if(!confirm(`¿Liquidar los ${total} registro(s) que están "Aprobado por Gerencia" (${candidatosCaja.length} de Caja Chica, ${candidatosViajes.length} de Gastos de Viaje)?\n\nCaja Chica se liquida por el monto exacto que ya tiene registrado. Gastos de Viaje se liquida usando el monto original de cada uno (si algún reembolso fue distinto, mejor liquídalo individual).`)) return;
  const fecha = todayISO();
  for(const r of candidatosCaja){ await updateRecord('cajachica', r.id, {estado:'Liquidado', fechaLiquidacion: fecha}); }
  for(const r of candidatosViajes){ await updateRecord('viajes', r.id, {estado:'Liquidado', fechaLiquidacion: fecha, montoReembolsado: r.monto}); }
  alert(`Se liquidaron ${total} registro(s).`);
  refreshFn();
}

function cajaChicaResumen(sedeFiltro){
  const base = sedeFiltro ? DATA.cajachica.filter(r=>(r.sede||'General')===sedeFiltro) : DATA.cajachica;
  const gastos = base.filter(r=>r.tipo==='Gasto');
  const totalGastado = gastos.reduce((a,b)=>a+Number(b.monto||0),0);
  const totalLiquidado = gastos.filter(r=>r.estado==='Liquidado').reduce((a,b)=>a+Number(b.monto||0),0);
  const totalPendiente = gastos.filter(r=>r.estado!=='Liquidado' && r.estado!=='Rechazado').reduce((a,b)=>a+Number(b.monto||0),0);
  const totalRechazado = gastos.filter(r=>r.estado==='Rechazado').reduce((a,b)=>a+Number(b.monto||0),0);
  const totalRepuesto = base.filter(r=>r.tipo==='Reposición de fondo').reduce((a,b)=>a+Number(b.monto||0),0);
  return {totalGastado, totalLiquidado, totalPendiente, totalRechazado, totalRepuesto};
}
async function sendAllToReview(mod, filterFn){
  const candidates = DATA[mod].filter(filterFn);
  let count = 0;
  for(const r of candidates){
    const action = getNextAction(mod, r.estado, session.roleId);
    if(action && action.next === 'Enviado a revisión'){
      await updateRecord(mod, r.id, {estado: 'Enviado a revisión'});
      count++;
    }
  }

function viajesResumen(){
  const perm = myPermissions();
  const base = perm.ownOnly ? DATA.viajes.filter(v=>v.registradoPor===session.label) : DATA.viajes;
  const totalAnticipo = base.reduce((a,b)=>a+Number(b.anticipo||0),0);
  const totalGastado = base.reduce((a,b)=>a+Number(b.monto||0),0);
  const totalLiquidado = base.filter(v=>v.estado==='Liquidado').reduce((a,b)=>a+Number(b.monto||0),0);
  const totalPendiente = base.filter(v=>v.estado!=='Liquidado').reduce((a,b)=>a+Number(b.monto||0),0);
  const countPendiente = base.filter(v=>v.estado!=='Liquidado').length;
  return {totalAnticipo, totalGastado, totalLiquidado, totalPendiente, countPendiente};
}

function almacenResumen(sedeFiltro){
  const base = sedeFiltro ? DATA.almacen.filter(a=>(a.sede||'General')===sedeFiltro) : DATA.almacen;
  const entradas = base.filter(a=>a.tipo==='Entrada');
  const salidas = base.filter(a=>a.tipo==='Salida');
  const porProducto = {};
  base.forEach(a=>{
    const key = (a.producto||'—').trim();
    if(!porProducto[key]) porProducto[key] = {entrada:0, salida:0, unidad:a.unidad||''};
    if(a.tipo==='Entrada') porProducto[key].entrada += Number(a.cantidad||0);

  });
  return {entradas, salidas, porProducto};
}

   BOTIQUÍN (con entradas y salidas)
   ============================================================ */
function botiquinResumen(){
  const entradas = DATA.botiquin.filter(b=>b.tipo==='Entrada');
  const salidas = DATA.botiquin.filter(b=>b.tipo==='Salida');
  const caducados = entradas.filter(x=>daysUntil(x.caducidad)<0).length;
  const porCaducar = entradas.filter(x=>{const d=daysUntil(x.caducidad); return d>=0 && d<=30;}).length;
  const porProducto = {};
  DATA.botiquin.forEach(b=>{
    const key = (b.producto||'—').trim();
    if(!porProducto[key]) porProducto[key] = {entrada:0, salida:0, unidad:b.unidad||''};
    if(b.tipo==='Entrada') porProducto[key].entrada += Number(b.cantidad||0);
    else porProducto[key].salida += Number(b.cantidad||0);
  });
  return {entradas, salidas, caducados, porCaducar, porProducto};
}

function renderBotTable(){
  const tbody = document.getElementById('tbody');

  rows = rows.filter(r=>{
    const st = r.tipo==='Salida' ? {label:'Salida', cls:'warn'} : statusFromDays(daysUntil(r.caducidad));

    return matchSearch && matchTipo && matchEstado;
  });

    <div class="panel"><div class="panel-body" style="padding:0;overflow-x:auto"><table><thead><tr>${cols.map(c=>`<th>${c.label}</th>`).join('')}<th></th></tr></thead><tbody id="tbody"></tbody></table></div></div>
  `;
  document.getElementById('btn-export').onclick = ()=>exportCSV('noconformidades', cols);
  document.getElementById('btn-toggle-form').onclick = ()=>{ editingRecord.noconformidades=null; formOpen.noconformidades = !formOpen.noconformidades; renderNCForm(); };
  document.getElementById('f-search').oninput = renderNCTable;
  document.getElementById('f-modulo').onchange = renderNCTable;
  document.getElementById('f-estado').onchange = renderNCTable;
  renderNCForm();
  renderNCTable();
}
function renderNCForm(){
  const slot = document.getElementById('form-slot');
  if(!formOpen.noconformidades){ slot.innerHTML=''; return; }
  const rec = editingRecord.noconformidades || {};
  const isEdit = !!editingRecord.noconformidades;
  slot.innerHTML = `
    <div class="form-panel">
      <div class="form-grid">
        <div class="field"><label>Fecha de detección</label><input type="date" id="n-fecha" value="${rec.fecha||todayISO()}"></div>
        <div class="field"><label>Módulo relacionado</label><select id="n-modulo">${selOpts(NC_MODULOS, rec.modulo||NC_MODULOS[0])}</select></div>
        <div class="field"><label>Clasificación</label><select id="n-clasificacion">${selOpts(['No conformidad','Observación'], rec.clasificacion||'No conformidad')}</select></div>
        <div class="field"><label>Responsable de la acción</label><input id="n-responsable" value="${rec.responsable||''}"></div>
        <div class="field"><label>Fecha compromiso de cierre</label><input type="date" id="n-fechaCompromiso" value="${rec.fechaCompromiso||''}"></div>
        <div class="field"><label>Estado</label><select id="n-estado">${selOpts(['Abierta','Cerrada'], rec.estado||'Abierta')}</select></div>
        <div class="field"><label>Fecha de cierre real (si aplica)</label><input type="date" id="n-fechaCierre" value="${rec.fechaCierre||''}"></div>
        <div class="field" style="grid-column:1/-1"><label>Descripción del hallazgo</label><textarea id="n-descripcion" rows="2" placeholder="Qué se encontró y dónde">${rec.descripcion||''}</textarea></div>
        <div class="field" style="grid-column:1/-1"><label>Acción correctiva</label><textarea id="n-accion" rows="2" placeholder="Qué se va a hacer para corregirlo">${rec.accion||''}</textarea></div>
        <div class="field" style="grid-column:1/-1"><label>Evidencia de cierre</label><textarea id="n-evidencia" rows="2" placeholder="Cómo se verificó que se corrigió">${rec.evidencia||''}</textarea></div>
      </div>
      <div class="form-actions"><button class="btn-ghost" id="n-cancel">Cancelar</button><button class="btn-add" id="n-save">${isEdit?'Guardar cambios':'Guardar'}</button></div>
    </div>`;
  document.getElementById('n-cancel').onclick = ()=>{ cancelEdit('noconformidades'); renderNCForm(); };
  document.getElementById('n-save').onclick = async ()=>{
    const data = {
      fecha: document.getElementById('n-fecha').value, modulo: document.getElementById('n-modulo').value,
      clasificacion: document.getElementById('n-clasificacion').value, responsable: document.getElementById('n-responsable').value,
      fechaCompromiso: document.getElementById('n-fechaCompromiso').value, estado: document.getElementById('n-estado').value,
      fechaCierre: document.getElementById('n-fechaCierre').value, descripcion: document.getElementById('n-descripcion').value,
      accion: document.getElementById('n-accion').value, evidencia: document.getElementById('n-evidencia').value
    };
    if(!data.fecha || !data.descripcion){ alert('Completa al menos fecha y descripción del hallazgo.'); return; }
    if(isEdit){ await updateRecord('noconformidades', rec.id, data); } else { await addRecord('noconformidades', data); }
    cancelEdit('noconformidades'); renderNCForm(); renderNCTable(); renderNav();
  };
}
function renderNCTable(){
  const tbody = document.getElementById('tbody');
  const search = (document.getElementById('f-search')?.value||'').toLowerCase();
  const moduloF = document.getElementById('f-modulo')?.value||'';
  const estadoF = document.getElementById('f-estado')?.value||'';
  let rows = [...DATA.noconformidades].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  rows = rows.filter(r=> (!moduloF || r.modulo===moduloF) && (!estadoF || r.estado===estadoF) && (!search || (r.descripcion||'').toLowerCase().includes(search)));
  tbody.innerHTML = rows.length ? rows.map(r=>`
    <tr>
      <td class="mono">${fmtDate(r.fecha)}</td><td>${r.modulo}</td><td style="white-space:normal;max-width:220px">${r.descripcion}</td>
      <td><span class="pill ${r.clasificacion==='No conformidad'?'bad':'warn'}">${r.clasificacion}</span></td>
      <td style="white-space:normal;max-width:220px">${r.accion||'—'}</td><td>${r.responsable||'—'}</td>
      <td class="mono">${fmtDate(r.fechaCompromiso)}</td>
      <td><span class="pill ${r.estado==='Cerrada'?'ok':'bad'}">${r.estado}</span></td>
      <td class="mono">${fmtDate(r.fechaCierre)}</td>
      <td><button class="edit-btn" data-id="${r.id}" title="Editar">✎</button> <button class="del-btn" data-id="${r.id}">✕</button></td>
    </tr>`).join('') : `<tr><td colspan="10" class="empty">No hay hallazgos registrados.</td></tr>`;
  tbody.querySelectorAll('.edit-btn').forEach(b=>b.onclick = ()=>{
    const record = DATA.noconformidades.find(x=>x.id===b.dataset.id);
    startEdit('noconformidades', record, renderNCForm);
  });
  tbody.querySelectorAll('.del-btn').forEach(b=>b.onclick = async ()=>{ if(confirm('¿Eliminar este hallazgo?')){ await deleteRecord('noconformidades', b.dataset.id); renderNCTable(); renderNav(); } });
}

/* ============================================================
   CHECKLIST DE AUDITORÍA
   ============================================================ */
function renderChecklist(main){
  const now = new Date();
  const ym = now.toISOString().slice(0,7);

  const botVencidos = DATA.botiquin.filter(x=>x.tipo==='Entrada' && daysUntil(x.caducidad)<0);
  const botPorVencer = DATA.botiquin.filter(x=>{if(x.tipo!=='Entrada') return false; const d=daysUntil(x.caducidad); return d>=0 && d<=30;});
  const extVencidos = DATA.extintores.filter(x=>daysUntil(x.vencimiento)<0);
  const extPorVencer = DATA.extintores.filter(x=>{const d=daysUntil(x.vencimiento); return d>=0 && d<=30;});
  const mktMes = DATA.marketing.filter(m=>m.fecha && m.fecha.startsWith(ym));
  const mktSobrepresupuesto = mktMes.filter(m=>Number(m.invertido||0) > Number(m.presupuesto||0));
  const mktSinResponsable = mktMes.filter(m=>!m.responsable || !m.responsable.trim());
  const cajaMes = DATA.cajachica.filter(g=>g.fecha && g.fecha.startsWith(ym) && g.tipo==='Gasto');
  const cajaSinComprobante = cajaMes.filter(g=>!g.comprobante || !g.comprobante.trim());
  const saldoNegativo = cajaChicaSaldo() < 0;
  const viajesSinComprobante = DATA.viajes.filter(v=>!v.comprobante || !v.comprobante.trim());
  const viajesPendientesViejos = DATA.viajes.filter(v=>v.estado!=='Liquidado' && daysUntil(v.fecha) < -30);
  const ncAbiertas = DATA.noconformidades.filter(n=>n.estado==='Abierta');
  const ncVencidas = ncAbiertas.filter(n=> n.fechaCompromiso && daysUntil(n.fechaCompromiso)<0);
  const incAbiertos = DATA.incidentes.filter(n=>n.estado==='Abierto');
  const incGravesAbiertos = incAbiertos.filter(n=>n.gravedad==='Grave');

  const items = [
    { ok: extVencidos.length===0, label:'Extintores sin vencer', detail: extVencidos.length ? `${extVencidos.length} vencido(s): ${extVencidos.map(x=>x.codigo).join(', ')}` : 'Ninguno vencido', view:'extintores' },
    { ok: extPorVencer.length===0, label:'Extintores no próximos a vencer (30 días)', detail: extPorVencer.length ? `${extPorVencer.length} por vencer: ${extPorVencer.map(x=>x.codigo).join(', ')}` : 'Ninguno por vencer', view:'extintores' },
    { ok: botVencidos.length===0, label:'Botiquín sin productos caducados', detail: botVencidos.length ? `${botVencidos.length} caducado(s): ${botVencidos.map(x=>x.producto).join(', ')}` : 'Ninguno caducado', view:'botiquin' },
    { ok: botPorVencer.length===0, label:'Botiquín sin productos por caducar (30 días)', detail: botPorVencer.length ? `${botPorVencer.length} por caducar: ${botPorVencer.map(x=>x.producto).join(', ')}` : 'Ninguno por caducar', view:'botiquin' },
    { ok: cajaSinComprobante.length===0, label:'Caja chica: gastos del mes con comprobante', detail: cajaSinComprobante.length ? `${cajaSinComprobante.length} sin comprobante: ${cajaSinComprobante.map(x=>x.concepto).join(', ')}` : 'Todos los gastos del mes tienen comprobante', view:'cajachica' },
    { ok: !saldoNegativo, label:'Caja chica: saldo actual no negativo', detail: saldoNegativo ? `Saldo actual: ${fmtMoney(cajaChicaSaldo())} — revisar reposiciones` : `Saldo actual: ${fmtMoney(cajaChicaSaldo())}`, view:'cajachica' },
    { ok: viajesSinComprobante.length===0, label:'Gastos de viaje con comprobante', detail: viajesSinComprobante.length ? `${viajesSinComprobante.length} sin comprobante: ${viajesSinComprobante.map(x=>x.viajero).join(', ')}` : 'Todos con comprobante', view:'viajes' },
    { ok: viajesPendientesViejos.length===0, label:'Sin anticipos de viaje pendientes de rendir por más de 30 días', detail: viajesPendientesViejos.length ? `${viajesPendientesViejos.length} caso(s): ${viajesPendientesViejos.map(x=>x.viajero).join(', ')}` : 'Ninguno atrasado', view:'viajes' },
    { ok: mktSobrepresupuesto.length===0, label:'Campañas dentro del presupuesto aprobado', detail: mktSobrepresupuesto.length ? `${mktSobrepresupuesto.length} sobre presupuesto: ${mktSobrepresupuesto.map(x=>x.campana).join(', ')}` : 'Todas dentro de presupuesto', view:'marketing' },
    { ok: mktSinResponsable.length===0, label:'Campañas con responsable/autorización registrada', detail: mktSinResponsable.length ? `${mktSinResponsable.length} sin responsable: ${mktSinResponsable.map(x=>x.campana).join(', ')}` : 'Todas tienen responsable', view:'marketing' },
    { ok: ncAbiertas.length===0, label:'Sin no conformidades abiertas', detail: ncAbiertas.length ? `${ncAbiertas.length} abierta(s)` : 'No hay hallazgos pendientes', view:'noconformidades' },
    { ok: incGravesAbiertos.length===0, label:'Sin incidentes de seguridad graves abiertos', detail: incGravesAbiertos.length ? `${incGravesAbiertos.length} grave(s) sin cerrar` : 'Ninguno grave pendiente', view:'incidentes' },
    { ok: incAbiertos.length===0, label:'Sin incidentes de seguridad abiertos (cualquier gravedad)', detail: incAbiertos.length ? `${incAbiertos.length} abierto(s)` : 'No hay incidentes pendientes', view:'incidentes' },
    { ok: ncVencidas.length===0, label:'No conformidades sin pasarse de la fecha compromiso', detail: ncVencidas.length ? `${ncVencidas.length} con fecha compromiso vencida` : 'Ninguna vencida', view:'noconformidades' }
  ];
  const totalOk = items.filter(i=>i.ok).length;

  main.innerHTML = `
    <div class="view-header"><div><h2>Checklist de Auditoría</h2><div class="sub">Cálculo automático a partir de los registros actuales — mes ${ym}</div></div></div>
    <div class="cards-row">
      <div class="stat-card" style="border-top-color:${totalOk===items.length?'var(--ok)':'var(--warn)'}">
        <div class="label">Puntos conformes</div>
        <div class="value mono">${totalOk} / ${items.length}</div>
        <div class="note">${totalOk===items.length ? 'Todo conforme por ahora' : 'Revisa los puntos marcados abajo'}</div>
      </div>
    </div>
    <div class="panel"><div class="panel-body" id="checklist-body"></div></div>
    <p style="color:var(--muted);font-size:12px">Este checklist no reemplaza la revisión física (ej. arqueo real de caja o conteo físico del botiquín). Es un punto de partida para saber por dónde empezar.</p>
  `;
  const body = document.getElementById('checklist-body');
  body.innerHTML = items.map(it=>`
    <div class="alert-row">
      <span>${it.ok?'✅':'⚠️'} ${it.label}<br><span style="color:var(--muted);font-size:12px">${it.detail}</span></span>
      <button class="btn-ghost" data-view="${it.view}" style="height:fit-content">Ver módulo</button>
    </div>`).join('');
  body.querySelectorAll('[data-view]').forEach(b=>{
    b.onclick = ()=>{ currentView = b.dataset.view; renderNav(); renderView(); };
  });
}

/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
/* ============================================================
   HISTORIAL DE CAMBIOS (bitácora)
   ============================================================ */
function renderBitacora(main){
  main.innerHTML = `
    <div class="view-header"><div><h2>Historial de Cambios</h2><div class="sub">Quién hizo qué y cuándo — últimas 500 acciones en toda la app</div></div></div>
    <div class="toolbar">
      <input id="f-search" placeholder="Buscar por descripción o usuario...">
      <select id="f-modulo"><option value="">Todos los módulos</option>${[...new Set(Object.values(MOD_LABELS))].map(m=>`<option>${m}</option>`).join('')}</select>
      <select id="f-accion"><option value="">Todas las acciones</option><option>Creó</option><option>Editó</option><option>Cambió estado</option><option>Eliminó</option></select>
    </div>
    <div class="panel"><div class="panel-body" style="padding:0;overflow-x:auto"><table><thead><tr>
      <th>Fecha y hora</th><th>Usuario</th><th>Acción</th><th>Módulo</th><th>Detalle</th>
    </tr></thead><tbody id="tbody"></tbody></table></div></div>
  `;
  document.getElementById('f-search').oninput = renderBitacoraTable;
  document.getElementById('f-modulo').onchange = renderBitacoraTable;
  document.getElementById('f-accion').onchange = renderBitacoraTable;
  renderBitacoraTable();
}
function renderBitacoraTable(){
  const tbody = document.getElementById('tbody');
  const search = (document.getElementById('f-search')?.value||'').toLowerCase();
  const moduloF = document.getElementById('f-modulo')?.value||'';
  const accionF = document.getElementById('f-accion')?.value||'';
  let rows = [...DATA.bitacora].sort((a,b)=>(b.fecha||'').localeCompare(a.fecha||''));
  rows = rows.filter(r=>
    (!moduloF || r.modulo===moduloF) && (!accionF || r.accion===accionF) &&
    (!search || ((r.descripcion||'')+(r.usuario||'')).toLowerCase().includes(search))
  );
  const accionCls = a => a==='Eliminó' ? 'bad' : a==='Cambió estado' ? 'warn' : a==='Editó' ? 'info' : 'ok';
  tbody.innerHTML = rows.length ? rows.slice(0,300).map(r=>{
    const d = new Date(r.fecha);
    const fechaHora = isNaN(d) ? '—' : d.toLocaleString('es-HN', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
    return `<tr><td class="mono">${fechaHora}</td><td>${r.usuario||'—'}</td>
    <td><span class="pill ${accionCls(r.accion)}">${r.accion}</span></td><td>${r.modulo}</td>
    <td style="white-space:normal;max-width:400px">${r.descripcion||'—'}</td></tr>`;
  }).join('') : `<tr><td colspan="5" class="empty">No hay actividad registrada todavía.</td></tr>`;
}

function renderConfig(main){
  main.innerHTML = `
    <div class="view-header"><div><h2>Configuración</h2><div class="sub">Códigos de acceso por rol</div></div></div>
    ${session.roleId==='admin' ? `
    <div class="panel"><div class="panel-body">
      <b style="font-size:13px">📦 Respaldo completo</b>
      <p style="color:var(--muted);font-size:12px;margin:6px 0 10px">Descarga una copia de TODOS los datos de la app (todos los módulos) en un solo Excel. Recomendado: hazlo al menos una vez al mes, como respaldo aparte de tu Hoja de Google.</p>
      <button class="btn-add" id="btn-respaldo" style="margin-left:0">📦 Descargar respaldo completo (.xlsx)</button>
    </div></div>` : ''}
    <div class="panel"><div class="panel-body">
      <p style="color:var(--muted);font-size:13px">Esta aplicación guarda un código de acceso por cada uno de los 8 roles autorizados. Para cambiar el código de un rol, bórralo aquí y esa persona podrá crear uno nuevo la próxima vez que ingrese seleccionando su rol.</p>
      <div id="roles-config"></div>
    </div></div>
  `;
  document.getElementById('btn-respaldo')?.addEventListener('click', descargarRespaldoCompleto);
  renderRolesConfig();
}
function descargarRespaldoCompleto(){
  const wb = XLSX.utils.book_new();
  Object.keys(DATA).forEach(mod=>{
    const rows = DATA[mod];
    const hoja = rows && rows.length ? XLSX.utils.json_to_sheet(rows) : XLSX.utils.aoa_to_sheet([['(sin datos)']]);
    const nombre = (MOD_LABELS[mod] || mod).slice(0,31); // Excel limita a 31 caracteres
    XLSX.utils.book_append_sheet(wb, hoja, nombre);
  });
  const fecha = todayISO();
  XLSX.writeFile(wb, `respaldo-control-auditorias-${fecha}.xlsx`);
}
async function renderRolesConfig(){
  const cfg = await loadAuthConfig();
  const box = document.getElementById('roles-config');
  box.innerHTML = ROLES.map(r=>{
    const has = cfg && cfg.roles[r.id] && cfg.roles[r.id].code;
    return `<div class="alert-row"><span>${r.label}</span>
      <span style="display:flex;gap:10px;align-items:center">
        <span class="pill ${has?'ok':'warn'}">${has?'Código configurado':'Sin configurar'}</span>
        ${has?`<button class="btn-ghost" data-reset="${r.id}" style="padding:4px 10px">Restablecer</button>`:''}
      </span></div>`;
  }).join('');
  box.querySelectorAll('[data-reset]').forEach(btn=>{
    btn.onclick = async ()=>{
      if(!confirm('¿Restablecer el código de este rol? La persona deberá crear uno nuevo al ingresar.')) return;
      const cfg = await loadAuthConfig();
      cfg.roles[btn.dataset.reset] = {code:null};
      await storageSet('auth-config', cfg, true);
      renderRolesConfig();
    };
  });
}

initLogin();
