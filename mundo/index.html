/* Colores de los objetos donde cuelgan los KPIs, en la oficina de Omar. */
const KIND_COL = { cuadro:"#4f8fe0", pizarra:"#3ecf7e", carpeta:"#a9741f",
                   corcho:"#8a6a44", semaforo:"#f5a524" };

/* Un objeto de la oficina. fix = RADAR aun no lo calcula -> SIN ENERGIA:
   monitor apagado, foco fundido, marco vacio (spec 3.6). */
function objetoKpi(sx, sy, kind, fix, on){
  const base = KIND_COL[kind] || "#4f8fe0";
  const col  = fix ? "#3a3e41" : (on ? base : shade(base, 0.42));
  const ink  = fix ? "#2a2d2f" : (on ? "#eae7e0" : "#4a4f52");
  ctx.save();
  if(!on && !fix) ctx.globalAlpha = 0.55;
  if(kind === "cuadro" || kind === "pizarra"){
    ctx.fillStyle = "#101213"; ctx.fillRect(sx, sy, 18, 14);
    ctx.fillStyle = col;       ctx.fillRect(sx+1, sy+1, 16, 12);
    if(!fix){ ctx.fillStyle = ink; ctx.fillRect(sx+3, sy+9, 12, 1); ctx.fillRect(sx+3, sy+6, 8, 1); }
  }else if(kind === "carpeta"){
    ctx.fillStyle = "#101213"; ctx.fillRect(sx+1, sy+4, 16, 10);
    ctx.fillStyle = col;       ctx.fillRect(sx+2, sy+5, 14, 8);
    ctx.fillStyle = shade(col, 1.2); ctx.fillRect(sx+2, sy+3, 6, 2);
  }else if(kind === "corcho"){
    ctx.fillStyle = "#101213"; ctx.fillRect(sx, sy+1, 18, 13);
    ctx.fillStyle = "#8a6a44"; ctx.fillRect(sx+1, sy+2, 16, 11);
    ctx.fillStyle = fix ? "#4a4038" : (on ? "#c9c6bd" : "#6b675f");
    ctx.fillRect(sx+3, sy+4, 5, 6); ctx.fillRect(sx+10, sy+5, 5, 6);
  }else{ /* semaforo colgado del techo */
    ctx.fillStyle = "#3a3e41"; ctx.fillRect(sx+8, sy-6, 1, 7);
    ctx.fillStyle = "#101213"; ctx.fillRect(sx+4, sy+1, 9, 15);
    ctx.fillStyle = fix ? "#2a2d2f" : (on ? "#e5534b" : "#4a2e2c"); ctx.fillRect(sx+6, sy+3, 5, 3);
    ctx.fillStyle = fix ? "#2a2d2f" : (on ? "#f5a524" : "#4a3c22"); ctx.fillRect(sx+6, sy+7, 5, 3);
    ctx.fillStyle = fix ? "#2a2d2f" : (on ? "#3ecf7e" : "#254a35"); ctx.fillRect(sx+6, sy+11, 5, 3);
  }
  ctx.restore();
  if(fix){
    /* cable cortado: cruz roja apagada, para que el hueco se vea */
    ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = "#e5534b"; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(sx+2, sy+2); ctx.lineTo(sx+16, sy+13); ctx.stroke(); ctx.restore();
  }
}

/* =====================================================================
   6. DE LOS DATOS A LA ESCENA
   ===================================================================== */
/* =====================================================================
   QUIEN TIENE LAS MANOS EN QUE EQUIPO, AHORA MISMO
   ---------------------------------------------------------------------
   Una orden esta EN CURSO si no tiene fecha de cierre y su estado no dice
   "Completado". Las dos condiciones hacen falta y no es redundante: hay
   preventivos marcados Completado a los que nadie les puso fecha de cierre,
   y contarlos como abiertos ponia mecanicos trabajando en equipos que ya
   habian salido del taller. Al 25 de septiembre de 2026 son 34 ordenes de
   verdad en curso, con diez mecanicos.

   El amarre con el equipo es por `equipoId`, que es la llave de Firebase, y
   esa llave solo es unica DENTRO de su empresa: por eso se busca por
   `empresa:llave`. Cuando la orden no trae `equipoId` se intenta por el
   texto de `equipo`, que es campo libre y falla seguido — esos quedan sin
   amarrar y se cuentan aparte en vez de colgarse del equipo equivocado. */
function computeEnCurso(){
  const porEquipo = {};
  const sueltas = [];
  /* DOS indices, y los dos van por `eq.id`, NO por la llave con la que el
     equipo esta guardado: el nodo `equipos` es un arreglo en Firebase, asi
     que esa llave es el indice (0, 1, 2...) y no identifica nada. */
  const porId = {}, porCodigo = {};
  Object.keys(state.equipos || {}).forEach(function(k){
    const eq = state.equipos[k];
    if(eq._empresa !== vista) return;        // cada empresa su taller
    const clave = eq._empresa + ":" + (eq.id || "");
    porId[clave] = eq;
    const cod = String(eq.codigo || "").trim().toUpperCase();
    if(cod) porCodigo[eq._empresa + "|" + cod] = clave;
  });
  ["correctivos","preventivos"].forEach(function(nodo){
    const reg = state[nodo] || {};
    Object.keys(reg).forEach(function(k){
      const o = reg[k];
      if(o._empresa !== vista) return;
      /* CERRADA SI CUALQUIER SENAL LO DICE.
         La app guarda "ya termino" en CUATRO campos que no se mantienen
         juntos: `completado`, `estado`, `fechaCierre` y `fechaCompletado`. De
         103 ordenes, 98 se contradicen -- tienen alguna senal de cerrada y
         alguna de abierta. Solo 5 no tienen ninguna.

         Yo miraba `estado` + `fechaCierre` y contaba 33 abiertas. La app de
         Miguel mira `completado` y le muestra 39. Ninguno de los dos numeros
         existe: son dos lecturas distintas del mismo lio. Miguel lo noto
         porque le señalamos un equipo "con preventivo abierto" que en SU
         pantalla no aparecia, y tenia razon.

         Se toma la lectura conservadora: basta UNA senal de cierre para no
         decir que esta abierta. Vale mas callar una orden abierta que
         inventar veintiocho -- eso es lo que hace que nadie le crea al mapa. */
      const est = String(o.estado || "").trim().toLowerCase();
      const cerrada = o.completado === true
                   || est.indexOf("completad") === 0
                   || !!String(o.fechaCierre || "").trim()
                   || !!String(o.fechaCompletado || "").trim();
      if(cerrada) return;
      const tec = String(o.tecnico || "").split(",")
        .map(function(t){ return t.trim(); }).filter(Boolean);
      /* "En proceso" es lo unico que significa que alguien esta trabajando
         AHORA. Todo lo demas --pendiente, en pausa, esperando repuestos-- es
         un equipo detenido con un responsable puesto, que no es lo mismo y
         no se puede dibujar igual. */
      const corriendo = /en proceso/i.test(est);
      const ficha = { correlativo:o.correlativo || "?", estado:o.estado || "sin estado",
                      sistema:o.sistema || "", tecnicos:tec, nodo:nodo, corriendo:corriendo,
                      donde:String(o.ubicacion || "").trim().toLowerCase(),
                      falla:o.falla || o.diagnostico || "" };
      let llave = null;
      if(o.equipoId) llave = o._empresa + ":" + o.equipoId;
      if((!llave || !porId[llave]) && o.equipo){
        /* `equipo` viene como "MT-54 - BAOLI KBG18": interesa el codigo */
        const cod = String(o.equipo).split(/[-\u2013\u2014|]/)[0].trim().toUpperCase();
        const alt = porCodigo[o._empresa + "|" + cod];
        if(alt) llave = alt;
      }
      if(!llave || !porId[llave]){
        ficha.motivo = (o.equipoId === "__cliente__")
          ? "equipo del cliente" : "el equipo ya no esta en la flota";
        sueltas.push(ficha);
        return;
      }
      (porEquipo[llave] = porEquipo[llave] || []).push(ficha);
    });
  });
  return { porEquipo:porEquipo, sueltas:sueltas };
}

function computeFlotaMundo(){
  const equipos = state.equipos || {};
  const ultimo = {};
  NODOS_MANT.forEach(function(nodo){
    const registros = state[nodo];
    if(!registros) return;
    Object.values(registros).forEach(function(r){
      /* SOLO LAS ORDENES DE ESTA EMPRESA. Ademas de lo obvio, esto tapa un
         hoyo viejo: `ultimo` se indexa por `eq.id` pelado, y como el nodo
         `equipos` es un arreglo en Firebase esos id se repiten entre las dos
         empresas. Sin el filtro, una orden de Monhaco podia poner al dia a un
         equipo de MT Rental que casualmente tuviera el mismo indice. */
      if(r._empresa !== vista) return;
      /* SOLO CUENTA LO QUE YA CERRO.
         Antes el unico filtro era `completado === false`, y ese campo casi
         nunca viene: de las 102 ordenes que alimentaban este calculo, 32
         seguian ABIERTAS. O sea que una maquina con trabajo a medio hacer se
         contaba como recien mantenida y salia en verde -- justo al reves.
         Peor: era circular. Abrirle una orden a un equipo lo ponia al dia.
         Se usa el mismo criterio que en computeEnCurso: hay fecha de cierre,
         o el estado dice Completado. */
      /* Misma lectura que en computeEnCurso: cerrada si CUALQUIER senal lo
         dice. Aca el riesgo es al reves --contar como hecho algo que no se
         hizo-- pero la contradiccion es la misma y conviene una sola regla en
         todo el archivo, no dos que se parezcan. */
      const est = String(r.estado || "").trim().toLowerCase();
      const cerrada = r.completado === true
                   || est.indexOf("completad") === 0
                   || !!String(r.fechaCierre || "").trim()
                   || !!String(r.fechaCompletado || "").trim();
      if(!cerrada) return;
      const eqid = primerCampo(r, CAMPOS_MANT_EQUIPOID);
      const f    = aFecha(primerCampo(r, CAMPOS_FECHA));
      if(!eqid || !f) return;
      const snap = aNumero(primerCampo(r, CAMPOS_HOROMETRO_SNAP));
      if(!ultimo[eqid] || f > ultimo[eqid].fecha) ultimo[eqid] = { fecha:f, horometro:snap };
    });
  });

  const taller = [], patio = [], otros = [], renta = [];
  Object.values(equipos).forEach(function(eq){
    /* TALLER-SPS y TALLER-CHOLOMA no son maquinas: son perchas donde el
       taller cuelga ordenes que no van contra un equipo. Se van del mapa. */
    if(esMarcadorDeTaller(eq)) return;
    if(eq._empresa !== vista) return;        // solo la empresa que se mira
    const ev = evalCached(eq, ultimo[eq.id] || null);
    const b  = bucketEstado(eq.estado);
    const it = { eq:eq, ev:ev, bucket:b };
    if(b === "mant")       taller.push(it);
    else if(b === "disp")  patio.push(it);
    else if(b === "renta") renta.push(it);
    else                   otros.push(it);
  });
  /* mismo orden que el dash: con datos por urgencia, los sin datos al final */
  /* POR CODIGO, NO POR URGENCIA.
     Antes se ordenaba por urgencia, y la urgencia se calcula contra la hora
     actual: cambia sola. Peor, al cerrar una orden un equipo se desplomaba en
     la lista y EMPUJABA a todos los demas de casilla. El mapa se reacomodaba
     entero por un cambio de un solo equipo, y eso es justo lo que hace que uno
     no sepa que se movio.
     Con el codigo de por medio, la posicion ES la identidad: el MT-113 esta
     siempre en el mismo lugar de su zona y lo que cambia es su color. La
     urgencia se sigue viendo en la barra, que es donde corresponde. */
  function ordenar(a){
    return a.slice().sort(function(x, y){
      return String(x.ev.codigo || "").localeCompare(String(y.ev.codigo || ""),
        "es", { numeric: true });
    });
  }

  /* --- agrupacion por cliente (SONDEO, ver CAMPOS_CLIENTE arriba) --- */
  const mapa = new Map();
  let sondeado = false;
  renta.forEach(function(it){
    let nom = primerCampo(it.eq, CAMPOS_CLIENTE);
    if(nom != null){ sondeado = true; }
    else nom = primerCampo(it.eq, CAMPOS_UBICACION);
    const key = (nom == null || nom === "") ? "EN CLIENTE" : String(nom).trim().toUpperCase();
    if(!mapa.has(key)) mapa.set(key, []);
    mapa.get(key).push(it);
  });
  /* Por cantidad, de mayor a menor: asi los clientes grandes quedan juntos y
     se ve de un vistazo donde esta el grueso de la flota. Se ordena por
     cantidad Y DESPUES por nombre, que es lo que faltaba antes: sin el
     segundo criterio, dos clientes con la misma cantidad se intercambiaban de
     lugar en cada refresco y el anillo parecia moverse solo. */
  const campo = [...mapa.entries()]
    .sort(function(a,b){
      return (b[1].length - a[1].length) || String(a[0]).localeCompare(String(b[0]), "es");
    })
    .map(function(e){ return { nombre:e[0], sondeado:sondeado, items:ordenar(e[1]) }; });

  return {
    taller: ordenar(taller), patio: ordenar(patio), otros: ordenar(otros), campo: campo,
    total: taller.length + patio.length + otros.length + renta.length,
    renta: renta.length
  };
}

function computePapeles(){
  const sedes = CC_SEDES;
  const out = { por:{}, err:false, sinSede:false, total:0 };
  ESTACIONES.forEach(function(st){ out.por[st.id] = []; });
  if(state.caja === "error" || state.viajes === "error"){ out.err = true; return out; }
  if(!sedes.length){ out.sinSede = true; return out; }

  (Array.isArray(state.caja) ? state.caja : []).forEach(function(r){
    if(!sedes.includes(r.sede)) return;
    out.por[estacionDe(r.estado)].push(r);
    out.total++;
  });
  /* data-viajes no tiene sede: es global de la bitacora. Se marca como
     viatico (_viaje) y solo se muestra si la empresa tiene sede activa. */
  (Array.isArray(state.viajes) ? state.viajes : []).forEach(function(r){
    const c = Object.assign({}, r); c._viaje = true;
    out.por[estacionDe(r.estado)].push(c);
    out.total++;
  });
  ESTACIONES.forEach(function(st){
    out.por[st.id].sort(function(a,b){ return String(b.fecha||"").localeCompare(String(a.fecha||"")); });
  });
  return out;
}

function computeBodega(){
  const out = { sedes:[], err:false };
  if(state.almacen === "error"){ out.err = true; return out; }
  const arr = Array.isArray(state.almacen) ? state.almacen : [];
  const hace7 = Date.now() - 7*86400000;
  const porSede = new Map();
  arr.forEach(function(r){
    const sd = r.sede || "General";
    if(!porSede.has(sd)) porSede.set(sd, { sede:sd, prod:new Map(), entSem:0, salSem:0 });
    const s = porSede.get(sd);
    const q = aNumero(r.cantidad) || 0;
    const esEntrada = String(r.tipo||"").trim().toLowerCase() === "entrada";
    const key = String(r.producto || "—").trim();
    if(!s.prod.has(key)) s.prod.set(key, { producto:key, neto:0, unidad:r.unidad||"" , mov:0 });
    const p = s.prod.get(key);
    p.neto += esEntrada ? q : -q;
    p.mov++;
    const f = aFecha(r.fecha);
    if(f && f.getTime() >= hace7){ if(esEntrada) s.entSem += q; else s.salSem += q; }
  });
  out.sedes = [...porSede.values()].map(function(s){
    return { sede:s.sede, entSem:s.entSem, salSem:s.salSem,
             productos:[...s.prod.values()].sort(function(a,b){ return b.mov - a.mov; }) };
  }).sort(function(a,b){ return a.sede.localeCompare(b.sede); });
  return out;
}

let enCurso = { porEquipo:{}, sueltas:[] };
let encuadrado = false;
function buildScene(){
  scene = { items:[], labels:[] };
  posEnMapa = {}; arco = null;
  enCurso = computeEnCurso();
  const flota   = computeFlotaMundo();
  const papeles = computePapeles();
  const bodega  = computeBodega();
  lastFlota = flota; lastPapeles = papeles;

  const datos = { flota:flota, papeles:papeles, bodega:bodega };

  /* Siempre el distrito de equipos: la oficina esta apagada y la pastilla
     ahora elige empresa, no distrito. `zonaEdificio(datos)` sigue entera mas
     abajo para cuando se quiera devolver. */
  zonaTaller(flota);
  zonaPatio(flota);
  zonaCampo(flota);
  /* La entrada generica "MI OFICINA" ya no se dibuja: ocupaba el ancla S, que
     ahora es la oficina de AI PLANNING, y las dos se pisaban en pantalla.
     Tampoco tiene sentido en el modelo nuevo — la oficina de cada quien es la
     de SU area, no una puerta aparte. La funcion queda por si hace falta
     recuperar la entrada en otro lado; ver el comentario en entradaEdificio(). */
  /* Los pulsos son papeles cruzando el edificio: en el taller no hay nada
     que puedan cruzar, y seguian animandose sobre un mapa donde el edificio
     ni se dibuja. */
  pulsos = [];

  /* "Otros / interno": no tienen zona propia en el spec, pero tampoco
     pueden desaparecer. Van al fondo del patio, en ambar. */
  /* Antes esto cortaba en diez con `.slice(0, 10)`. Se quito: el mundo existe
     para que se vea TODO el fierro, y un equipo que no se dibuja es un equipo
     del que nadie se acuerda. Si son muchos, que se vea que son muchos. */
  if(flota.otros && flota.otros.length && !(state.flotaErr && !state.flotaParcial)){
    const z = ZONA.patio;
    /* DEBAJO DE LA ULTIMA FILA DEL PATIO, no del borde nominal de la zona.
       Este bloque se colocaba con `z.y + z.d - 2.2`, que era el fondo de la
       zona cuando el patio media 12 de alto. Al agrandarlo a 18 la rejilla
       de disponibles paso a terminar MAS ABAJO que ese borde, y los dos se
       montaron: el MT-54 (DEMO/PRESTAMO) quedaba encima del ET-16, a dos
       decimas de distancia. Ahora se calcula igual que la rejilla, que es la
       unica forma de que no se vuelvan a pisar cuando cambie el tamano. */
    const filasPatio = Math.ceil((flota.patio || []).length / 5);
    const y0 = z.y + 1.2 + filasPatio * 2.4 + 1.2;
    flota.otros.forEach(function(it, i){
      ponerEquipo(z.x + 1.5 + (i%5)*3.2, y0 + Math.floor(i/5)*1.9, it.eq, it.ev, { body:"#a9741f" });
    });
    label(w2s(z.x + z.w/2, y0).x, w2s(z.x + z.w/2, y0).y - 46,
          "OTROS / INTERNO · " + flota.otros.length,
          { col:"#a9741f", size:10, w:"700", fam:"disp", box:true, min:LOD.resumen });
  }

  scene.items.sort(function(a,b){ return a.d - b.d; });
  /* EL PRIMER ENCUADRE, CUANDO YA HAY ALGO QUE ENCUADRAR.
     Al arrancar la camara se ponia en `baseScale()` --3 en una pantalla
     ancha-- y el mundo abria pegado a dos o tres montacargas, con el taller y
     el anillo de clientes fuera de pantalla. Nadie sabia que habia mas.
     No se podia encuadrar en el boot porque ahi la escena todavia esta vacia
     y no hay caja que medir; se hace en el primer armado con datos. */
  if(!encuadrado && scene.items.length){ encuadrado = true; encuadrar(); }
  renderZoneNav(flota, papeles, bodega);
  renderLeyenda(flota);
  pintarBusqueda();
  dirty = true;
}
let lastFlota = null, lastPapeles = null;

/* =====================================================================
   7. DIBUJO
   ===================================================================== */
function draw(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = "#17191a";
  ctx.fillRect(0, 0, CW, CH);

  applyCam();
  const v = viewRect();
  for(const it of scene.items){
    const p = w2s(it.gx, it.gy);
    if(p.x < v.x0 - 120 || p.x > v.x1 + 120 || p.y < v.y0 - 140 || p.y > v.y1 + 140) continue;
    it.draw();
  }
  dibujarPulsos();
  dibujarArco();
  dibujarResaltado();
  dibujarResaltados();
  drawLabels();
}
function drawLabels(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.textBaseline = "middle";
  for(const l of scene.labels){
    const s = screenOf(l.x, l.y);
    if(s.x < -160 || s.x > CW+160 || s.y < 44 || s.y > CH-52) continue;
    /* Este es el filtro que vuelve legible el mapa de lejos. Antes habia uno
       por tamano de letra --`size < 9 && cam.scale < 2`-- que no filtraba
       nada: los codigos de equipo son 8.5 y redondean a 9, justo el borde. */
    if(cam.scale < l.min) continue;
    const size = Math.round(l.size * (cam.scale >= 3 ? 1.15 : 1));
    ctx.font = l.w + " " + size + "px " +
      (l.fam === "disp" ? "'Barlow Condensed',sans-serif" : "'IBM Plex Mono',monospace");
    ctx.textAlign = l.al;
    if(l.box){
      const w = ctx.measureText(l.t).width + 10;
      const x = l.al === "left" ? s.x - 5 : s.x - w/2;
      ctx.fillStyle = "rgba(23,25,26,0.85)";
      ctx.fillRect(Math.round(x), Math.round(s.y - size/2 - 3), Math.round(w), size + 6);
    }
    ctx.fillStyle = l.col;
    ctx.fillText(l.t, Math.round(s.x), Math.round(s.y));
  }
}

let raf = null;
/* EL BUCLE NO SE PUEDE MORIR.
   ---------------------------------------------------------------------
   Antes no tenia red: si algo adentro tiraba una excepcion --una funcion que
   no existe, un dato con otra forma-- el `requestAnimationFrame` del final
   nunca se ejecutaba y el mundo quedaba congelado PARA SIEMPRE. Y el sintoma
   no se parecia en nada a la causa: la pantalla se ve normal porque el canvas
   conserva el ultimo cuadro, el puntito verde sigue latiendo porque eso es
   una animacion de CSS, y lo unico que pasa es que nada responde -- ni el
   zoom, ni arrastrar, ni los botones de zona.

   Paso de verdad: al borrar `fichaMecanico` por accidente, tocar un mecanico
   tiraba la excepcion y el mundo se trababa entero.

   Ahora cada cuadro va protegido. Si uno falla se anota UNA vez --no sesenta
   por segundo-- y el siguiente se intenta igual. Un cuadro perdido no se ve;
   un mundo trabado, si. */
let fallosDeCuadro = 0;
function loop(){
  try{ cuadro(); }
  catch(e){
    if(fallosDeCuadro++ === 0) console.error("[Mundo] el cuadro fallo:", e);
  }
  raf = requestAnimationFrame(loop);
}
function cuadro(){
  /* animacion de camara */
  if(cam.tx != null){
    cam.x += (cam.tx - cam.x) * 0.18;
    cam.y += (cam.ty - cam.y) * 0.18;
    if(Math.abs(cam.tx - cam.x) < 0.5 && Math.abs(cam.ty - cam.y) < 0.5){
      cam.x = cam.tx; cam.y = cam.ty; cam.tx = cam.ty = null;
    }
    dirty = true;
  }
  /* animacion del papel que cambio de estacion */
  if(animState.t > 0){ animState.t -= 1.4; if(animState.t <= 0){ animState.t = 0; animState.id = null; } dirty = true; }
  if(pulsos.length) dirty = true;      // mientras algo cruza, el mundo late
  /* El arco se desvanece solo. Dura unos ocho segundos: lo suficiente para
     mirar a donde apunta y soltar el dedo, y no tanto como para quedar
     colgado en pantalla cuando ya se paso a otra cosa. */
  if(equipoResaltado){
    equipoResaltado.t -= 0.0035; dirty = true;
    if(equipoResaltado.t <= 0) equipoResaltado = null;
  }
  /* El arco NO se apaga solo. Se apagaba a los ocho segundos y daba la
     impresion de que alejar la camara lo borraba -- lo que pasaba es que
     mientras uno alejaba, se vencia el tiempo. Ahora queda hasta que se elija
     otro equipo, se cierre el panel, o se toque el piso. */
  if(dirty){ draw(); dirty = false; }
}
const animState = { id:null, t:0 };
function animOf(id){ return (animState.id && animState.id === id) ? animState.t : 0; }

/* =====================================================================
   8. INTERACCION (movil primero: arrastrar para moverse, tocar para ver)
   ===================================================================== */
function worldOf(sx, sy){
  return { x:(sx - CW/2)/cam.scale + cam.x, y:(sy - CH/2)/cam.scale + cam.y };
}
let ptr = { down:false, id:null, x:0, y:0, moved:0 };
cv.addEventListener("pointerdown", function(e){
  ptr.down = true; ptr.id = e.pointerId; ptr.x = e.clientX; ptr.y = e.clientY; ptr.moved = 0;
  cv.setPointerCapture(e.pointerId); cv.classList.add("drag");
});
cv.addEventListener("pointermove", function(e){
  if(!ptr.down || e.pointerId !== ptr.id) return;
  const dx = e.clientX - ptr.x, dy = e.clientY - ptr.y;
  ptr.moved += Math.abs(dx) + Math.abs(dy);
  cam.x -= dx / cam.scale; cam.y -= dy / cam.scale;
  cam.tx = cam.ty = null;
  ptr.x = e.clientX; ptr.y = e.clientY;
  dirty = true;
});
function endPtr(e){
  if(!ptr.down) return;
  ptr.down = false; cv.classList.remove("drag");
  if(ptr.moved < 8) tap(e.clientX, e.clientY);
}
cv.addEventListener("pointerup", endPtr);
cv.addEventListener("pointercancel", function(){ ptr.down = false; cv.classList.remove("drag"); });

function tap(sx, sy){
  const w = worldOf(sx, sy);
  /* de adelante hacia atras: gana el objeto mas cercano a la camara */
  for(let i = scene.items.length - 1; i >= 0; i--){
    const it = scene.items[i];
    if(!it.hit || !it.tap) continue;
    const h = it.hit;
    if(w.x >= h.x && w.x <= h.x + h.w && w.y >= h.y && w.y <= h.y + h.h){
      /* protegido por lo mismo que el bucle: una ficha que revienta no puede
         dejar el mapa sin responder al toque. */
      try{ it.tap(); }catch(e){ console.error("[Mundo] al tocar:", e); }
      return;
    }
  }
  /* toco el piso: se cierra todo */
  cerrarFicha();
  cerrarPanelEquipo();
}

/* teclado en escritorio */
window.addEventListener("keydown", function(e){
  const paso = 60 / cam.scale;
  if(e.key === "ArrowLeft"){ cam.x -= paso; cam.tx = null; dirty = true; }
  else if(e.key === "ArrowRight"){ cam.x += paso; cam.tx = null; dirty = true; }
  else if(e.key === "ArrowUp"){ cam.y -= paso; cam.tx = null; dirty = true; }
  else if(e.key === "ArrowDown"){ cam.y += paso; cam.tx = null; dirty = true; }
  else if(e.key === "Escape"){ cerrarFicha(); }
  else return;
  e.preventDefault();
});
/* rueda = zoom por enteros (escritorio) */
cv.addEventListener("wheel", function(e){ e.preventDefault(); zoom(e.deltaY < 0 ? 1 : -1); }, { passive:false });
/* EL ZOOM IBA DE 1 A 4 Y DE UNO EN UNO, y por eso no se podia alejar: con el
   anillo de clientes el mundo mide mas de 200 casillas de punta a punta, y en
   escala 1 no entra ni la mitad en una pantalla. El minimo ahora se CALCULA
   --lo que haga falta para que quepa el distrito entero, con un margen-- y los
   pasos son multiplicativos, que es como se comporta cualquier mapa: cada
   click acerca o aleja un cuarto, no un entero. */
/* La caja DE LO QUE DE VERDAD SE DIBUJO, no la de las zonas.
   Las cajas de zona mienten por dos lados: `campo` declara un cuadrado de
   112x112 para que la camara sepa a donde ir, pero los clientes viven en un
   anillo y el centro del cuadrado esta vacio; y en isometrico las esquinas
   del cuadrado se estiran mucho mas que el contenido. Encuadrando por la caja
   el mundo salia al 0.12 -- cabia entero y no se leia nada. */
function cajaVisible(){
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, n = 0;
  scene.items.forEach(function(it){
    const q = w2s(it.gx, it.gy);
    if(q.x < x0) x0 = q.x; if(q.x > x1) x1 = q.x;
    if(q.y < y0) y0 = q.y; if(q.y > y1) y1 = q.y;
    n++;
  });
  /* LOS ROTULOS DE ZONA TAMBIEN CUENTAN. Cuelgan bastante mas arriba que el
     piso que nombran, asi que encuadrando solo por los objetos quedaban fuera
     de la pantalla: al alejar del todo no se veia ni TALLER ni DISPONIBLES ni
     CAMPO, que son justo los tres que siempre tienen que estar. */
  scene.labels.forEach(function(l){
    if(l.min) return;                       // solo los que se ven siempre
    if(l.y < y0) y0 = l.y;
    if(l.x - 60 < x0) x0 = l.x - 60;
    if(l.x + 60 > x1) x1 = l.x + 60;
    n++;
  });
  return n ? { x0:x0, x1:x1, y0:y0, y1:y1 } : null;
}
function escalaMinima(){
  const c = cajaVisible();
  if(!c) return 0.35;
  /* 150 px de alto se los comen la barra de arriba y la de zonas */
  const s = Math.min(CW / (c.x1 - c.x0 + 120), (CH - 150) / (c.y1 - c.y0 + 120));
  /* Piso en 0.28: mas lejos que eso el montacargas es un pixel y el mapa deja
     de servir para lo que sirve. Si no cabe, se arrastra. */
  return Math.max(0.28, Math.min(1.2, s));
}
function zoom(dir){
  const min = escalaMinima();
  const n = Math.max(min, Math.min(4, cam.scale * (dir > 0 ? 1.25 : 0.8)));
  if(Math.abs(n - cam.scale) < 0.001) return;
  cam.scale = n; dirty = true;
}
/* Encuadra el distrito entero. Es lo que se quiere al entrar a una vista:
   ver todo y despues acercarse, no aparecer pegado a un montacargas. */
function encuadrar(){
  cam.scale = escalaMinima();
  const c = cajaVisible();
  if(c){
    cam.x = (c.x0 + c.x1) / 2;
    cam.y = (c.y0 + c.y1) / 2;
    cam.tx = cam.x; cam.ty = cam.y;
  }
  dirty = true;
}
document.getElementById("zin").onclick  = function(){ zoom(1); };
document.getElementById("zout").onclick = function(){ zoom(-1); };

/* --------- navegador de zonas --------- */
let zonaActiva = "taller";
function irAZona(id){
  const z = ZONA[id]; if(!z) return;
  const c = centroZona(z);
  cam.tx = c.x; cam.ty = c.y;
  zonaActiva = id;
  document.getElementById("zone-name").textContent = z.nombre;
  [...document.querySelectorAll(".zbtn")].forEach(function(b){
    b.classList.toggle("active", b.dataset.zona === id);
  });
}
function renderZoneNav(flota, papeles, bodega){
  const nav = document.getElementById("zones");
  const hayFlota = !(state.flotaErr && !state.flotaParcial);
  const negs = bodega.err ? "!" : bodega.sedes.reduce((a,s)=>a + s.productos.filter(p=>p.neto<0).length, 0);
  const cont = {
    taller:  { n: hayFlota ? flota.taller.length : "—", alerta: flota.taller.some(function(x){ return x.ev.color === "crit" || x.ev.color === "nodata"; }) },
    patio:   { n: hayFlota ? flota.patio.length : "—" },
    campo:   { n: hayFlota ? flota.renta : "—" },
    bullpen: { n: pulsos.length },
    omar:    { n: selected.size },
    fabri:   { n: (state.radar && typeof state.radar === "object") ? "ok" : "—" },
    hr:      { n: ROLES_MUNDO },
    ventas:  { n: hayFlota ? flota.renta : "—" },
    compras: { n: "—" },
    finanzas:{ n: papeles.err ? "!" : (papeles.por.rev ? papeles.por.rev.length : 0), alerta: !papeles.err && papeles.por.rev.length > 0 },
    almacen: { n: negs, alerta: negs > 0 }
  };
  /* Solo las zonas del fierro. Las del edificio siguen declaradas en ZONAS
     y volverian solas si la oficina se prende. */
  const distrito = "equipos";
  const visibles = ZONAS.filter(function(z){ return z.dist === distrito; });
  nav.innerHTML = visibles.map(function(z){
    const c = cont[z.id] || { n:"" };
    return '<button class="zbtn' + (z.id === zonaActiva ? " active" : "") + (c.alerta ? " alert" : "") +
      '" data-zona="' + z.id + '">' + z.nombre.split(" / ")[0] + ' <b>' + c.n + '</b></button>';
  }).join("");
  [...nav.querySelectorAll(".zbtn")].forEach(function(b){
    b.onclick = function(){ irAZona(b.dataset.zona); };
  });
}

/* =====================================================================
   EL ARCO: DE QUIEN ES ESTE EQUIPO QUE ESTA EN EL TALLER
   ---------------------------------------------------------------------
   Se toca un montacargas del centro y sale una linea amarilla que SALTA por
   encima de todo hasta el sitio de su cliente. Es un arco y no una recta a
   proposito: una recta cruzando el mapa se confunde con un borde de piso o
   con una linea de estacionamiento; un arco que se levanta se lee como un
   vinculo entre dos lugares y no como algo que esta ahi tirado.

   Dura unos segundos y se va sola. Si el equipo no es de ningun cliente
   --porque es nuestro, o porque la app le borro el dueno al entrar-- no sale
   nada: una linea a ningun lado seria peor que ninguna linea.
   ===================================================================== */
let arco = null;       // { gx0,gy0, gx1,gy1, nombre, t }
function mostrarArco(eq){
  /* fuera el rotulo del arco anterior, o se acumulan uno sobre otro */
  scene.labels = scene.labels.filter(function(l){ return !l._arco; });
  const nom = clienteDe(eq);
  /* Si el equipo ESTA en renta, ya esta dibujado adentro del sitio de su
     cliente: el arco iria del sitio a si mismo y no dice nada. El arco existe
     para los que estan en el centro --taller, disponibles-- y uno se pregunta
     de donde salieron. */
  if(bucketEstado(eq.estado) === "renta"){ arco = null; return false; }
  const destino = nom ? sitiosCliente[nom] : null;
  const origen = posEnMapa[eq._empresa + ":" + (eq.id || "")];
  if(!nom || !destino || !origen){ arco = null; return false; }
  arco = { gx0:origen.gx, gy0:origen.gy, gx1:destino.gx, gy1:destino.gy, nombre:nom, t:1 };
  /* El arco YA apunta al sitio, y el sitio YA tiene el nombre del cliente
     escrito encima. Repetirlo a mitad de camino era decir dos veces lo mismo
     y tapar los equipos por donde pasa la linea. */
  dirty = true;
  return true;
}
function dibujarArco(){
  if(!arco) return;
  const a = w2s(arco.gx0, arco.gy0), b = w2s(arco.gx1, arco.gy1);
  const dx = b.x - a.x, dy = b.y - a.y;
  const dist = Math.sqrt(dx*dx + dy*dy);
  /* La altura del salto crece con la distancia pero con tope: si no, un
     cliente en el borde del anillo mandaba el arco fuera de la pantalla. */
  const alto = Math.min(220, 60 + dist * 0.32);
  const cx = (a.x + b.x) / 2, cy = (a.y + b.y) / 2 - alto;
  /* TODO LO QUE SE MIDE EN PIXELES VA DIVIDIDO POR LA ESCALA. Esto se dibuja
     bajo la transformacion de la camara, asi que un `lineWidth` de 2 con la
     camara en 0.3 sale de medio pixel: la linea existia y no se veia. */
  const k = 1 / Math.max(0.05, cam.scale);
  ctx.save();
  ctx.globalAlpha = Math.min(1, arco.t) * 0.95;
  ctx.strokeStyle = "#f5c542";
  ctx.lineWidth = 2.4 * k;
  ctx.setLineDash([8 * k, 6 * k]);
  ctx.lineDashOffset = -((performance.now() / 45) % 14) * k;   // se arrastra al destino
  ctx.beginPath();
  ctx.moveTo(a.x, a.y + HH);
  ctx.quadraticCurveTo(cx, cy, b.x, b.y + HH);
  ctx.stroke();
  ctx.setLineDash([]);
  /* las dos puntas, para que se vea de donde sale y a donde llega */
  ctx.fillStyle = "#f5c542";
  ctx.beginPath(); ctx.arc(a.x, a.y + HH, 3.4 * k, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(b.x, b.y + HH, 4.6 * k, 0, 7); ctx.fill();
  ctx.restore();
}


/* =====================================================================
   EL BUSCADOR
   ---------------------------------------------------------------------
   Buscar el MT-113 obligaba a acercarse y barrer el mapa pedazo por pedazo.
   Dos formas de llegar, porque son dos maneras distintas de acordarse:

     · ESCRIBIENDO, cuando se sabe como se llama. Busca en codigo, marca,
       modelo, serie, cliente y ubicacion -- sin tildes y sin importar
       mayusculas, porque nadie escribe "Plataforma aerea" con la tilde
       puesta desde el telefono.
     · POR TIPO, cuando no se sabe. El arbol arranca cerrado y se abre el
       tipo que interese.

   El tipo viene escrito a mano en la app y por eso hay "MONTACARGAS" (63) y
   "Montacargas" (26) como si fueran dos cosas. Se juntan para mostrarlos.
   ===================================================================== */
let buscAbierto = {};        // que grupos del arbol estan desplegados
let equipoResaltado = null;  // { clave, t } -- el aro que se pinta al llegar

function sinTildesB(x){
  return String(x || "").toLowerCase().replace(/\u00f1/g, "\u0001")
    .normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\u0001/g, "\u00f1");
}
/* NADIE ESCRIBE EL GUION. "mt113", "mt 113" y "MT-113" son la misma busqueda
   y las tres tienen que llegar al mismo equipo. Se comparan las dos puntas
   sin nada que no sea letra o numero, asi que el guion, el espacio y el punto
   dejan de importar. Se busca en las DOS formas: la pelada encuentra
   "mt113", y la normal deja que "genie gs" siga andando como dos palabras. */
function pelar(x){ return sinTildesB(x).replace(/[^a-z0-9]/g, ""); }
function tipoDe(eq){
  const t = String(eq.tipo || "").trim();
  return t ? t.toUpperCase() : "SIN TIPO";
}
/* Todo lo que esta dibujado en el mapa, que es lo unico a lo que se puede
   volar. Un equipo vendido no esta en la escena y no tiene sentido buscarlo. */
function equiposBuscables(){
  const f = lastFlota; if(!f) return [];
  const out = [];
  [].concat(f.taller || [], f.patio || [], f.otros || [],
            (f.campo || []).reduce(function(a, g){ return a.concat(g.items); }, []))
    .forEach(function(it){
      out.push({ eq: it.eq, ev: it.ev,
                 clave: it.eq._empresa + ":" + (it.eq.id || ""),
                 texto: sinTildesB([it.ev.codigo, it.eq.marca, it.eq.modelo, it.eq.serie,
                                    it.eq.cliente, it.eq.ubicacion, it.eq.desc].join(" ")),
                 pelado: pelar([it.ev.codigo, it.eq.marca, it.eq.modelo, it.eq.serie,
                                it.eq.cliente, it.eq.ubicacion, it.eq.desc].join(" ")) });
    });
  return out;
}

/* LO DE LA OTRA EMPRESA, PARA QUE SEPARAR NO SEA ESCONDER.
   Si alguien busca MT-113 estando en Monhaco, la respuesta honesta no es
   "nada calza": es "existe, pero es de MT Rental". Van sin `ev` --la urgencia
   se calcula dentro de computeFlotaMundo, que solo mira la empresa activa--
   asi que se rotulan y ya; al tocarlos se cambia de empresa y ahi si tienen
   todo. */
function buscablesDeLaOtra(){
  const otra = (vista === "montasa") ? "monhaco" : "montasa";
  const out = [];
  Object.keys(state.equipos || {}).forEach(function(k){
    const eq = state.equipos[k];
    if(!eq || eq._empresa !== otra) return;
    if(esMarcadorDeTaller(eq)) return;
    const txt = [eq.codigo, eq.marca, eq.modelo, eq.serie,
                 eq.cliente, eq.ubicacion, eq.desc].join(" ");
    out.push({ eq:eq, otra:otra, clave: otra + ":" + (eq.id || ""),
               texto: sinTildesB(txt), pelado: pelar(txt) });
  });
  return out;
}

/* Cambia de empresa y despues vuela: las posiciones del mapa las arma
   `buildScene`, asi que hasta que no corre no hay a donde ir. */
function volarAOtraEmpresa(item){
  cambiarVista(item.otra);
  const x = equiposBuscables().find(function(y){ return y.clave === item.clave; });
  if(x) volarA(x);
  else cerrarBusqueda();     // esta vendido o fuera del mapa; no hay a donde ir
}

function volarA(item){
  const p = posEnMapa[item.clave];
  if(!p) return;
  const q = w2s(p.gx, p.gy);
  cam.tx = q.x; cam.ty = q.y;               // la camara se anima sola hacia ahi
  cam.scale = Math.max(cam.scale, 1.8);     // lo suficiente para leer el codigo
  equipoResaltado = { clave: item.clave, t: 1 };
  fichaEquipo(item.eq, item.ev, (enCurso.porEquipo || {})[item.clave]);
  cerrarBusqueda();          // ya encontro lo que buscaba; la lista estorba
  dirty = true;
}

/* El aro que dice "es este". Se apaga solo: si quedara fijo, a la tercera
   busqueda el mapa estaria lleno de aros y ninguno diria nada. */
function dibujarResaltado(){
  if(!equipoResaltado) return;
  const p = posEnMapa[equipoResaltado.clave];
  if(!p){ equipoResaltado = null; return; }
  const q = w2s(p.gx, p.gy), k = 1 / Math.max(0.05, cam.scale);
  const pulso = 1 + 0.12 * Math.sin(performance.now() / 180);
  ctx.save();
  ctx.globalAlpha = Math.min(1, equipoResaltado.t);
  ctx.strokeStyle = "#f5c542"; ctx.lineWidth = 2.2 * k;
  ctx.beginPath();
  ctx.ellipse(q.x, q.y + HH, 20 * k * pulso, 10 * k * pulso, 0, 0, Math.PI * 2);
  ctx.stroke();
  ctx.restore();
}

function pintarBusqueda(){
  const caja = document.getElementById("busc-res");
  if(!caja) return;
  const q = sinTildesB(document.getElementById("busc-txt").value.trim());
  const todos = equiposBuscables();
  const H = [];
  /* EL ARBOL ARRANCA CERRADO Y SE CIERRA SOLO.
     Antes quedaba desplegado ocupando media pantalla aunque uno ya hubiera
     encontrado lo que buscaba. La lista solo existe mientras se busca: hay
     texto escrito, o se toco el boton de ver los tipos. */
  if(!q && !buscListo){ caja.innerHTML = ""; return; }

  if(q){
    const qp = pelar(q);
    const hits = todos.filter(function(x){
      return x.texto.indexOf(q) >= 0 || (qp && x.pelado.indexOf(qp) >= 0); })
                      .sort(function(a, b){
                        return String(a.ev.codigo).localeCompare(String(b.ev.codigo), "es",
                          { numeric: true }); });
    const qp2 = pelar(q);
    const ajenos = buscablesDeLaOtra().filter(function(x){
      return x.texto.indexOf(q) >= 0 || (qp2 && x.pelado.indexOf(qp2) >= 0); })
                   .sort(function(a, b){
                     return String(a.eq.codigo || "").localeCompare(String(b.eq.codigo || ""),
                       "es", { numeric: true }); });
    if(!hits.length && !ajenos.length){
      caja.innerHTML = '<div class="vacio">Nada calza con \u201c' + esc(q) + '\u201d.</div>';
      return;
    }
    hits.slice(0, 40).forEach(function(x){ H.push(renglon(x)); });
    if(hits.length > 40) H.push('<div class="vacio">\u2026y ' + (hits.length - 40) + ' mas.</div>');
    if(ajenos.length){
      H.push('<div class="grupo otra"><span>En ' +
             esc(NOMBRE_EMPRESA[ajenos[0].otra] || ajenos[0].otra) +
             '</span><span>' + ajenos.length + '</span></div>');
      ajenos.slice(0, 20).forEach(function(x){ H.push(renglonAjeno(x)); });
      if(ajenos.length > 20)
        H.push('<div class="vacio">\u2026y ' + (ajenos.length - 20) + ' mas ah\u00ed.</div>');
    }
  }else{
    /* el arbol por tipo */
    const porTipo = {};
    todos.forEach(function(x){ (porTipo[tipoDe(x.eq)] = porTipo[tipoDe(x.eq)] || []).push(x); });
    Object.keys(porTipo).sort(function(a, b){ return a.localeCompare(b, "es"); })
      .forEach(function(t){
        const lista = porTipo[t].sort(function(a, b){
          return String(a.ev.codigo).localeCompare(String(b.ev.codigo), "es", { numeric: true }); });
        H.push('<div class="grupo" data-tipo="' + esc(t) + '"><span>' +
               (buscAbierto[t] ? "\u25be " : "\u25b8 ") + esc(t) + '</span><span>' +
               lista.length + '</span></div>');
        if(buscAbierto[t]) lista.forEach(function(x){ H.push(renglon(x)); });
      });
  }
  caja.innerHTML = H.join("");

  [...caja.querySelectorAll(".grupo")].forEach(function(g){
    g.onclick = function(){
      const t = g.dataset.tipo;
      buscAbierto[t] = !buscAbierto[t];
      pintarBusqueda();
    };
  });
  [...caja.querySelectorAll(".it")].forEach(function(el){
    el.onclick = function(){
      if(el.dataset.otra){
        volarAOtraEmpresa({ otra: el.dataset.otra, clave: el.dataset.clave });
        return;
      }
      const x = todos.find(function(y){ return y.clave === el.dataset.clave; });
      if(x) volarA(x);
    };
  });

  /* Sin punto de urgencia a proposito: no esta calculada para esta empresa y
     un punto gris se leeria como "sin datos", que es otra cosa. */
  function renglonAjeno(x){
    return '<div class="it ajeno" data-otra="' + esc(x.otra) +
      '" data-clave="' + esc(x.clave) + '">' +
      '<span class="p" style="background:transparent;border:1px solid #565b5f"></span>' +
      '<b>' + esc(x.eq.codigo || "\u2014") + '</b>' +
      '<span class="d">' + esc([x.eq.marca, "ir \u2192"].filter(Boolean).join(" \u00b7 ")) +
      '</span></div>';
  }

  function renglon(x){
    const donde = { mant:"taller", disp:"disponible", renta:"cliente", uso:"interno" }[
      bucketEstado(x.eq.estado)] || "";
    const col = COL_URG[x.ev.color] || "#565b5f";
    return '<div class="it" data-clave="' + esc(x.clave) + '">' +
      '<span class="p" style="background:' + col + '"></span>' +
      '<b>' + esc(x.ev.codigo) + '</b>' +
      '<span class="d">' + esc([x.eq.marca, donde].filter(Boolean).join(" \u00b7 ")) + '</span></div>';
  }
}

const ETQ_URG = { ok:"al día", warn:"por vencer", crit:"vencido", nodata:"SIN DATOS" };
function fichaEquipo(eq, ev, trabajo){
  const b = bucketEstado(eq.estado);
  const zonaTxt = { mant:"En el taller", disp:"Disponible", renta:"En cliente", uso:"Otros / interno" }[b];
  const ubic  = primerCampo(eq, CAMPOS_UBICACION);
  const horo  = aNumero(primerCampo(eq, CAMPOS_HOROMETRO_ACT));
  const duenio = clienteDe(eq);
  const H = [];

  function fila(k, v){ H.push('<div class="fila"><span>' + esc(k) + '</span><b>' + esc(v) + '</b></div>'); }

  fila("Empresa", eq._nombreEmpresa || "\u2014");
  fila("Estado", eq.estado || "\u2014");
  fila("D\u00f3nde est\u00e1", zonaTxt);
  fila("Ubicaci\u00f3n", ubic != null ? ubic : "\u2014");
  fila("Due\u00f1o", duenio || "Nuestro");
  fila("Marca / modelo", [eq.marca, eq.modelo].filter(Boolean).join(" ") || "\u2014");
  if(eq.serie) fila("Serie", eq.serie);

  H.push('<h5>Mantenimiento</h5>');
  fila("Estado", ETQ_URG[ev.color] + (ev.urgencia != null ? " \u00b7 " + ev.etiqueta : ""));
  fila("Urgencia", ev.urgencia != null ? Math.round(ev.urgencia * 100) + "%" : "\u2014");
  fila("Hor\u00f3metro", horo != null ? horo.toLocaleString("es-HN") + " h" : "\u2014");

  /* Lo que se le esta haciendo AHORA. `ubicacion` de la orden es el dato que
     dice si la maquina vino al taller (`plantel`) o si mandamos al mecanico
     hasta donde esta (`campo`) -- son dos operaciones distintas y cuestan
     distinto. Cuando el campo viene vacio se dice, no se supone. */
  const ts = trabajo || [];
  if(ts.length){
    H.push('<h5>' + (ts.length === 1 ? "Orden abierta" : ts.length + " \u00f3rdenes abiertas") + '</h5>');
    ts.forEach(function(t){
      const quienes = t.tecnicos.length ? t.tecnicos.join(", ") : "sin responsable";
      const donde = t.donde === "campo" ? "fuimos hasta el equipo"
                  : t.donde === "plantel" ? "vino al taller"
                  : "no dice si vino o fuimos";
      H.push('<div class="orden">' +
        '<div class="q">' + esc(t.correlativo) + ' \u00b7 ' +
          esc(t.nodo === "correctivos" ? "Correctivo" : "Preventivo") + '</div>' +
        '<div>' + esc(t.estado) + (t.sistema ? ' \u00b7 ' + esc(t.sistema) : '') + '</div>' +
        '<div class="m' + (t.corriendo && t.tecnicos.length ? '' : ' quieto') + '">' +
          esc(quienes) + '</div>' +
        '<div style="color:#6f757a">' + esc(donde) + '</div>' +
      '</div>');
    });
  }

  if(ts.length && b !== "mant"){
    H.push('<div class="aviso"><b>Tiene trabajo abierto y no figura en el taller.</b> ' +
           'La app solo pone el equipo en mantenimiento si la orden se crea <i>sin</i> marcar ' +
           '"finalizar", y solo lo devuelve si al cerrar segu\u00eda en mantenimiento. Por uno de ' +
           'esos dos caminos qued\u00f3 como <b>' + esc(eq.estado || "?") + '</b>. ' +
           'Mientras tanto el tablero de flota lo cuenta como si estuviera libre.</div>');
  }
  if(ev.color === "nodata"){
    H.push('<div class="aviso">Se dibuja <b>transparente</b> porque la base no tiene ni fecha ' +
           'de \u00faltimo mantenimiento ni hor\u00f3metro con qu\u00e9 comparar. No es que est\u00e9 bien: ' +
           'es que no se sabe.</div>');
  }else if(ev.color === "crit"){
    H.push('<div class="aviso">Pasado del intervalo (' + INTERVALO_DIAS + ' d\u00edas / ' +
           INTERVALO_HORAS + ' h). La barra se sale del marco a prop\u00f3sito.</div>');
  }
  if(ev.sinCodigo){
    H.push('<div class="aviso">Este equipo <b>no tiene c\u00f3digo de flota</b>. En la base ese ' +
           'campo trae ' + (ev.serie ? 'el n\u00famero de serie' : 'la marca') + ', no un MT-## ni ' +
           'un E-##. Hay que cargarlo en la app.</div>');
  }
  if(b === "mant" && !duenio){
    H.push('<div class="aviso gris">No sale línea a ningún cliente: para la base este equipo ' +
           'es nuestro. Nació así: en la lista semilla de la app de taller ya venía con ' +
           '<b>TALLER MONTASA</b> en el campo de cliente. Nunca tuvo dueño registrado — no ' +
           'es que se haya perdido.</div>');
  }

  document.getElementById("eqp-kick").textContent = zonaTxt;
  document.getElementById("eqp-nom").textContent = ev.codigo;
  const cuerpo = document.getElementById("eqp-cuerpo");
  cuerpo.innerHTML = H.join("");
  if(duenio && sitiosCliente[duenio] && b !== "renta"){
    const btn = document.createElement("button");
    btn.id = "eqp-ver";
    btn.textContent = "Ver de qui\u00e9n es \u2192";
    btn.onclick = function(){ mostrarArco(eq); };
    cuerpo.appendChild(btn);
  }
  document.getElementById("eqp").classList.add("abierto");
  cerrarFicha();
}
/* TODO LO DE UN CLIENTE, ESTE DONDE ESTE.
   ---------------------------------------------------------------------
   Un cliente no vive solo en su sitio del anillo: cuando una maquina suya se
   rompe, se la traemos y pasa a estar en nuestro taller. Mirando el anillo se
   ve una parte; mirando el taller se ve la otra, mezclada con las nuestras.
   Esta ficha las junta y dice de cada una donde esta.

   Es la unica vista que cruza las dos mitades del mapa, y por eso importa:
   "Elcatex tiene 27, pero dos estan adentro con nosotros" es una frase que
   antes habia que armar a mano. */
function fichaCliente(nombre){
  const nom = String(nombre || "").toUpperCase();
  const mios = [];
  Object.values(state.equipos || {}).forEach(function(eq){
    if(clienteDe(eq) !== nom) return;
    mios.push({ eq: eq, ev: evalCached(eq, null), b: bucketEstado(eq.estado) });
  });
  mios.sort(function(a, b){
    return String(a.ev.codigo).localeCompare(String(b.ev.codigo), "es", { numeric: true });
  });
  const enSitio  = mios.filter(function(x){ return x.b === "renta"; });
  const conNoso  = mios.filter(function(x){ return x.b === "mant" || x.b === "disp"; });
  const otros    = mios.filter(function(x){ return x.b === "uso"; });

  const H = [];
  function bloque(titulo, lista, nota){
    if(!lista.length) return;
    H.push('<h5>' + esc(titulo) + ' \u00b7 ' + lista.length + '</h5>');
    if(nota) H.push('<div style="color:#6f757a;font-size:10.5px;margin:-2px 0 4px">' +
                    esc(nota) + '</div>');
    lista.forEach(function(x){
      const col = COL_URG[x.ev.color] || "#565b5f";
      const donde = { mant:"en taller", disp:"disponible", renta:"en su planta",
                      uso:"interno" }[x.b] || "";
      H.push('<div class="fila"><span><span style="display:inline-block;width:7px;' +
        'height:7px;border-radius:50%;background:' + col + ';margin-right:6px"></span>' +
        esc(x.ev.codigo) + '</span><b>' + esc(donde) + '</b></div>');
    });
  }
  bloque("En su planta", enSitio);
  bloque("Con nosotros", conNoso,
         "se las trajimos: estan en nuestro taller o en el patio");
  bloque("Otros", otros);

  if(!mios.length){
    H.push('<div class="aviso gris">No hay equipos con este cliente cargado. ' +
           'El sitio existe porque alguno lo tuvo antes.</div>');
  }else if(!conNoso.length){
    H.push('<div class="aviso gris">No tiene ninguno con nosotros: todo lo suyo ' +
           'est\u00e1 en su planta.</div>');
  }

  document.getElementById("eqp-kick").textContent = "Cliente";
  document.getElementById("eqp-nom").textContent = nom;
  document.getElementById("eqp-cuerpo").innerHTML = H.join("");
  document.getElementById("eqp").classList.add("abierto");
  /* se resaltan en el mapa los que estan con nosotros, que son los que
     cuestan de encontrar */
  resaltarVarios(conNoso.map(function(x){ return x.eq._empresa + ":" + (x.eq.id || ""); }));
  cerrarFicha();
}

/* Varios aros a la vez. Sirve para "estos son los tuyos que tengo yo". */
let resaltados = [];
function resaltarVarios(claves){
  resaltados = (claves || []).filter(function(k){ return !!posEnMapa[k]; });
  arco = null;
  scene.labels = scene.labels.filter(function(l){ return !l._arco; });
  dirty = true;
}
function dibujarResaltados(){
  if(!resaltados.length) return;
  const k = 1 / Math.max(0.05, cam.scale);
  const pulso = 1 + 0.12 * Math.sin(performance.now() / 180);
  ctx.save();
  ctx.strokeStyle = "#4f8fe0"; ctx.lineWidth = 2 * k; ctx.globalAlpha = 0.95;
  resaltados.forEach(function(clave){
    const p = posEnMapa[clave]; if(!p) return;
    const q = w2s(p.gx, p.gy);
    ctx.beginPath();
    ctx.ellipse(q.x, q.y + HH, 19 * k * pulso, 9.5 * k * pulso, 0, 0, Math.PI * 2);
    ctx.stroke();
  });
  ctx.restore();
}

function cerrarPanelEquipo(){
  document.getElementById("eqp").classList.remove("abierto");
  /* el arco y los aros son de lo que se estaba mirando: se van con ello */
  arco = null;
  resaltados = [];
  scene.labels = scene.labels.filter(function(l){ return !l._arco; });
  dirty = true;
}

/* Al tocar al mecanico se cuenta que esta haciendo EN ESE EQUIPO, no su
   historial: el que toca esta parado frente a una maquina y esa es la
   pregunta. El historial por tecnico ya lo da `taller-tiempos`. */
function fichaMecanico(nombre, trabajo){
  /* "sin asignar" no es un mecanico: es el fantasma. Sus ordenes son
     justamente las que NO tienen a nadie. */
  const fantasma = (nombre === "sin asignar");
  const mias = (trabajo || []).filter(function(t){
    return fantasma ? !t.tecnicos.length : t.tecnicos.indexOf(nombre) >= 0; });
  const pares = mias.map(function(t){
    return [t.correlativo + " · " + (t.nodo === "correctivos" ? "Correctivo" : "Preventivo"),
            [t.estado, t.sistema].filter(Boolean).join(" · ") || "—"];
  });
  const acomp = [];
  mias.forEach(function(t){
    t.tecnicos.forEach(function(n){ if(n !== nombre && acomp.indexOf(n) < 0) acomp.push(n); });
  });
  if(acomp.length) pares.push(["Con", acomp.join(", ")]);
  const falla = (mias[0] && mias[0].falla) ? mias[0].falla : "";
  const nota = falla ? '<div class="note">' + esc(String(falla).slice(0, 220)) + '</div>' : "";
  const aviso = fantasma
    ? '<div class="note warn">Hay trabajo abierto en este equipo y <b>nadie figura ' +
      'como responsable</b>. No es que no lo estén atendiendo: es que la orden no ' +
      'tiene técnico cargado. Se arregla en la app de taller.</div>'
    : '';
  abrirFicha('<div class="kicker">' + (fantasma ? "Orden sin responsable" : "Mecánico") +
    '</div><h2 class="display">' + esc(fantasma ? "Sin asignar" : nombre) + '</h2>' +
    rows(pares) + aviso + nota);
}

function fichaPapel(r, st){
  const esCaja = !r._viaje;
  const pares = esCaja ? [
    ["Estación", st.titulo], ["Estado", r.estado], ["Fecha", r.fecha],
    ["Sede", r.sede], ["Tipo", r.tipo], ["Categoría", r.categoria],
    ["Monto", fmtL(r.monto)], ["Responsable", r.responsable],
    ["Registrado por", r.registradoPor], ["Comprobante", r.comprobante],
    ["Decidido por", r.decididoPor]
  ] : [
    ["Estación", st.titulo], ["Estado", r.estado], ["Fecha", r.fecha],
    ["Viajero", r.viajero], ["Destino", r.destino], ["Motivo", r.motivo],
    ["Monto", fmtL(r.monto)], ["Anticipo", fmtL(r.anticipo)],
    ["Registrado por", r.registradoPor]
  ];
  let acc = "";
  if(String(r.estado).trim() === "Enviado a revisión"){
    if(esCaja){
      acc = '<div class="acts"><button class="ok" id="ap">Aprobar</button>' +
            '<button class="no" id="rz">Rechazar</button></div>' +
            '<div class="note">Al decidir, el papel se desliza a la siguiente estación: ' +
            'lo que se mueve es el registro en Firebase, no una animación decorativa.</div>';
    }else{
      acc = '<div class="note">Los viáticos se aprueban desde la app de bitácora. ' +
            'El dash solo escribe caja chica (decidirCajaChica), así que acá tampoco se inventa esa escritura.</div>';
    }
  }
  abrirFicha('<div class="kicker">' + (esCaja ? "Caja chica" : "Viáticos") + '</div><h2 class="display">' +
    esc(esCaja ? r.concepto : (r.motivo || r.destino)) + '</h2>' + rows(pares) + acc);
  const ap = document.getElementById("ap"), rz = document.getElementById("rz");
  if(ap && rz){
    const btns = [ap, rz];
    ap.onclick = function(){ decidirCajaChica(r.id, "aprobar", btns); };
    rz.onclick = function(){ decidirCajaChica(r.id, "rechazar", btns); };
  }
}

function fichaKpi(k, meta, fix){
  const on = selected.has(k.id);
  const pares = [
    ["Grupo", k.grupo + ". " + k.gTitle],
    ["Objeto", meta.kind],
    ["Colgado en la pared", on ? "sí" : "no"],
    ["Fuente", fix ? "RADAR aún no lo calcula" : "RADAR / Firebase"]
  ];
  const nota = fix
    ? '<div class="note warn">Objeto sin energía: <b>' + esc(NO_DISP[k.id]) + '</b> no viene en el ' +
      'JSON de RADAR. El hueco de capacidad se ve en el mundo, igual que el hueco de datos en el taller. ' +
      'Se puede colgar igual, pero el tile del dash va a decir "RADAR aún no lo calcula".</div>'
    : '<div class="note">Colgarlo o descolgarlo cambia también los tiles del dash: ' +
      'ambos leen la misma llave <b>dash_kpis</b> del navegador.</div>';
  abrirFicha('<div class="kicker">KPI ' + esc(k.id) + '</div><h2 class="display">' + esc(k.label) + '</h2>' +
    rows(pares) +
    '<div class="acts"><button id="tg">' + (on ? "Descolgar" : "Colgar en la pared") + '</button></div>' + nota);
  document.getElementById("tg").onclick = function(){
    if(selected.has(k.id)) selected.delete(k.id); else selected.add(k.id);
    saveSel(); buildScene(); cerrarFicha();
    showToast(selected.has(k.id) ? ("Colgado · " + k.id) : ("Descolgado · " + k.id));
  };
}

/* --------- escritura: aprobar / rechazar caja chica ---------
   COPIA de decidirCajaChica de ../index.html, con el toque del mundo:
   al terminar marca el papel para que entre deslizandose a su nueva mesa. */
async function decidirCajaChica(id, decision, btns){
  btns.forEach(function(b){ b.disabled = true; });
  try{
    const res = await fetch(CC_FB + "/data-cajachica.json?_=" + Date.now(), { cache:"no-store" });
    if(!res.ok) throw new Error("HTTP " + res.status);
    const arr = await res.json();
    if(!Array.isArray(arr)) throw new Error("no hay datos de caja chica");
    const i = arr.findIndex(function(x){ return x.id === id; });
    if(i === -1) throw new Error("id no encontrado");
    if(["Aprobado por Gerencia","Rechazado","Liquidado"].includes(arr[i].estado))
      throw new Error("ya fue decidido (estado: " + arr[i].estado + ")");
    arr[i].estado      = (decision === "aprobar") ? "Aprobado por Gerencia" : "Rechazado";
    arr[i].decididoPor = "Omar";
    arr[i].decididoEn  = new Date().toISOString();
    const put = await fetch(CC_FB + "/data-cajachica.json", {
      method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(arr)
    });
    if(!put.ok) throw new Error("no se pudo guardar (HTTP " + put.status + ")");
    try{
      const bRes = await fetch(CC_FB + "/data-bitacora.json?_=" + Date.now(), { cache:"no-store" });
      let bit = bRes.ok ? await bRes.json() : null;
      if(!Array.isArray(bit)) bit = [];
      bit.unshift({ id:"mundo_"+Date.now(), fecha:new Date().toISOString(), accion:"Cambió estado",
        modulo:"Caja Chica", descripcion:"Gasto "+id+" → "+arr[i].estado+" (desde el Mundo)", usuario:"Omar" });
      await fetch(CC_FB + "/data-bitacora.json", { method:"PUT",
        headers:{"Content-Type":"application/json"}, body: JSON.stringify(bit.slice(0,500)) });
    }catch(bErr){ console.warn("[Mundo] no se pudo registrar en bitácora:", bErr.message); }

    state.caja = arr;
    animState.id = id; animState.t = 40;      // el papel se desliza a su nueva mesa
    buildScene();
    irAZona("conta");
    cerrarFicha();
    showToast((decision === "aprobar" ? "Aprobado" : "Rechazado") + " · " + id);
  }catch(e){
    console.error("[Mundo] ERROR al decidir:", e.message);
    btns.forEach(function(b){ b.disabled = false; });
    showToast("No se pudo guardar: " + e.message);
  }
}

/* =====================================================================
   10. ARRANQUE Y REFRESCO (60 s, igual que el dash)
   ===================================================================== */
function setConn(ok){
  document.getElementById("conn-dot").classList.toggle("off", !ok);
  document.getElementById("conn-txt").textContent = ok ? "EN LINEA" : "SIN CONEXION";
  state.conn = ok;
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(showToast._t); showToast._t = setTimeout(function(){ t.classList.remove("show"); }, 2200);
}

let cargando = false;
async function refrescar(){
  if(cargando) return;
  cargando = true;
  try{
    state.stamp++; evalCache.clear();
    const [ , caja, viajes, almacen ] = await Promise.all([
      cargarFlota(),
      cargarBitacora("data-cajachica"),
      cargarBitacora("data-viajes"),
      cargarBitacora("data-almacen")
    ]);
    state.caja = caja; state.viajes = viajes; state.almacen = almacen;
    /* lo que cruza el edificio sale de acá; si falla, no cruza nada */
    const [enc, mej] = await Promise.all([
      cargarBitacora("mundo-encargos"), cargarBitacora("mundo-mejoras")
    ]);
    state.encargos = comoLista(enc);
    state.mejoras  = comoLista(mej);
    await cargarRadar();
    if(!state.fxHNL) await cargarFx();
    const hayAlgo = (!state.flotaErr) || caja !== "error";
    setConn(hayAlgo);
    document.getElementById("hint").style.display = "none";
    buildScene();
  }catch(e){
    console.error("[Mundo] refresco:", e.message);
    setConn(false);
    buildScene();
  }finally{ cargando = false; }
}

/* Cambiar de vista NO recarga nada: los datos son los mismos, lo que cambia
   es a donde mira la camara. Antes cambiar de pastilla volvia a pedir todo a
   Firebase y a RADAR, y habia que esperar dos segundos para ver algo que ya
   estaba en memoria. */
function cambiarVista(cual){
  if(cual !== "montasa" && cual !== "monhaco") return;
  vista = cual;
  [...document.querySelectorAll(".pill")].forEach(function(b){
    const on = b.dataset.vista === cual;
    b.classList.toggle("active", on);
    b.setAttribute("aria-selected", on ? "true" : "false");
  });
  cerrarFicha();
  /* zonaActiva ANTES de armar la escena: `renderZoneNav` corre dentro de
     `buildScene` y es quien prende el boton de zona. Al reves --como estaba--
     quedaba marcada la zona vieja hasta el siguiente refresco. */
  zonaActiva = "taller";
  buildScene();
  document.getElementById("zone-name").textContent = (ZONA.taller||{}).nombre || "";
  /* Se encuadra de nuevo porque las dos flotas no son del mismo tamano: el
     encuadre de una deja a la otra fuera de pantalla o perdida en el negro. */
  encuadrar();
}
[...document.querySelectorAll(".pill")].forEach(function(b){
  b.onclick = function(){ if(b.dataset.vista !== vista) cambiarVista(b.dataset.vista); };
});

/* boot */
resize();
cam.scale = baseScale();
renderZoneNav({ taller:[], patio:[], renta:0, disp:[], campo:[], otros:[] },
              { err:false, por:{ rev:[] } }, { err:false, sedes:[] });
irAZona("taller");
loop();
refrescar();
setInterval(refrescar, 60000);
document.addEventListener("visibilitychange", function(){ if(!document.hidden) refrescar(); });
</script>
