<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mundo Montasa</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mundo">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17191a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#17191a; --panel:#202325; --panel-line:#34383b;
    --amber:#f5a524; --amber-dim:#a9741f; --green:#3ecf7e; --red:#e5534b; --blue:#4f8fe0;
    --ink:#eae7e0; --ink-dim:#8b9096; --ink-faint:#565b5f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior:none;
  }
  .display{font-family:'Barlow Condensed',sans-serif;}

  /* ---------- canvas ---------- */
  #world{position:fixed;inset:0;display:block;touch-action:none;cursor:grab;}
  #world.drag{cursor:grabbing;}

  /* ---------- barra superior ---------- */
  #top{
    position:fixed;left:0;right:0;top:0;z-index:5;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:linear-gradient(180deg,rgba(23,25,26,0.94) 60%,rgba(23,25,26,0));
    display:flex;flex-direction:column;gap:7px;pointer-events:none;
  }
  #top > *{pointer-events:auto;}
  .toprow{display:flex;align-items:center;gap:8px;}
  .back{
    display:flex;align-items:center;justify-content:center;flex:0 0 auto;
    width:30px;height:30px;border:1px solid var(--panel-line);background:var(--panel);
    color:var(--ink-dim);text-decoration:none;font-size:15px;line-height:1;
  }
  .back:active{background:var(--amber);color:#1a1a1a;}
  .title{font-weight:800;font-size:19px;letter-spacing:.6px;line-height:1;white-space:nowrap;}
  .title small{display:block;font-family:'IBM Plex Mono',monospace;font-weight:400;
    font-size:8.5px;letter-spacing:1.6px;color:var(--ink-dim);text-transform:uppercase;margin-top:3px;}
  .status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:9.5px;
    color:var(--ink-dim);letter-spacing:1px;white-space:nowrap;}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 7px var(--green);animation:pulse 2s ease-in-out infinite;}
  .dot.off{background:var(--red);box-shadow:0 0 7px var(--red);animation:none;}
  @keyframes pulse{50%{opacity:.35;}}

  .pills{display:flex;border:1px solid var(--panel-line);background:var(--panel);width:max-content;}
  .pill{background:transparent;border:0;border-right:1px solid var(--panel-line);color:var(--ink-dim);
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.2px;
    text-transform:uppercase;padding:6px 14px;cursor:pointer;}
  .pill:last-child{border-right:0;}
  .pill.active{background:var(--amber);color:#1a1a1a;}

  /* ---------- buscador ---------- */
  #busc{position:fixed;left:10px;top:74px;z-index:8;width:264px;
    background:rgba(23,25,26,0.95);border:1px solid var(--panel-line);
    backdrop-filter:blur(3px);display:flex;flex-direction:column;
    max-height:calc(100vh - 150px);}
  #busc-caja{display:flex;align-items:center;gap:6px;padding:7px 9px;
    background:var(--panel);border-bottom:1px solid var(--panel-line);}
  #busc-txt{flex:1;min-width:0;background:transparent;border:0;color:var(--ink);
    font-family:'IBM Plex Mono',monospace;font-size:12px;outline:none;}
  #busc-txt::placeholder{color:#565b5f;}
  #busc-x,#busc-ver{background:transparent;border:0;color:var(--ink-dim);font-size:13px;
    cursor:pointer;padding:2px 3px;}
  #busc-x:hover,#busc-ver:hover{color:var(--amber);}
  #busc-res{overflow-y:auto;padding:4px 0 6px;}
  #busc .grupo{padding:7px 9px 2px;font-family:'Barlow Condensed',sans-serif;
    font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:#8b9096;
    font-weight:700;cursor:pointer;display:flex;justify-content:space-between;gap:6px;}
  #busc .grupo:hover{color:var(--amber);}
  #busc .it{padding:4px 9px 4px 16px;font-size:11.5px;color:var(--ink);cursor:pointer;
    display:flex;align-items:baseline;gap:7px;}
  #busc .it:hover{background:rgba(245,165,36,.13);}
  #busc .it .d{color:var(--ink-dim);font-size:10px;flex:1;min-width:0;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  #busc .it .p{width:7px;height:7px;flex:0 0 auto;border-radius:50%;}
  #busc .vacio{padding:10px;font-size:11px;color:var(--ink-dim);}
  @media(max-width:760px){ #busc{left:6px;right:6px;width:auto;max-height:46vh;} }

  /* ---------- panel del equipo (izquierda) ---------- */
  #eqp{position:fixed;left:10px;top:120px;z-index:7;width:264px;
    background:rgba(23,25,26,0.95);border:1px solid var(--panel-line);
    backdrop-filter:blur(3px);max-height:calc(100vh - 150px);
    display:none;flex-direction:column;}
  #eqp.abierto{display:flex;}
  #eqp-cab{display:flex;align-items:flex-start;gap:8px;padding:9px 10px;
    background:var(--panel);border-bottom:1px solid var(--panel-line);}
  #eqp-cab h3{font-family:'Barlow Condensed',sans-serif;font-size:19px;font-weight:700;
    letter-spacing:.5px;color:var(--ink);line-height:1.05;flex:1;min-width:0;
    overflow-wrap:anywhere;}
  #eqp-cab .kick{display:block;font-size:9px;letter-spacing:1.4px;text-transform:uppercase;
    color:var(--ink-dim);font-weight:600;margin-bottom:2px;}
  #eqp-x{background:transparent;border:0;color:var(--ink-dim);font-size:15px;
    cursor:pointer;line-height:1;padding:2px 3px;flex:0 0 auto;}
  #eqp-cuerpo{padding:9px 10px 12px;overflow-y:auto;font-size:11.5px;line-height:1.45;}
  #eqp .fila{display:flex;gap:8px;justify-content:space-between;
    padding:3.5px 0;border-bottom:1px solid rgba(255,255,255,.045);}
  #eqp .fila span{color:var(--ink-dim);flex:0 0 auto;}
  #eqp .fila b{color:var(--ink);font-weight:600;text-align:right;overflow-wrap:anywhere;}
  #eqp h5{margin:11px 0 4px;font-family:'Barlow Condensed',sans-serif;font-size:10px;
    letter-spacing:1.2px;text-transform:uppercase;color:#8b9096;font-weight:700;}
  #eqp .aviso{margin-top:9px;padding:7px 9px;font-size:10.5px;line-height:1.4;
    background:rgba(245,165,36,.09);border-left:2px solid var(--amber);color:#c9ced2;}
  #eqp .aviso.gris{background:rgba(255,255,255,.04);border-left-color:#565b5f;}
  #eqp .tag{display:inline-block;font-size:9px;letter-spacing:.8px;text-transform:uppercase;
    font-weight:700;padding:2px 5px;margin-top:4px;}
  #eqp .orden{padding:7px 0;border-bottom:1px solid rgba(255,255,255,.045);}
  #eqp .orden .q{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;
    color:var(--ink);letter-spacing:.4px;}
  #eqp .orden .m{color:#f5c542;}
  #eqp .orden .m.quieto{color:#8b9096;}
  #eqp-ver{width:100%;margin-top:10px;background:transparent;border:1px solid var(--amber);
    color:var(--amber);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;
    letter-spacing:1.1px;text-transform:uppercase;padding:7px;cursor:pointer;}
  @media(max-width:760px){
    #eqp{left:6px;right:6px;width:auto;top:auto;bottom:52px;max-height:56vh;}
  }

  /* ---------- leyenda ----------
     Arriba a la derecha y ABIERTA por defecto: si hay que ir a buscarla, no
     es una leyenda. En pantalla angosta arranca cerrada, que ahi el mapa vale
     mas que el texto. */
  #leyenda{position:fixed;right:10px;top:74px;z-index:6;width:212px;
    background:rgba(23,25,26,0.93);border:1px solid var(--panel-line);
    backdrop-filter:blur(3px);max-height:calc(100vh - 150px);display:flex;flex-direction:column;}
  #leyenda-tit{width:100%;background:var(--panel);border:0;border-bottom:1px solid var(--panel-line);
    color:var(--amber);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:11px;
    letter-spacing:1.2px;text-transform:uppercase;padding:7px 10px;cursor:pointer;text-align:left;
    display:flex;align-items:center;justify-content:space-between;gap:8px;}
  #leyenda-tit .chev{transition:transform .15s;font-size:9px;}
  #leyenda.cerrada #leyenda-cuerpo{display:none;}
  #leyenda.cerrada #leyenda-tit .chev{transform:rotate(-90deg);}
  #leyenda-cuerpo{padding:9px 10px 11px;overflow-y:auto;font-size:11px;line-height:1.45;color:var(--ink-dim);}
  #leyenda h4{margin:9px 0 5px;font-family:'Barlow Condensed',sans-serif;font-size:10px;
    letter-spacing:1.2px;text-transform:uppercase;color:#8b9096;font-weight:700;}
  #leyenda h4:first-child{margin-top:0;}
  #leyenda .li{display:flex;gap:7px;align-items:flex-start;margin:4px 0;}
  #leyenda .sw{flex:0 0 auto;width:11px;height:11px;margin-top:2px;border:1px solid #2a2d2f;}
  /* las muestras de mancha son elipses, como en el mapa */
  #leyenda .sw.mancha{border-radius:50%;height:7px;margin-top:4px;border:0;opacity:.85;}
  #leyenda b{color:var(--ink);font-weight:600;}
  #leyenda .nota{color:#6f757a;font-size:10px;margin-top:3px;}
  @media(max-width:760px){ #leyenda{width:186px;top:70px;right:6px;} }

  /* ---------- navegador de zonas ---------- */
  #zones{
    position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(23,25,26,0.94) 55%,rgba(23,25,26,0));
    display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  }
  #zones::-webkit-scrollbar{display:none;}
  .zbtn{
    flex:0 0 auto;background:var(--panel);border:1px solid var(--panel-line);color:var(--ink-dim);
    font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;letter-spacing:1.2px;
    text-transform:uppercase;padding:7px 12px;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .zbtn.active{border-color:var(--amber);color:var(--amber);}
  .zbtn b{font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:10px;color:var(--ink);}
  .zbtn.alert b{color:var(--red);}

  /* ---------- zoom ---------- */
  #zoom{position:fixed;right:10px;bottom:calc(58px + env(safe-area-inset-bottom));z-index:5;
    display:flex;flex-direction:column;gap:5px;}
  #zoom button{width:32px;height:32px;background:var(--panel);border:1px solid var(--panel-line);
    color:var(--ink-dim);font-size:16px;font-family:'Barlow Condensed',sans-serif;font-weight:700;cursor:pointer;}
  #zoom button:active{border-color:var(--amber);color:var(--amber);}

  /* ---------- ficha (bottom sheet) ---------- */
  #sheet{
    position:fixed;left:0;right:0;bottom:0;z-index:20;
    background:var(--panel);border-top:2px solid var(--amber);
    transform:translateY(105%);transition:transform .18s ease-out;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));
    max-height:62vh;overflow-y:auto;
  }
  #sheet.open{transform:translateY(0);}
  #sheet h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;
    letter-spacing:.5px;line-height:1.05;padding-right:34px;}
  #sheet .kicker{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:4px;}
  #sheet .close{position:absolute;top:10px;right:10px;width:28px;height:28px;background:transparent;
    border:1px solid var(--panel-line);color:var(--ink-dim);font-size:14px;cursor:pointer;}
  .rows{display:flex;flex-direction:column;gap:7px;margin-top:12px;font-size:12px;}
  .rows > div{display:flex;justify-content:space-between;gap:12px;}
  .rows span{color:var(--ink-dim);}
  .rows b{text-align:right;word-break:break-word;}
  .note{margin-top:12px;font-size:10.5px;line-height:1.5;color:var(--ink-dim);
    border-left:2px solid var(--panel-line);padding-left:9px;}
  .note.warn{border-color:var(--amber-dim);color:var(--amber);}
  .acts{display:flex;gap:8px;margin-top:14px;}
  .acts button{flex:1;padding:11px 8px;border:1px solid var(--panel-line);background:transparent;
    color:var(--ink);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:14px;
    letter-spacing:1.2px;text-transform:uppercase;cursor:pointer;}
  .acts .ok{border-color:var(--green);color:var(--green);}
  .acts .no{border-color:var(--red);color:var(--red);}
  .acts button:disabled{opacity:.4;cursor:default;}
  .lst{display:flex;flex-direction:column;gap:5px;margin-top:10px;font-size:11px;}
  .lst > div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--panel-line);padding-bottom:4px;}
  .lst i{font-style:normal;color:var(--ink-dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* ---------- toast ---------- */
  #toast{position:fixed;left:50%;bottom:74px;transform:translate(-50%,14px);z-index:30;
    background:var(--panel);border:1px solid var(--amber);color:var(--ink);
    padding:9px 14px;font-size:11px;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center;}
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- leyenda / arranque ---------- */
  #hint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;
    color:var(--ink-faint);font-size:11px;letter-spacing:1.5px;text-transform:uppercase;text-align:center;}
</style>
</head>
<body>

<canvas id="world"></canvas>
<div id="hint">Cargando el mundo…</div>

<div id="top">
  <div class="toprow">
    <a class="back" href="../index.html" title="Volver al dash" aria-label="Volver al dash">&#8592;</a>
    <div class="title display">MUNDO MONTASA<small id="zone-name">Cargando</small></div>
    <div class="status"><span class="dot" id="conn-dot"></span><span id="conn-txt">CONECTANDO</span></div>
  </div>
  <!-- LA OFICINA ESTA APAGADA, NO BORRADA. Todo su codigo sigue aca abajo
       -- zonaEdificio, los deptos, los pulsos de caja chica -- y para volver
       a prenderla hay que darle su propia pastilla. Se apago porque el mundo
       hoy sirve para UNA cosa: ver la flota. Media docena de oficinas con
       KPIs sin conectar solo repartian la atencion.
       La pastilla que quedo elige EMPRESA: son dos flotas, dos talleres y
       dos carteras de clientes, y verlas encimadas no dejaba leer ninguna. -->
  <div class="pills" role="tablist" aria-label="Qué empresa se está viendo">
    <button class="pill active" data-vista="montasa" role="tab" aria-selected="true">MT Rental</button>
    <button class="pill" data-vista="monhaco" role="tab" aria-selected="false">Monhaco</button>
  </div>
</div>

<div id="busc">
  <div id="busc-caja">
    <input id="busc-txt" type="search" autocomplete="off" spellcheck="false"
           placeholder="Buscar equipo: MT-113, baoli, elcatex…" aria-label="Buscar equipo">
    <button id="busc-ver" aria-label="Ver por tipo" title="Ver por tipo">&#9776;</button>
    <button id="busc-x" aria-label="Cerrar">&#10005;</button>
  </div>
  <div id="busc-res"></div>
</div>

<aside id="eqp" aria-live="polite">
  <div id="eqp-cab">
    <h3><span class="kick" id="eqp-kick"></span><span id="eqp-nom"></span></h3>
    <button id="eqp-x" aria-label="Cerrar">&#10005;</button>
  </div>
  <div id="eqp-cuerpo"></div>
</aside>

<div id="leyenda">
  <button id="leyenda-tit" aria-expanded="true">Qué estoy viendo <span class="chev">▼</span></button>
  <div id="leyenda-cuerpo"></div>
</div>

<div id="zoom">
  <button id="zin" aria-label="Acercar">+</button>
  <button id="zout" aria-label="Alejar">&#8722;</button>
</div>

<nav id="zones" aria-label="Zonas del mundo"></nav>

<aside id="sheet" role="dialog" aria-modal="false" aria-live="polite">
  <button class="close" id="sheet-close" aria-label="Cerrar">&#10005;</button>
  <div id="sheet-body"></div>
</aside>

<div id="toast"></div>

<script>
"use strict";
/* =====================================================================
   1. CAPA DE DATOS
   ---------------------------------------------------------------------
   COPIA LITERAL de ../index.html (el dash). Cada pagina de este repo es
   autocontenida (sin build, sin bundler, GitHub Pages), asi que la unica
   forma de reusar estas reglas es duplicarlas. SI CAMBIAN EN ../index.html
   HAY QUE CAMBIARLAS AQUI TAMBIEN — se actualizan juntas.
   Bloques copiados: getJSON, EMPRESAS, bucketEstado, primerCampo,
   aFecha, aNumero, diasDesde, evaluarEquipo, CC_FB, CC_SEDES, fmtL,
   RADAR_*, fixUsd, NO_DISP, KPI_GROUPS, decidirCajaChica.
   ===================================================================== */

const DB_BASE = "https://montasa-app-default-rtdb.firebaseio.com";
async function getJSON(path){
  const r = await fetch(DB_BASE + "/" + path + ".json", { cache: "no-store" });
  if(!r.ok) throw new Error("HTTP " + r.status + " en " + path);
  return await r.json();
}

/* LAS DOS EMPRESAS QUE TIENEN FLOTA, Y SON DOS.
   ---------------------------------------------------------------------
   Antes el mundo pedia elegir una de tres y mostraba esa. Dos problemas:

   · MONHAGRO NO EXISTE ACA. No es que este vacia: no tiene un nodo. Arranco
     en junio de 2026 y todavia no carga flota. Ofrecerla como opcion hacia
     que el mundo se dibujara en obra, con andamios, como si le faltara
     construccion — cuando lo que falta son datos de la empresa.
   · ELEGIR ESCONDIA LA MITAD. La operacion es una sola: un mecanico arregla
     lo que este en el taller, sea de quien sea. Partirla por empresa era
     una pregunta de contabilidad metida en un mapa del piso.

   Ahora se leen las dos SIEMPRE --son dos lecturas baratas-- pero se dibuja
   una a la vez, la que diga la pastilla. Cada equipo se queda con su
   `_empresa`, que es lo que usan el filtro y la busqueda cruzada.

   El nodo se llama `montasa` por historia: la app de taller se hizo antes de
   que la renta se separara en MT Rental. La flota que vive en ese nodo es la
   de MT Rental, asi que se lee `montasa` y se rotula "MT Rental". */
const EMPRESAS = [
  { nodo:"montasa", nombre:"MT Rental", sede:"SPS" },
  { nodo:"monhaco", nombre:"Monhaco",   sede:"Choloma" }
];
const NOMBRE_EMPRESA = {}; EMPRESAS.forEach(function(e){ NOMBRE_EMPRESA[e.nodo] = e.nombre; });

function bucketEstado(estadoRaw){
  const e = (estadoRaw||"").toString().trim().toUpperCase();
  if(e === "DISPONIBLE") return "disp";
  if(e === "EN RENTA")   return "renta";
  /* LOS ESTADOS SON CINCO, NO TRES. Leyendo la app de Miguel: la lista de
     verdad es DISPONIBLE, MAL ESTADO, EN RENTA, EN MANTENIMIENTO y
     DEMO/PRESTAMO. `EN MANTENIMIENTO` lo pone la app SOLA al abrir una orden
     --no lo escribe nadie a mano-- y son 8 equipos. Como aca solo se conocian
     tres, esos 8 caian en "otros / interno" y se dibujaban en un rincon del
     patio: ocho maquinas que estan en el taller AHORA MISMO, fuera del
     taller. Es el caso mas importante del mapa y era el que faltaba. */
  if(e === "MAL ESTADO" || e === "EN MANTENIMIENTO") return "mant";
  return "uso";
}

const INTERVALO_DIAS   = 90;
const INTERVALO_HORAS  = 250;
const UMBRAL_AMARILLO  = 0.75;   // 0.75 = amarillo ; 1.0+ = rojo

const CAMPOS_HOROMETRO_ACT        = ["horometro","horometroActual","horas","horometer","hrs"];
const CAMPOS_ULT_FECHA_EQUIPO     = ["ultimoMant","fechaUltimoMant","ultimoMantenimiento"];
const CAMPOS_ULT_HOROMETRO_EQUIPO = ["horometroUltimoMant","horometroMant","hrsUltimoMant"];
const NODOS_MANT           = ["preventivos","correctivos"];
const CAMPOS_MANT_EQUIPOID = ["equipoId","equipoID","idEquipo"];
const CAMPOS_FECHA         = ["fechaCompletado","fecha","fechaFin"];
const CAMPOS_HOROMETRO_SNAP= ["horometro"];

/* --- SONDEO DEL CLIENTE (zona CAMPO) ------------------------------------
   El esquema de "equipos" NO esta confirmado en esta parte: no se pudo
   abrir equipos.json desde el entorno donde se escribio este archivo.
   Mismo patron que ya usa el dash con horometros y fechas: se prueban
   varios nombres y gana el primero que traiga valor.
   CUANDO SE CONFIRME EL CAMPO REAL, DEJAR SOLO ESE EN LA LISTA. */
const CAMPOS_CLIENTE   = ["cliente","clienteNombre","clienteId","razonSocial","empresa"];
const CAMPOS_UBICACION = ["ubicacion","sede","zona","proyecto","direccion"];

function primerCampo(obj, posibles){
  for(const k of posibles){ if(obj && obj[k] != null && obj[k] !== "") return obj[k]; }
  return null;
}
function aFecha(v){
  if(v == null) return null;
  if(typeof v === "number") return new Date(v);
  const d = new Date(v); return isNaN(d) ? null : d;
}
function aNumero(v){
  if(v == null) return null;
  const n = parseFloat(String(v).replace(/[^0-9.\-]/g,""));
  return isNaN(n) ? null : n;
}
function diasDesde(fecha){ return (Date.now() - fecha.getTime()) / 86400000; }

/* CODIGO DE FLOTA: MT-54, E-01, BC-7. Es como se llama un equipo cuando
   alguien lo nombra en voz alta. */
const RE_CODIGO = /^[A-Za-z]{1,4}-\d+$/;

/* Los que NO son equipos: marcadores para colgarle ordenes al taller. Tienen
   ficha de equipo, estado y todo, pero no existen como maquina. Contarlos
   inflaba el taller y dejaba dos fantasmas parados ahi para siempre. */
function esMarcadorDeTaller(eq){
  return /^TALLER[-_ ]/i.test(String(eq && eq.codigo || "").trim());
}

/* Como se llama un equipo EN PANTALLA.
   ---------------------------------------------------------------------
   195 de 217 traen su codigo de flota y ahi no hay nada que pensar. Los 22
   que faltan traen otra cosa en ese campo, y son dos casos distintos:

     · SIETE TIENEN EL NUMERO DE SERIE de codigo -- `B16010H00164`,
       `010352h5584` -- y se nota porque `codigo` y `serie` son identicos.
       Un numero de serie no es un nombre: nadie dice "andá a ver el
       010352h5584". Se muestra la marca y el modelo, que al menos dice que
       maquina es.
     · TRECE TRAEN MARCA Y MODELO de codigo: `Baoli KBD70`, `Towmotor
       Gp25s`, `PATRULLA`. Eso ya es legible, se deja.

   En los dos casos el equipo queda MARCADO como sin codigo de flota, y el
   mundo lo dice. NO se inventa un MT-##: ese dato no existe en ningun lado,
   y ponerle uno de adorno seria exactamente lo que este mapa no debe hacer. */
function nombreEquipo(eq){
  const cod = String(eq.codigo || "").trim();
  if(RE_CODIGO.test(cod)) return { nombre:cod, sinCodigo:false };
  const serie = String(eq.serie || "").trim();
  const esSerie = cod && serie && cod.toLowerCase() === serie.toLowerCase();
  if(esSerie){
    const mm = [eq.marca, eq.modelo].filter(Boolean).join(" ").trim();
    return { nombre: mm || cod, sinCodigo:true, serie:cod };
  }
  return { nombre: cod || String(eq.id || "?"), sinCodigo:true };
}

/* devuelve {codigo, urgencia, color, etiqueta} para un equipo */
function evaluarEquipo(eq, ultimoDeHistorial){
  const nom = nombreEquipo(eq);
  const codigo = nom.nombre;
  const horoAct = aNumero(primerCampo(eq, CAMPOS_HOROMETRO_ACT));
  const fechaUlt = aFecha(primerCampo(eq, CAMPOS_ULT_FECHA_EQUIPO)) ||
                   (ultimoDeHistorial ? ultimoDeHistorial.fecha : null);
  const horoUlt  = aNumero(primerCampo(eq, CAMPOS_ULT_HOROMETRO_EQUIPO)) ??
                   (ultimoDeHistorial ? ultimoDeHistorial.horometro : null);
  let rT = null, etqT = null;
  if(fechaUlt){
    const d = diasDesde(fechaUlt);
    rT = d / INTERVALO_DIAS;
    etqT = (d >= INTERVALO_DIAS) ? ("+"+Math.round(d-INTERVALO_DIAS)+"d") : (Math.round(d)+"d");
  }
  let rH = null, etqH = null;
  if(horoAct != null && horoUlt != null){
    const h = horoAct - horoUlt;
    rH = h / INTERVALO_HORAS;
    etqH = (h >= INTERVALO_HORAS) ? ("+"+Math.round(h-INTERVALO_HORAS)+"h") : (Math.round(h)+"h");
  }
  let urgencia = null, etiqueta = "sin datos";
  if(rT != null || rH != null){
    if(rT == null){ urgencia = rH; etiqueta = etqH; }
    else if(rH == null){ urgencia = rT; etiqueta = etqT; }
    else if(rH >= rT){ urgencia = rH; etiqueta = etqH; }
    else { urgencia = rT; etiqueta = etqT; }
  }
  let color = "nodata";
  if(urgencia != null) color = urgencia >= 1 ? "crit" : (urgencia >= UMBRAL_AMARILLO ? "warn" : "ok");
  return { codigo, urgencia, color, etiqueta, sinCodigo:nom.sinCodigo, serie:nom.serie };
}

/* =====================================================================
   2. CARGA (refresco cada 60 s, igual que el dash)
   Degradacion honesta: si un nodo falla o viene vacio se marca "error" /
   se deja vacio y el mundo lo dibuja apagado. NUNCA se inventa relleno.
   ===================================================================== */
async function cargarFlota(){
  state.equipos = {}; state.preventivos = {}; state.correctivos = {};
  const errores = [];
  /* Las llaves de Firebase solo son unicas DENTRO de su empresa, asi que al
     juntar las dos hay que prefijarlas. Sin esto, dos equipos con la misma
     llave en nodos distintos se pisan y uno desaparece del mapa sin avisar. */
  function volcar(destino, nodo, obj){
    Object.keys(obj || {}).forEach(function(k){
      const r = obj[k];
      if(!r || typeof r !== "object") return;
      const copia = Object.assign({}, r);
      copia._empresa = nodo;
      copia._nombreEmpresa = NOMBRE_EMPRESA[nodo] || nodo;
      if(copia.id == null) copia.id = k;
      destino[nodo + ":" + k] = copia;
    });
  }
  await Promise.all(EMPRESAS.map(async function(e){
    try{
      const [eq, pv, cr] = await Promise.all([
        getJSON(e.nodo + "/equipos"),
        getJSON(e.nodo + "/preventivos").catch(()=>({})),
        getJSON(e.nodo + "/correctivos").catch(()=>({}))
      ]);
      volcar(state.equipos,     e.nodo, eq);
      volcar(state.preventivos, e.nodo, pv);
      volcar(state.correctivos, e.nodo, cr);
    }catch(err){
      console.error("[Mundo] flota " + e.nodo + ":", err.message);
      errores.push(e.nombre + ": " + err.message);
    }
  }));
  /* Si UNA de las dos falla, el mundo no se apaga entero: se dibuja lo que
     si llego y el error dice de quien es. Apagarlo todo por una mitad
     esconderia la mitad sana. */
  state.flotaErr = errores.length ? errores.join(" · ") : null;
  state.flotaParcial = errores.length > 0 && Object.keys(state.equipos).length > 0;
}

/* =====================================================================
   3. MOTOR ISOMETRICO (canvas 2D, pixel art, sin librerias)
   Proyeccion 2:1 clasica: un tile mide 32 x 16 px a escala 1x.
   Todo se dibuja en "unidades de mundo" (px a 1x) y el canvas se escala
   por enteros con imageSmoothingEnabled=false, para que el pixel art no
   se interpole nunca.
   ===================================================================== */
const TW = 32, TH = 16, HW = TW/2, HH = TH/2;
function w2s(gx, gy){ return { x:(gx-gy)*HW, y:(gx+gy)*HH }; }

const cv  = document.getElementById("world");
const ctx = cv.getContext("2d");
let CW = 0, CH = 0, DPR = 1;
const cam = { x:0, y:0, scale:2, tx:null, ty:null };   // tx/ty = destino de la animacion

function baseScale(){
  const w = window.innerWidth;
  if(w < 340) return 1;
  if(w < 1100) return 2;
  return 3;
}
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = window.innerWidth; CH = window.innerHeight;
  cv.width  = Math.round(CW * DPR);
  cv.height = Math.round(CH * DPR);
  cv.style.width = CW + "px"; cv.style.height = CH + "px";
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", ()=>{ resize(); dirty = true; });

/* transform mundo -> pantalla (redondeado a pixel entero: nada borroso) */
function applyCam(){
  const s = cam.scale * DPR;
  ctx.setTransform(s, 0, 0, s,
    Math.round(-cam.x * s + cv.width/2),
    Math.round(-cam.y * s + cv.height/2));
  ctx.imageSmoothingEnabled = false;
}
function screenOf(wx, wy){
  const s = cam.scale;
  return { x:(wx - cam.x) * s + CW/2, y:(wy - cam.y) * s + CH/2 };
}
/* rectangulo del mundo visible ahora mismo (para no dibujar de mas) */
function viewRect(){
  const s = cam.scale, mw = CW/s/2, mh = CH/s/2;
  return { x0:cam.x-mw-40, x1:cam.x+mw+40, y0:cam.y-mh-80, y1:cam.y+mh+60 };
}

/* --------- primitivas iso --------- */
function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  let r = (n>>16)&255, g = (n>>8)&255, b = n&255;
  r = Math.max(0,Math.min(255,Math.round(r*f)));
  g = Math.max(0,Math.min(255,Math.round(g*f)));
  b = Math.max(0,Math.min(255,Math.round(b*f)));
  return "#" + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
/* rombo (una losa de piso) */
function tile(gx, gy, col, line){
  const p = w2s(gx, gy);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y);
  ctx.lineTo(p.x+HW, p.y+HH);
  ctx.lineTo(p.x, p.y+TH);
  ctx.lineTo(p.x-HW, p.y+HH);
  ctx.closePath();
  ctx.fillStyle = col; ctx.fill();
  if(line){ ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.stroke(); }
}
/* piso rectangular de w x d tiles con origen (gx,gy) */
function floor(gx, gy, w, d, col, line){
  for(let j=0;j<d;j++) for(let i=0;i<w;i++) tile(gx+i, gy+j, col, line);
}
/* caja isometrica: huella w x d tiles, altura h en px de mundo */
function isoBox(gx, gy, w, d, h, col, opt){
  opt = opt || {};
  const z0 = opt.z || 0, z1 = z0 + h;      // z0 = elevacion de la base (para apilar)
  const A = w2s(gx, gy),        B = w2s(gx+w, gy);
  const C = w2s(gx+w, gy+d),    D = w2s(gx, gy+d);
  const top = opt.topCol || shade(col, opt.topF || 1.0);
  const rgt = shade(col, opt.rgtF || 0.74);
  const lft = shade(col, opt.lftF || 0.55);
  // cara derecha (mira abajo-derecha)
  ctx.beginPath();
  ctx.moveTo(B.x, B.y-z1); ctx.lineTo(C.x, C.y-z1); ctx.lineTo(C.x, C.y-z0); ctx.lineTo(B.x, B.y-z0);
  ctx.closePath(); ctx.fillStyle = rgt; ctx.fill();
  // cara izquierda (mira abajo-izquierda)
  ctx.beginPath();
  ctx.moveTo(D.x, D.y-z1); ctx.lineTo(C.x, C.y-z1); ctx.lineTo(C.x, C.y-z0); ctx.lineTo(D.x, D.y-z0);
  ctx.closePath(); ctx.fillStyle = lft; ctx.fill();
  // tapa
  ctx.beginPath();
  ctx.moveTo(A.x, A.y-z1); ctx.lineTo(B.x, B.y-z1); ctx.lineTo(C.x, C.y-z1); ctx.lineTo(D.x, D.y-z1);
  ctx.closePath(); ctx.fillStyle = top; ctx.fill();
  if(opt.line){ ctx.strokeStyle = opt.line; ctx.lineWidth = 1; ctx.stroke(); }
  return { A:A, B:B, C:C, D:D, h:h };
}
/* sombra ovalada bajo un objeto */
/* LA MANCHA DEL PISO ES EL INDICADOR.
   ---------------------------------------------------------------------
   Antes el color de la ZONA iba en el chasis, y eso obligaba a pintar un
   montacargas de azul o una pick-up de rojo: colores que no dicen nada de la
   maquina y que peleaban con la silueta. Ahora la maquina lleva SU color y lo
   que cambia es la mancha de abajo -- el unico lugar donde un color puede
   cambiar sin ensuciar la figura.

   Sin `col` es una sombra negra normal (la gente, los papeles). */
function sombra(gx, gy, rx, col){
  const p = w2s(gx, gy);
  ctx.save();
  ctx.globalAlpha = col ? 0.55 : 0.22;
  ctx.fillStyle = col || "#000000";
  ctx.beginPath(); ctx.ellipse(p.x, p.y+HH, rx, rx/2, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

/* =====================================================================
   4. SPRITES
   Generados por codigo (rectangulos de 1 px sobre un canvas fuera de
   pantalla) y cacheados. Cero binarios en el repo, cero peticiones.
   ===================================================================== */
const SPR = {};
function makeSprite(key, w, h, ops){
  if(SPR[key]) return SPR[key];
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const g = c.getContext("2d");
  g.imageSmoothingEnabled = false;
  for(const op of ops){ g.fillStyle = op[4]; g.fillRect(op[0], op[1], op[2], op[3]); }
  SPR[key] = c; return c;
}
