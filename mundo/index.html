  const bd = shade(body, 0.74), bl = shade(body, 1.14);
  return makeSprite(key, FK_W, FK_H, [
    // mastil: dos rieles y el carro portahorquillas
    [5,1,5,16,C_MASTD], [5,1,1,16,C_MAST], [9,1,1,16,C_MAST], [5,0,5,1,C_OUT],
    [4,10,7,2,C_MAST],
    // horquillas
    [0,16,10,2,C_FORK], [0,15,2,4,C_FORK], [0,18,10,1,shade(C_FORK,0.6)],
    // techo de proteccion
    [12,0,11,2,C_OUT], [12,2,2,9,C_OUT], [21,2,2,9,C_OUT],
    // asiento y respaldo
    [14,4,7,7,C_SEAT], [14,4,7,2,C_GLASS],
    // chasis
    [10,11,13,7,bd], [10,11,13,2,bl], [10,17,13,1,C_OUT],
    [20,10,3,8,shade(body,0.62)],                       // contrapeso
    [10,11,1,7,C_OUT], [22,10,1,8,C_OUT],
    // llantas
    [10,17,5,4,C_TIRE], [11,18,3,2,shade(C_TIRE,2.1)],
    [17,17,5,4,C_TIRE], [18,18,3,2,shade(C_TIRE,2.1)]
  ]);
}
/* EL MISMO MONTACARGAS, PERO CONTANDO ALGO.
   ---------------------------------------------------------------------
   Antes la urgencia iba en una barrita aparte flotando encima del equipo.
   Funcionaba, pero era un elemento mas en un mapa que ya tiene demasiados, y
   no decia nada por si mismo: habia que aprenderse que significaba.

   Ahora lo dice la maquina: EL MASTIL ES LA REGLA Y LAS HORQUILLAS SON LA
   MEDIDA. Un montacargas al dia tiene las horquillas en el piso. Mientras se
   acerca el mantenimiento las va subiendo, y pasado del intervalo las tiene
   arriba del todo y en rojo. Se lee sin leyenda porque es lo que hace un
   montacargas de verdad.

   `nivel` va de 0 a 1 y se redondea a diez pasos: sin eso habria un sprite
   distinto por cada milesima y el cache creceria sin fin.  */
function forkliftUrg(body, col, nivel){
  const paso = Math.max(0, Math.min(10, Math.round((nivel || 0) * 10)));
  const key = "fku_" + body + "_" + col + "_" + paso;
  if(SPR[key]) return SPR[key];
  const bd = shade(body, 0.74), bl = shade(body, 1.14);
  /* el carro viaja por el mastil: 14 abajo, 1 arriba. Las horquillas van
     colgadas seis pixeles mas abajo, como en el sprite original. */
  const yc = Math.round(14 - (paso / 10) * 13);
  const yf = yc + 6;
  const horq = col || C_FORK;
  return makeSprite(key, FK_W, FK_H, [
    // mastil: los dos rieles, que ahora son la regla
    [5,1,5,16,C_MASTD], [5,1,1,16,C_MAST], [9,1,1,16,C_MAST], [5,0,5,1,C_OUT],
    // el carro portahorquillas, a la altura que toca
    [4,yc,7,2,horq],
    // horquillas, del mismo color
    [0,yf,10,2,horq], [0,yf-1,2,4,horq], [0,yf+2,10,1,shade(horq,0.6)],
    // techo de proteccion
    [12,0,11,2,C_OUT], [12,2,2,9,C_OUT], [21,2,2,9,C_OUT],
    // asiento y respaldo
    [14,4,7,7,C_SEAT], [14,4,7,2,C_GLASS],
    // chasis
    [10,11,13,7,bd], [10,11,13,2,bl], [10,17,13,1,C_OUT],
    [20,10,3,8,shade(body,0.62)],
    [10,11,1,7,C_OUT], [22,10,1,8,C_OUT],
    // llantas
    [10,17,5,4,C_TIRE], [11,18,3,2,shade(C_TIRE,2.1)],
    [17,17,5,4,C_TIRE], [18,18,3,2,shade(C_TIRE,2.1)]
  ]);
}


/* =====================================================================
   LAS OTRAS MAQUINAS
   ---------------------------------------------------------------------
   Mismo lienzo de 24 x 22 y misma orientacion que el montacargas, para que
   todas se sienten igual sobre el piso isometrico.

   `col` es el color del semaforo y `nivel` (0 a 1) la urgencia. Las que
   tienen algo que levantar la cuentan levantandolo -- la tijera sube su
   plataforma, el brazo se empina -- porque es el mismo idioma que las
   horquillas del montacargas y no hay que aprender nada nuevo. Las que no,
   la llevan en la cabina.
   ===================================================================== */
const C_VIDRIO = "#4f8fe0", C_CROMO = "#9aa0a4";

/* Pick-up: cabina atras, cama adelante. Es la silueta mas reconocible del
   patio y por eso vale tenerla aparte: MTV-01 y MTV-04 andan todo el dia. */
function pickup(body, col){
  const key = "pu_" + body + "_" + col;
  if(SPR[key]) return SPR[key];
  const bd = shade(body, 0.74), bl = shade(body, 1.14), cab = col || body;
  return makeSprite(key, FK_W, FK_H, [
    [1,10,12,7,bd], [1,10,12,1,bl], [1,16,12,1,C_OUT],   // cama
    [1,10,1,7,C_OUT], [12,9,1,9,C_OUT],
    [12,6,9,11,cab], [12,6,9,1,shade(cab,1.2)],          // cabina
    [13,7,7,4,C_VIDRIO], [13,7,7,1,shade(C_VIDRIO,1.3)], // parabrisas
    [20,8,2,2,C_CROMO],                                  // espejo
    [12,16,10,1,C_OUT],
    [2,17,5,4,C_TIRE], [3,18,3,2,shade(C_TIRE,2.1)],
    [15,17,5,4,C_TIRE], [16,18,3,2,shade(C_TIRE,2.1)]
  ]);
}

/* Camion: furgon alto adelante, cabina chica atras. */
function camion(body, col){
  const key = "cm_" + body + "_" + col;
  if(SPR[key]) return SPR[key];
  const bd = shade(body, 0.7), bl = shade(body, 1.1), cab = col || body;
  return makeSprite(key, FK_W, FK_H, [
    [0,3,14,14,bd], [0,3,14,1,bl], [0,3,1,14,shade(bd,1.25)],  // furgon
    [0,16,14,1,C_OUT], [13,3,1,14,C_OUT],
    [1,5,11,8,shade(bd,0.86)],                                  // porton trasero
    [14,7,8,10,cab], [14,7,8,1,shade(cab,1.2)],                 // cabina
    [15,8,6,4,C_VIDRIO],
    [14,16,8,1,C_OUT], [21,9,2,2,C_CROMO],
    [2,17,5,4,C_TIRE], [3,18,3,2,shade(C_TIRE,2.1)],
    [9,17,5,4,C_TIRE], [10,18,3,2,shade(C_TIRE,2.1)],
    [16,17,5,4,C_TIRE], [17,18,3,2,shade(C_TIRE,2.1)]
  ]);
}

/* Grua: camion con pluma. La pluma va en diagonal y en escalones, que es como
   se dibuja una diagonal en pixel sin antialiasing. */
function grua(body, col){
  const key = "gr_" + body + "_" + col;
  if(SPR[key]) return SPR[key];
  const bd = shade(body, 0.74), cab = col || body;
  const ops = [
    [2,12,18,5,bd], [2,12,18,1,shade(bd,1.2)], [2,16,18,1,C_OUT],
    [14,7,8,10,cab], [14,7,8,1,shade(cab,1.2)],
    [15,8,6,4,C_VIDRIO], [14,16,8,1,C_OUT],
    [8,10,6,3,shade(body,0.62)],                    // torreta
    [3,17,5,4,C_TIRE], [4,18,3,2,shade(C_TIRE,2.1)],
    [14,17,5,4,C_TIRE], [15,18,3,2,shade(C_TIRE,2.1)]
  ];
  /* la pluma: de la torreta hacia arriba-izquierda */
  for(let k = 0; k < 9; k++) ops.push([9 - k, 10 - k, 2, 1, C_MAST]);
  ops.push([0,1,2,1,C_CROMO], [1,2,1,3,C_CROMO]);   // punta y gancho
  return makeSprite(key, FK_W, FK_H, ops);
}

/* Tijera. La plataforma SUBE con la urgencia: es el mismo gesto que las
   horquillas del montacargas, contado con lo que esta maquina si tiene. */
function tijera(body, col, nivel){
  const paso = Math.max(0, Math.min(10, Math.round((nivel || 0) * 10)));
  const key = "tj_" + body + "_" + col + "_" + paso;
  if(SPR[key]) return SPR[key];
  const bd = shade(body, 0.74), plat = col || C_FORK;
  /* Arranca en 9 y no en 13: con la plataforma pegada al chasis no se veia
     la tijera y parecia una caja. Un piso de tres o cuatro filas de cruces ya
     la hace reconocible, y desde ahi sube con la urgencia. */
  const yp = Math.round(9 - (paso / 10) * 7);      // alto de la plataforma
  const ops = [
    [2,15,19,4,bd], [2,15,19,1,shade(bd,1.2)], [2,18,19,1,C_OUT],   // chasis
    [3,19,4,3,C_TIRE], [16,19,4,3,C_TIRE],                          // ruedas
    [2,yp,19,2,plat], [2,yp,19,1,shade(plat,1.25)],                 // plataforma
    [2,yp-3,1,3,C_MAST], [20,yp-3,1,3,C_MAST],                      // barandas
    [2,yp-3,19,1,C_MAST]
  ];
  /* las tijeras: dos diagonales cruzadas entre el chasis y la plataforma */
  const alto = 15 - yp;
  for(let k = 0; k < alto; k++){
    const y = yp + 2 + k;
    const t = alto ? k / alto : 0;
    ops.push([Math.round(6 + t * 9), y, 2, 1, C_MASTD]);
    ops.push([Math.round(15 - t * 9), y, 2, 1, C_MAST]);
  }
  return makeSprite(key, FK_W, FK_H, ops);
}

/* Brazo articulado. Se EMPINA con la urgencia, por lo mismo que la tijera. */
function brazo(body, col, nivel){
  const paso = Math.max(0, Math.min(10, Math.round((nivel || 0) * 10)));
  const key = "bz_" + body + "_" + col + "_" + paso;
  if(SPR[key]) return SPR[key];
  const bd = shade(body, 0.74), cesta = col || C_FORK;
  const ops = [
    [3,14,17,5,bd], [3,14,17,1,shade(bd,1.2)], [3,18,17,1,C_OUT],
    [4,19,4,3,C_TIRE], [15,19,4,3,C_TIRE],
    [13,11,6,4,shade(body,0.62)]                       // torreta
  ];
  /* el brazo sale de la torreta hacia arriba-izquierda; mas urgencia, mas
     empinado */
  const largo = 11;
  const subir = 0.45 + (paso / 10) * 0.85;             // pendiente
  let bx = 13, by = 12;
  for(let k = 0; k < largo; k++){
    bx = Math.round(13 - k);
    by = Math.round(12 - k * subir);
    if(by < 0) break;
    ops.push([bx, by, 2, 2, C_MAST]);
  }
  ops.push([Math.max(0, bx - 2), Math.max(0, by - 2), 4, 3, cesta]);   // canasta
  ops.push([Math.max(0, bx - 2), Math.max(0, by - 2), 4, 1, shade(cesta, 1.3)]);
  return makeSprite(key, FK_W, FK_H, ops);
}

/* QUE ES CADA EQUIPO, segun lo que dice la base.
   Se mira primero la descripcion --que es donde la gente escribio "Pick Up",
   "Camion", "Grua"-- y despues el tipo y el codigo. El orden importa: el
   GR-01 tiene tipo "Vehiculo" igual que una pick-up, y lo que lo distingue
   es la palabra "Grua" en la descripcion. */
function formaDe(eq){
  const d = (String(eq.desc || "") + " " + String(eq.marca || "") + " " +
             String(eq.modelo || "")).toUpperCase();
  const t = String(eq.tipo || "").toUpperCase();
  const c = String(eq.codigo || "").toUpperCase();
  if(/GRUA|GR\u00daA/.test(d) || /^GR-/.test(c)) return "grua";
  if(/CAMI\u00d3N|CAMION|PANEL/.test(d) || /^CM-/.test(c)) return "camion";
  if(/PICK ?UP/.test(d) || /^(MTV|C)-/.test(c) || t === "VEH\u00cdCULO" || t === "VEHICULO")
    return "pickup";
  if(t === "ELEVADORA" || t.indexOf("PLATAFORMA") === 0 || /^E-/.test(c)){
    /* Genie nombra las tijeras GS y los brazos articulados Z. */
    return /\bZ-?\d/.test(d) ? "brazo" : "tijera";
  }
  return "montacargas";
}

/* Hoja de papel 9 x 12, parada. tint = color del membrete. */
function papel(tint){
  const key = "pp_" + tint;
  return makeSprite(key, 9, 12, [
    [0,0,9,12,"#c9c6bd"], [0,0,9,1,C_OUT], [0,11,9,1,"#8d8a83"],
    [0,0,1,12,"#e2dfd6"], [8,0,1,12,"#8d8a83"],
    [2,2,5,1,tint], [2,4,5,1,"#7c7972"], [2,6,5,1,"#7c7972"], [2,8,3,1,"#7c7972"]
  ]);
}

/* =====================================================================
   LA GENTE
   ---------------------------------------------------------------------
   Sprites de 12 x 20. Tres tienen nombre porque tienen oficina propia:
   Omar (camisa cuadriculada manga larga, siempre), Fabrizio y Elia. En las
   demás oficinas van dos personas sin nombre todavía.
   ===================================================================== */
const PIEL = { omar:"#c69a72", fabri:"#b8865c", elia:"#d3a67f", rodz:"#c28f68", gen:"#a8825f", gen2:"#8d6a48",
               mec:"#a8825f", mec2:"#8d6a48", mecq:"#a8825f" };
const PELO = { omar:"#9aa0a4", fabri:"#241c19", elia:"#3b2016", rodz:"#1e1a18", gen:"#332b28", gen2:"#4a3a2c",
               mec:"#2b2320", mec2:"#3a2f28", mecq:"#2b2320" };

function persona(tipo){
  const key = "pj_" + tipo;
  if(SPR[key]) return SPR[key];
  const piel = PIEL[tipo] || PIEL.gen, pelo = PELO[tipo] || PELO.gen;
  const ops = [];
  /* pelo y cabeza */
  ops.push([3,0,6,2,pelo], [3,1,1,3,pelo], [8,1,1,3,pelo]);
  if(tipo === "elia"){ ops.push([2,2,1,7,pelo], [9,2,1,7,pelo]); }   // pelo largo
  ops.push([4,2,4,5,piel]);
  ops.push([4,4,1,1,"#101213"], [7,4,1,1,"#101213"]);               // ojos
  ops.push([5,7,2,1,piel]);                                         // cuello

  if(tipo === "rodz"){
    /* Rodrigo. La cara es la misma de todos: dos ojos y nada más. Lo que lo
       distingue es la ropa — chaqueta amarilla abierta sobre camiseta negra y
       jeans — y el bracer negro con una luz en el antebrazo, que es el aparato
       con el que trabaja. Ojo: el bracer va en la columna x=9, que es la
       izquierda DEL PERSONAJE; el sprite mira al frente, así que al espectador
       le queda a la derecha. */
    const AMARILLO = "#f2c230", NEGRO = "#15171a", JEAN = "#2f4f8a";
    ops.push([3,8,6,7,AMARILLO]);                                    // chaqueta
    ops.push([2,8,1,5,AMARILLO], [9,8,1,5,AMARILLO]);                // mangas
    ops.push([3,8,6,1,shade(AMARILLO,1.18)]);                        // cuello levantado
    ops.push([4,9,4,6,NEGRO]);                                       // la camiseta, chaqueta abierta
    ops.push([5,11,2,1,"#e8e8e8"]);                                  // el estampado
    ops.push([9,10,1,3,NEGRO]);                                      // el bracer
    ops.push([9,11,1,1,"#f5a524"]);                                  // su luz
    ops.push([2,13,1,1,piel], [9,13,1,1,piel]);                      // manos
    ops.push([4,15,2,4,JEAN], [6,15,2,4,JEAN]);                      // jeans
    ops.push([3,19,3,1,"#8b9196"], [6,19,3,1,"#8b9196"]);            // calzado claro
  }else if(tipo === "omar"){
    /* Camisa cuadriculada manga larga, pantalón y zapatos. No negocia. */
    ops.push([3,8,6,7,"#8c4a42"], [2,8,1,6,"#8c4a42"], [9,8,1,6,"#8c4a42"]);
    for(let y=8;y<15;y+=2) for(let x=2;x<10;x+=2)
      if(((x+y)/2) % 2 === 0) ops.push([x,y,1,1,"#b56a5e"]);
    for(let y=9;y<15;y+=2) ops.push([2,y,8,1,"#6f3a34"]);            // rayas del cuadro
    ops.push([5,8,2,2,"#eae7e0"]);                                   // cuello de camisa
    ops.push([4,15,2,4,"#2f3439"], [6,15,2,4,"#2f3439"]);            // pantalón
    ops.push([3,19,3,1,"#17191a"], [6,19,3,1,"#17191a"]);            // zapatos
  }else if(tipo === "mec" || tipo === "mec2" || tipo === "mecq"){
    /* El mecanico. Se distingue de lejos y a proposito: overol azul, casco
       amarillo y chaleco reflectivo. En un patio lleno de montacargas, una
       figura mas en gris no se ve; el casco es lo que hace que a un metro de
       zoom se entienda que ESE equipo tiene a alguien encima.
       El casco se dibuja ENCIMA del pelo, tapandolo: si no, salia un gorro
       flotando sobre la cabeza. */
    /* `mecq` = quieto: asignado pero la orden no esta corriendo. Se apaga el
       color, NO se vuelve transparente: transparente ya significa "falta un
       dato" y mezclarlo diria que no sabemos quien es, cuando si sabemos. */
    const quieto = (tipo === "mecq");
    const OVEROL = quieto ? "#3b4146" : (tipo === "mec2" ? "#2b4f7a" : "#32598c");
    const CASCO  = quieto ? "#7d8288" : "#f5c542";
    const REFLEJO = quieto ? "#5c6167" : "#d8e84a";
    ops.push([3,0,6,2,CASCO], [2,1,8,1,CASCO], [3,1,1,2,CASCO], [8,1,1,2,CASCO]);
    ops.push([3,2,6,1,shade(CASCO,0.78)]);                           // ala del casco
    ops.push([3,8,6,7,OVEROL], [2,8,1,5,OVEROL], [9,8,1,5,OVEROL]);  // overol y mangas
    ops.push([4,9,4,1,REFLEJO], [4,12,4,1,REFLEJO]);                 // las dos bandas
    ops.push([5,8,2,1,shade(OVEROL,1.3)]);                           // peto
    ops.push([2,13,1,1,piel], [9,13,1,1,piel]);                      // manos
    ops.push([4,15,2,4,shade(OVEROL,0.82)], [6,15,2,4,shade(OVEROL,0.82)]);
    ops.push([3,19,3,1,"#17191a"], [6,19,3,1,"#17191a"]);            // botas
  }else{
    const ropa = { fabri:"#2f4f6d", elia:"#7a3f6b", gen:"#4a5054", gen2:"#3f4a44" }[tipo] || "#4a5054";
    ops.push([3,8,6,7,ropa], [2,8,1,5,ropa], [9,8,1,5,ropa]);
    ops.push([3,8,6,1,shade(ropa,1.25)]);
    ops.push([2,13,1,1,piel], [9,13,1,1,piel]);                      // manos
    if(tipo === "elia"){
      ops.push([3,14,6,5,shade(ropa,0.8)]);                          // falda
      ops.push([4,19,2,1,"#17191a"], [7,19,2,1,"#17191a"]);
    }else{
      ops.push([4,15,2,4,"#333a3e"], [6,15,2,4,"#333a3e"]);
      ops.push([3,19,3,1,"#17191a"], [6,19,3,1,"#17191a"]);
    }
  }
  return makeSprite(key, 12, 20, ops);
}

/* Verde al dia, ambar se acerca, rojo pasado, gris sin con que calcularlo.
   Lo usa el mastil del montacargas, la lista del buscador y las fichas. */
const COL_URG = { ok:"#3ecf7e", warn:"#f5a524", crit:"#e5534b", nodata:"#565b5f" };

/* Aca vivia `barraUrgencia`, que dibujaba una barrita vertical encima del
   equipo. La reemplazo el propio montacargas: el mastil es la regla y las
   horquillas la medida (ver `forkliftUrg`). Se quito en vez de dejarla
   apagada porque eran dos formas de decir lo mismo, y la que quedo no
   necesita que nadie la explique. Esta en el historial si hiciera falta. */


/* =====================================================================
   5. EL MUNDO: zonas y armado de la escena
   La escena se arma UNA VEZ por refresco de datos (no por frame). Cada
   item guarda su profundidad (gx+gy) para el orden de pintado, y su caja
   en pantalla para el tap.
   ===================================================================== */
/* =====================================================================
   EL MUNDO SE PARTE EN DOS
   ---------------------------------------------------------------------
   Son dos negocios distintos y no se mezclan:

     DISTRITO DE EQUIPOS   todo lo que es montacargas — taller, patio y
                           los que están en cliente. Fierro.
     EL EDIFICIO           todo lo que NO es montacargas — la gente, los
                           papeles, las decisiones.

   El edificio tiene el BULLPEN al centro, y ahí adentro está JARVIS.
   Las ocho oficinas lo rodean, cada una con su puerta mirando
   al bullpen: esa es la conexión directa. Un pedido sale de una oficina,
   entra al bullpen, se procesa, y sale hacia otra.
   ===================================================================== */
const ZONAS = [
  /* --- distrito de equipos (montacargas) --- */
  /* EL ORDEN IMPORTA Y ES EL DEL NEGOCIO: el equipo entra al patio, pasa por
     el taller y sale al cliente. El taller va AL MEDIO porque es por donde
     pasa todo; tenerlo en una punta obligaba a cruzar el mapa entero para ir
     del patio al taller, que es el viaje que mas se hace.

     Los tamanos salen de cuantos equipos hay de verdad, no de la estetica:
     48 en taller (seis columnas), 32 en patio, y 124 repartidos en 28 sitios
     de cliente -- por eso campo es la mas grande de las tres. */
  /* EL CENTRO ES NUESTRO, EL ANILLO ES DE LOS CLIENTES.
     Disponibles arriba, taller abajo, los dos en el medio; los sitios de
     cliente en circulo alrededor. Un equipo en renta esta AFUERA y cuando se
     rompe entra al centro: el mapa es el viaje que hace el fierro.
     `campo` no dibuja piso -- cada sitio pone el suyo sobre el anillo-- pero
     conserva una caja que lo cubre para que la camara sepa a donde ir. */
  /* d=24 y arranca en -27: son 35 equipos en cinco columnas, o sea siete
     filas de 2.4, y debajo va el bloque de "otros / interno". Con 18 de fondo
     ese bloque caia FUERA del piso. Se corre hacia arriba para no pegarse al
     taller, que empieza en y=2. */
  { id:"patio",   nombre:"DISPONIBLES",      dist:"equipos", x:-9,  y:-27, w:18, d:24, piso:"#25282a", linea:"#31353800" },
  /* d=32 y no 24: son 56 equipos en seis columnas, o sea diez filas de 2.8,
     que son 28 de fondo mas el respiro de arriba y el de abajo. Con 24 los
     de las ultimas filas se salian del piso y quedaban flotando en negro. */
  { id:"taller",  nombre:"TALLER",           dist:"equipos", x:-11, y:2,   w:22, d:32, piso:"#2a2d2f", linea:"#34383b" },
  { id:"campo",   nombre:"CAMPO / CLIENTES", dist:"equipos", x:-56, y:-56, w:112, d:112, piso:null, linea:null },
  /* --- el edificio (todo lo demás) --- */
  { id:"bullpen", nombre:"BULLPEN",          dist:"edificio", x:20, y:37, w:12, d:10, piso:"#2f3335", linea:"#3c4144" }
];

/* El centro del edificio y el radio del anillo de oficinas. Todo lo demás
   se calcula de acá: mover el edificio es mover estos tres números. */
/* Ojo con `k`: en isométrico el anillo mide 4·k tiles de ancho en pantalla
   (el doble de lo que mide de alto). Subirlo de 10 saca el edificio de un
   celular por los costados. */
const EDIF = { cx:26, cy:42, k:10, ow:8, od:6 };

/* En isométrico, "alrededor" no es obvio: para subir en pantalla hay que
   bajar gx+gy, y para ir a la derecha hay que subir gx-gy. Estas ocho
   posiciones son las que dan un anillo que se VE como un anillo. */
const ANCLAS = {
  N:  [-1,-1], NE:[ 0,-1], E:[ 1,-1], SE:[ 1, 0],
  S:  [ 1, 1], SW:[ 0, 1], W:[-1, 1], NW:[-1, 0]
};

/* Las ocho oficinas. `modelo` es con qué IA trabaja esa oficina: todavía
   no está cableado (lo lee el edificio para mostrarlo, no para llamarlo),
   pero la idea es que cada oficina pueda tener la suya especializada. */
const DEPTOS = [
  { id:"omar",     nombre:"OMAR",     sub:"Gerencia",        ancla:"N",  col:"#f5a524",
    gente:[{n:"Omar",  tipo:"omar"}],  modelo:"por definir", muestra:"kpis" },
  { id:"fabri",    nombre:"FABRIZIO", sub:"Sistemas / RADAR",ancla:"NW", col:"#4f8fe0",
    gente:[{n:"Fabrizio", tipo:"fabri"}], modelo:"por definir", muestra:"radar" },
  { id:"hr",       nombre:"HR",       sub:"Elia",            ancla:"NE", col:"#c77dd1",
    gente:[{n:"Elia",  tipo:"elia"}],  modelo:"por definir", muestra:"gente" },
  { id:"ventas",   nombre:"VENTAS",   sub:"",                ancla:"W",  col:"#3ecf7e",
    gente:[{tipo:"gen"},{tipo:"gen"}], modelo:"por definir", muestra:"renta" },
  { id:"compras",  nombre:"COMPRAS",  sub:"",                ancla:"E",  col:"#5DBBE8",
    gente:[{tipo:"gen"},{tipo:"gen"}], modelo:"por definir", muestra:"nada" },
  { id:"finanzas", nombre:"FINANZAS", sub:"Caja chica y viáticos", ancla:"SW", col:"#a78bfa",
    gente:[{tipo:"gen"},{tipo:"gen"}], modelo:"por definir", muestra:"caja" },
  { id:"almacen",  nombre:"ALMACÉN",  sub:"Bodega",          ancla:"SE", col:"#a9741f",
    gente:[{tipo:"gen"},{tipo:"gen"}], modelo:"por definir", muestra:"bodega" },
  /* El ancla S estaba libre: era la unica de las ocho sin oficina. Queda
     enfrentada al bullpen, que es donde corresponde — esta oficina no
     maneja un area del negocio, maneja a Jarvis. */
  { id:"aiplan",   nombre:"AI PLANNING", sub:"Rodrigo",      ancla:"S",  col:"#f2c230",
    gente:[{n:"Rodrigo", tipo:"rodz"}], modelo:"Jarvis", muestra:"jarvis" }
];
/* Cada depto pasa a ser también una zona navegable. */
DEPTOS.forEach(function(d){
  const a = ANCLAS[d.ancla];
  d.cx = EDIF.cx + a[0]*EDIF.k;
  d.cy = EDIF.cy + a[1]*EDIF.k;
  d.x  = d.cx - EDIF.ow/2;
  d.y  = d.cy - EDIF.od/2;
  d.w  = EDIF.ow; d.d = EDIF.od;
  d.dist = "edificio"; d.piso = "#2c3032"; d.linea = "#3a3e41";
  ZONAS.push(d);
});
/* El que vive en el bullpen. No es una oficina: es el centro.
   Acá estaba también MAQUINÓN, y se sacó: no es una IA, es una computadora —
   la máquina donde corre el trabajo pesado. Dibujarlo como par de Jarvis
   decía algo falso del mundo. Cuando tenga un papel propio, vuelve; por ahora
   el centro es uno solo. dx/dy en cero para que quede centrado de verdad. */
const CENTRALES = [
  { id:"jarvis",   nombre:"JARVIS",   col:"#4f8fe0", dx: 0, dy: 0 }
];
const ZONA = {}; ZONAS.forEach(z => ZONA[z.id] = z);
const DEPTO = {}; DEPTOS.forEach(d => DEPTO[d.id] = d);
function centroZona(z){ const p = w2s(z.x + z.w/2, z.y + z.d/2); return p; }

let scene = { items:[], labels:[] };
const t0 = Date.now();          // reloj de las animaciones del mapa
let dirty = true;

function push(gx, gy, draw, hit, tap){
  scene.items.push({ d:gx+gy, gx:gx, gy:gy, draw:draw, hit:hit||null, tap:tap||null });
}
/* DESDE QUE ESCALA VALE LA PENA CADA COSA.
   De lejos el mapa contesta "donde hay mucho fierro y de que color esta"; de
   cerca contesta "cual es y que le pasa". Escribir las dos cosas a la vez es
   lo que lo volvia ilegible. Los numeros no son a gusto: son la escala a la
   que ese texto se lee sin encimarse con el de al lado. */
const LOD = {
  zona:    0,      // TALLER, DISPONIBLES, CAMPO: siempre. Son el mapa.
  /* El nombre del cliente va SIEMPRE, aunque sea lo que mas se repite en
     pantalla: es lo unico que hace que el anillo se lea como una lista de
     clientes y no como veintiocho manchas iguales. Lo que saturaba no eran
     los nombres, era el "1 equipo" debajo de cada uno. */
  sitio:   0,      // el nombre del cliente
  resumen: 0.62,   // "35 disponibles", "mecanicos sin equipo"
  cuenta:  0.85,   // "27 equipos" de cada sitio
  codigo:  1.45,   // el codigo de cada equipo
  persona: 1.45    // el nombre del mecanico
};
function label(wx, wy, text, o){
  o = o || {};
  scene.labels.push({ x:wx, y:wy, t:text, col:o.col||"#8b9096", size:o.size||9,
                      w:o.w||"400", al:o.al||"center", fam:o.fam||"mono", box:o.box||false,
                      min:o.min || 0 });
}
/* Punto de anclaje del rotulo: justo encima del vertice mas alto de la zona.
   (en iso el centro de la zona NO esta encima del centro de la huella) */
function anclaZona(z){
  const c = centroZona(z);
  return { x:c.x, y:c.y - (z.w + z.d) * HH / 2 - 58 };
}
function rotuloZona(z){
  const a = anclaZona(z);
  label(a.x, a.y, z.nombre, { col:"#f5a524", size:13, w:"800", fam:"disp", box:true });
  return a;
}

/* --------- reparto en rejilla dentro de una zona --------- */
function rejilla(n, cols, x0, y0, dx, dy){
  const out = [];
  for(let i=0;i<n;i++) out.push({ gx:x0 + (i%cols)*dx, gy:y0 + Math.floor(i/cols)*dy });
  return out;
}

/* --------- un montacargas dibujable + tappable --------- */
/* Donde quedo dibujado cada equipo, por `empresa:id`. Es el otro extremo del
   arco: sin esto habria que recorrer la escena entera buscandolo. */
let posEnMapa = {};

function ponerEquipo(gx, gy, eq, ev, opt){
  opt = opt || {};
  if(eq && eq._empresa) posEnMapa[eq._empresa + ":" + (eq.id || "")] = { gx:gx, gy:gy };
  /* Si nadie paso el trabajo a mano, se busca solo. Asi ninguna zona se
     olvida de mostrar al mecanico por no acordarse de pasarlo. */
  if(opt.trabajo === undefined && eq && eq._empresa){
    opt.trabajo = (enCurso.porEquipo || {})[eq._empresa + ":" + (eq.id || "")] || null;
  }
  /* Orden abierta pero el equipo no esta en taller: la app no le cambio el
     estado. Ver el comentario de arriba, en el dibujo del aro. */
  opt.contradice = !!(opt.trabajo && opt.trabajo.length && eq &&
                      bucketEstado(eq.estado) !== "mant");
  const body = opt.body || "#f5a524";
  const fantasma = (ev && ev.color === "nodata");
  const p = w2s(gx, gy);
  const sx = Math.round(p.x - FK_W/2), sy = Math.round(p.y + HH - FK_H);
  push(gx, gy, function(){
    /* la mancha: el color de la zona, o GRIS si no se sabe como esta */
    sombra(gx, gy, 11, fantasma ? "#5b6165" : (opt.body || null));
    /* CADA UNO CON SU SILUETA. Con `barra` --o sea en el taller-- las que
       pueden levantar algo lo levantan segun la urgencia; sin datos no se
       inventa altura y se quedan abajo, en gris, como el resto del fantasma. */
    const forma = formaDe(eq);
    /* EL COLOR DE LA MAQUINA, no el de la zona: los montacargas amarillos,
       las plataformas Genie azules, los vehiculos blancos. Donde esta y si se
       sabe como esta lo dice la mancha del piso. */
    const PROPIO = { montacargas:"#e8a317", tijera:"#4f8fe0", brazo:"#4f8fe0",
                     pickup:"#c9ced2", camion:"#c9ced2", grua:"#e8a317" };
    const cuerpo = PROPIO[forma] || body;
    const semaforo = (opt.barra && ev && !fantasma) ? COL_URG[ev.color] : null;
    const nivel = (opt.barra && ev && !fantasma) ? Math.min(1, ev.urgencia || 0) : 0;
    const img =
        forma === "pickup"  ? pickup(cuerpo, semaforo)
      : forma === "camion"  ? camion(cuerpo, semaforo)
      : forma === "grua"    ? grua(cuerpo, semaforo)
      : forma === "tijera"  ? tijera(cuerpo, semaforo, nivel)
      : forma === "brazo"   ? brazo(cuerpo, semaforo, nivel)
      : semaforo            ? forkliftUrg(body, semaforo, nivel)
      :                       forklift(cuerpo);
    /* TODAS LAS MAQUINAS SE DIBUJAN ENTERAS Y EN SU COLOR.
       El fantasma translucido era una buena idea que en la practica estorbaba:
       con 189 de 215 sin datos, el mapa entero quedaba medio invisible y las
       siluetas no se distinguian. El hueco de dato ahora lo dice la mancha
       gris del piso, que se ve de lejos igual de bien y no se come la figura. */
    ctx.drawImage(img, sx, sy);
    /* AVISO DE CONTRADICCION: hay orden abierta y el equipo NO figura en
       taller. No es un adorno -- es la marca de que la app dejo el estado
       sin cambiar, y de que el tablero de flota lo esta contando como
       disponible mientras un mecanico lo tiene abierto. */
    if(opt.contradice){
      ctx.save();
      ctx.strokeStyle = "#f5a524"; ctx.lineWidth = 1.4; ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.ellipse(p.x, p.y + HH, 15, 7.5, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    /* LA CAJA DE TOQUE ES EL MONTACARGAS Y NADA MAS.
       Llegaba hasta 30 px POR ENCIMA del sprite, que era espacio reservado
       para el rotulo cuando el rotulo iba arriba. Al bajarlo, esos 30 px
       quedaron colgando sobre el equipo de la fila de atras -- y como gana el
       de adelante, el Towmotor se robaba los clicks del MTV-04 que tenia
       detras. Ahora la caja abraza al sprite. */
  }, { x:sx-2, y:sy-2, w:FK_W+4, h:FK_H+5 }, function(){
    /* El arco primero: cuando la ficha sube desde abajo tapa medio mapa, y
       si el arco arranca despues ya no se ve nacer. */
    mostrarArco(eq);
    fichaEquipo(eq, ev, opt.trabajo);
  });
  if(opt.codigo !== false){
    /* ABAJO DEL EQUIPO Y CON FONDO.
       Iba arriba, y con la barra de urgencia iba 45 px mas arriba todavia --
       o sea que aterrizaba encima del montacargas de la fila de atras. Al
       buscar el MT-113 lo que se leia sobre el era "ST-14", que es el rotulo
       de otro. Abajo hay piso vacio y el rotulo cae sobre su propio equipo.
       Y con `box` para que se lea: texto claro sobre un patio gris con
       sombras no se lee, por mas que el color sea el correcto. */
    label(p.x, p.y + HH + 9, (ev && ev.codigo) || eq.codigo || eq.id || "?",
      { size:8.5, col:"#c9ced2", box:true, min:LOD.codigo });
  }
  if(opt.trabajo && opt.trabajo.length) ponerMecanicos(gx, gy, opt.trabajo);
}

/* Los mecanicos que en este momento tienen las manos en ESTE equipo.
   ---------------------------------------------------------------------
   Van al lado del fierro y no en una lista aparte a proposito: la pregunta
   que contestan es "quien esta con el MT-54", y esa pregunta se hace
   mirando el MT-54. Una lista de nombres en un panel obliga a cruzar dos
   cosas en la cabeza.

   Se dibujan hasta DOS aunque la orden nombre cuatro. Tres sprites pegados
   a un montacargas de 24 pixeles se vuelven una mancha, y el numero real
   sale en el rotulo ("+2") y en la ficha al tocar. */
function ponerMecanicos(gx, gy, trabajo){
  const nombres = [];
  let algunoCorriendo = false;
  trabajo.forEach(function(t){
    if(t.corriendo && t.tecnicos.length) algunoCorriendo = true;
    t.tecnicos.forEach(function(n){ if(nombres.indexOf(n) < 0) nombres.push(n); });
  });
  if(!nombres.length){
    /* ORDEN ABIERTA Y NADIE LA FIRMO. Va un mecanico FANTASMA, con la misma
       pinta que un montacargas sin datos: 34% de opacidad y marco punteado.
       El mundo ya tiene una sola forma de decir "de esto falta un dato", y
       usarla tambien aca hace que se entienda sin leer nada -- hay trabajo
       abierto en ese equipo y no se sabe quien lo tiene.
       Antes esto era un renglon de texto que se perdia entre los rotulos. */
    const mx = gx + 0.95, my = gy + 0.5;
    const p = w2s(mx, my);
    const sx = Math.round(p.x - 6), sy = Math.round(p.y + HH - 20);
    push(mx, my, function(){
      sombra(mx, my, 7);
      /* sin marco punteado, igual que el montacargas fantasma: una sola
         manera de decir "falta un dato", y es la transparencia */
      ctx.save(); ctx.globalAlpha = 0.34;
      ctx.drawImage(persona("mec"), sx, sy);
      ctx.restore();
    }, { x:sx-2, y:sy-2, w:16, h:24 }, function(){ fichaMecanico("sin asignar", trabajo); });
    label(p.x, sy - 7, "SIN ASIGNAR",
      { col:"#565b5f", size:7, w:"700", box:true, min:LOD.persona });
    return;
  }
  const pinta = algunoCorriendo ? ["mec", "mec2"] : ["mecq", "mecq"];
  nombres.slice(0, 2).forEach(function(n, i){
    const mx = gx + 0.95 + i*0.75, my = gy + 0.5 + i*0.35;
    const p = w2s(mx, my);
    const sx = Math.round(p.x - 6), sy = Math.round(p.y + HH - 20);
    push(mx, my, function(){
      sombra(mx, my, 7);
      ctx.drawImage(persona(pinta[i] || pinta[0]), sx, sy);
    }, { x:sx-2, y:sy-2, w:16, h:24 }, function(){ fichaMecanico(n, trabajo); });
  });
  /* Un solo rotulo para los dos: dos nombres uno encima del otro sobre un
     montacargas no se leen. El primero, y cuantos mas hay. */
  const p = w2s(gx + 1.1, gy + 0.6);
  const extra = nombres.length > 1 ? "  +" + (nombres.length - 1) : "";
  label(p.x, Math.round(p.y + HH - 20) - 7, nombres[0].toUpperCase() + extra,
    { col: algunoCorriendo ? "#f5c542" : "#8b9096", size:7.5, w:"700", box:true,
      min:LOD.persona });
  if(!algunoCorriendo){
    /* Si esta detenido, el motivo va escrito: "en pausa" y "esperando
       repuestos" se arreglan de maneras muy distintas. */
    label(p.x, Math.round(p.y + HH - 20) + 4, String(trabajo[0].estado).toLowerCase(),
      { col:"#6f757a", size:7, box:true, min:LOD.codigo });
  }
}

/* --------- ZONA 1: TALLER --------- */
function zonaTaller(mant){
  const z = ZONA.taller;
  push(z.x, z.y, function(){
    floor(z.x, z.y, z.w, z.d, z.piso, z.linea);
    /* bahias: piso rayado y muro al fondo */
    isoBox(z.x, z.y-0.4, z.w, 0.4, 26, "#31363a", { line:"#3f4448" });
    isoBox(z.x-0.4, z.y, 0.4, z.d, 26, "#2b3033", { line:"#3f4448" });
  });
  rotuloZona(z);

  if(state.flotaErr && !state.flotaParcial){ zonaApagada(z, state.flotaErr); return; }

  const lista = mant.taller;
  if(!lista.length){
    label(centroZona(z).x, centroZona(z).y, "TALLER VACÍO", { col:"#3ecf7e", size:11, w:"700", fam:"disp" });
    return;
  }
  /* el mas urgente primero, arriba a la izquierda */
  const pos = rejilla(lista.length, 6, z.x+1.6, z.y+1.4, 3.4, 2.8);
  lista.forEach(function(it, i){
    const p = pos[i] || { gx:z.x+1.6, gy:z.y+1.4 + i*2.8 };
    ponerEquipo(p.gx, p.gy, it.eq, it.ev, { barra:true, body:"#e5534b" });
  });
  /* Debajo de la ULTIMA fila de equipos, no del borde nominal de la zona:
     con 48 montacargas la rejilla se sale de la zona por abajo, y la bahia
     quedaba plantada en medio de los fierros. */
  const filas = Math.ceil(lista.length / 6);
  mecanicosSinEquipo(z, z.y + 1.4 + filas * 2.8 + 1.4);
}

/* La bahia de los que trabajan en algo que el mapa no puede dibujar.
   No es un caso raro que se pueda ignorar: son ocho ordenes y seis
   mecanicos. Si no salen, el taller se ve mas vacio de lo que esta. */
function mecanicosSinEquipo(z, y0){
  const sueltas = enCurso.sueltas || [];
  if(!sueltas.length) return;
  const nombres = [];
  sueltas.forEach(function(t){
    t.tecnicos.forEach(function(n){ if(nombres.indexOf(n) < 0) nombres.push(n); });
  });
  if(!nombres.length) return;
  nombres.slice(0, 6).forEach(function(n, i){
    const gx = z.x + 1.2 + (i % 3) * 1.5, gy = y0 + Math.floor(i / 3) * 1.2;
    const p = w2s(gx, gy);
    const sx = Math.round(p.x - 6), sy = Math.round(p.y + HH - 20);
    push(gx, gy, function(){
      sombra(gx, gy, 7);
      ctx.drawImage(persona(i % 2 ? "mec2" : "mec"), sx, sy);
    }, { x:sx-2, y:sy-2, w:16, h:24 }, function(){ fichaMecanico(n, sueltas); });
    label(p.x, sy - 7, n.split(" ")[0].toUpperCase(),
      { col:"#f5c542", size:7, box:true, min:LOD.persona });
  });
  const c = w2s(z.x + z.w/2, y0 - 0.9);
  label(c.x, c.y, "MEC\u00c1NICOS SIN EQUIPO EN EL MAPA \u00b7 " + sueltas.length + " \u00f3rdenes",
    { col:"#f5a524", size:9, w:"700", fam:"disp", box:true, min:LOD.resumen });
  label(c.x, c.y + 11, "la m\u00e1quina es del cliente, o su registro ya no existe",
    { col:"#8b9096", size:8, box:true, min:LOD.resumen });
}

/* --------- ZONA 2: PATIO --------- */
function zonaPatio(mant){
  const z = ZONA.patio;
  push(z.x, z.y, function(){
    floor(z.x, z.y, z.w, z.d, z.piso, null);
    /* lineas de estacionamiento */
    ctx.save(); ctx.globalAlpha = 0.35; ctx.strokeStyle = "#565b5f"; ctx.lineWidth = 1;
    for(let j=0;j<=z.d;j+=3){
      const a = w2s(z.x, z.y+j), b = w2s(z.x+z.w, z.y+j);
      ctx.beginPath(); ctx.moveTo(a.x, a.y+HH); ctx.lineTo(b.x, b.y+HH); ctx.stroke();
    }
    ctx.restore();
  });
  rotuloZona(z);

  if(state.flotaErr && !state.flotaParcial){ zonaApagada(z, state.flotaErr); return; }

  const lista = mant.patio;
  const c = centroZona(z);
  if(!lista.length){
    /* patio vacio = todo rentado. Es buena noticia y se dice como tal. */
    label(c.x, c.y, "PATIO VACÍO", { col:"#3ecf7e", size:12, w:"800", fam:"disp" });
    label(c.x, c.y+13, "todo el equipo está afuera", { col:"#8b9096", size:9 });
    return;
  }
  const pos = rejilla(lista.length, 5, z.x+1.5, z.y+1.2, 3.2, 2.4);
  lista.forEach(function(it, i){
    const p = pos[i]; if(!p) return;
    ponerEquipo(p.gx, p.gy, it.eq, it.ev, { body:"#3ecf7e" });
  });
  label(c.x, c.y + (z.w + z.d) * HH / 2 + 16, lista.length + " disponibles · " +
        (mant.total ? Math.round(lista.length/mant.total*100) : 0) + "% de la flota parqueada",
        { col:"#8b9096", size:9.5, box:true, min:LOD.resumen });
}

/* --------- ZONA 3: CAMPO / CLIENTES --------- */
/* Donde quedo dibujado cada sitio de cliente. Lo llena zonaCampo y lo usa la
   linea en arco para saber a donde apuntar. */
let sitiosCliente = {};

/* Los nombres que NO son un cliente: son el taller, o somos nosotros.
   ---------------------------------------------------------------------
   Cuando una maquina entra al taller, la app le PISA el campo `cliente` con
   el nombre del taller. De los 48 que hay adentro hoy, 31 quedaron asi y a
   esos no hay a donde apuntarles: el dato de quien es se perdio al entrar,
   no es que no lo encontremos. Los otros 17 conservan su cliente --diez de
   San Juan Textil, dos de Elcatex-- y esos si se pueden amarrar. */
const NO_ES_CLIENTE = /^(TALLER|PLANTEL|MONTASA|MONHACO|MT RENTAL|EN CLIENTE)\b/i;
function clienteDe(eq){
  const n = String(primerCampo(eq, CAMPOS_CLIENTE) || "").trim();
  if(!n || NO_ES_CLIENTE.test(n)) return null;
  return n.toUpperCase();
}

function zonaCampo(mant){
  const z = ZONA.campo;
  /* sin piso: el anillo no es una sala, es el afuera */

  if(state.flotaErr && !state.flotaParcial){ zonaApagada(z, state.flotaErr); return; }

  const grupos = mant.campo;      // [{nombre, sondeado, items:[]}]
  sitiosCliente = {};
  const c = centroZona(z);
  if(!grupos.length){
    label(c.x, c.y, "NADA EN RENTA", { col:"#565b5f", size:12, w:"800", fam:"disp" });
    return;
  }
  /* bajo el rotulo de zona: los ingresos de renta del mes (RADAR, 5.3) */
  const rd = state.radar;
  let ing = null;
  if(rd && typeof rd === "object" && rd.flota) ing = fixUsd(rd.flota.ingresos_renta_mes, rd);

  /* LOS SITIOS DE CLIENTE, EN UN ANILLO.
     ---------------------------------------------------------------------
     El radio no es a gusto: sale de cuanto sitio hay que meter. Cada sitio
     ocupa ~ANCHO de arco, asi que el perimetro tiene que dar para todos y el
     radio es perimetro/2pi. Con 28 clientes dan unos 44 de radio. Si un dia
     son 60, el anillo crece solo en vez de encimarse.

     Los grandes arriba: el orden es por cantidad de equipos y se empieza en
     el norte, asi el cliente con mas fierro queda donde primero se mira.
     La rejilla del mundo es isometrica, o sea una transformacion lineal: un
     circulo en coordenadas de piso se dibuja como un circulo (aplastado 2:1),
     que es justo como se ve un patio redondo visto de esquina. */
  const ANCHO_SITIO = 11;
  /* CADA SITIO OCUPA EL ARCO QUE MIDE, no un pedazo igual que los demas.
     Repartiendo el circulo en partes iguales, San Juan Textil --que con 27
     equipos mide diez veces mas alto que uno de un equipo-- se le montaba
     encima a sus dos vecinos, y El Salvador a Elcatex. Ahora se suma cuanto
     mide cada uno, y a cada cual le toca la proporcion que le corresponde:
     los grandes empujan a los chicos en vez de taparlos.

     El radio tiene dos pisos y gana el mayor:
       · el PERIMETRO, que ahora es la suma de los tamanos y no la cuenta;
       · el CENTRO, para que el anillo no se le venga encima a lo nuestro. */
  const RADIO_CENTRO = 26 + 14 + 16;
  const altoDe = function(g){
    return Math.max(3.2, 1.8 + Math.ceil(g.items.length / 3) * 2.2);
  };
  const tam = grupos.map(function(g){ return Math.max(ANCHO_SITIO, altoDe(g) + 3.5); });
  const suma = tam.reduce(function(a, b){ return a + b; }, 0);
  const R = Math.max(RADIO_CENTRO, suma / (2 * Math.PI));
  /* EL ROTULO DEL ANILLO, AHORA QUE SE CONOCE EL RADIO.
     Estaba mas arriba en la funcion y usaba `R` antes de declararlo: en
     JavaScript eso no es `undefined`, es una excepcion --"Cannot access 'R'
     before initialization"-- que tiraba zonaCampo entera. Resultado: ni el
     rotulo CAMPO ni el anillo de clientes. Y como pasaba dentro del refresco,
     que tiene su propio try, se tragaba en silencio.
     El punto mas alto del anillo esta en el norte: gx=0, gy=-R. */
  const az = { x: w2s(0, -R).x, y: w2s(0, -R).y - 30 };
  label(az.x, az.y, "CAMPO / CLIENTES",
        { col:"#4f8fe0", size:12, w:"800", fam:"disp", box:true });
  label(az.x, az.y + 14,
        ing != null ? ("renta del mes · " + usd(ing)) : "renta del mes · sin dato de RADAR",
        { col: ing != null ? "#4f8fe0" : "#565b5f", size:9, min:LOD.resumen });

  let angAcum = -Math.PI / 2;
  grupos.forEach(function(g, gi){
    const alto = altoDe(g);
    const paso = (tam[gi] / suma) * Math.PI * 2;
    const ang = angAcum + paso / 2;
    angAcum += paso;
    const gx = Math.cos(ang) * R - 4.3, gy = Math.sin(ang) * R - alto / 2;
    const ox = gx, oy = gy, ancho = 8.6;
    sitiosCliente[String(g.nombre).toUpperCase()] = { gx: ox + ancho/2, gy: oy + alto/2 };
    const shedW = Math.min(ancho, 6);
    push(ox, oy - 2.2, function(){
      /* patio del cliente */
      floor(ox, oy, ancho, alto, "#2a2f33", "#343a3e");
      /* nave / galpon al fondo: gris, con canto azul (= sitio de cliente) */
      isoBox(ox, oy - 2.2, shedW, 2.2, 20, "#343b40", { line:"#454e54", topCol:"#3d474d" });
      isoBox(ox, oy - 0.45, shedW, 0.35, 3, "#4f8fe0", { z:20 });          // canto del techo
      isoBox(ox + shedW*0.35, oy - 0.42, 1.3, 0.3, 13, "#22282c", { line:"#454e54" }); // porton
    }, { x: w2s(ox, oy - 2.2).x - 40, y: w2s(ox, oy - 2.2).y - 20,
         w: 80, h: (ancho + alto) * HH / 2 + 40 },
       function(){ fichaCliente(g.nombre); });
    /* rotulo del sitio, justo encima del vertice mas alto de la nave */
    const rc = { x: w2s(ox + shedW/2, oy - 1.1).x, y: w2s(ox, oy - 2.2).y - 36 };
    label(rc.x, rc.y, g.nombre,
          { col:"#4f8fe0", size:11, w:"700", fam:"disp", box:true, min:LOD.sitio });
    /* La cuenta SOLO si hay tres o mas. Con uno o dos se VEN los montacargas y
       el numero no agrega nada: era "1 equipo" escrito treinta veces alrededor
       del anillo, puro ruido con forma de dato. */
    if(g.items.length >= 3 || !g.sondeado){
      label(rc.x, rc.y + 12,
            g.sondeado ? (g.items.length + " equipos")
                       : (g.items.length + " equipos · sin campo de cliente en la base"),
            { col: g.sondeado ? "#8b9096" : "#565b5f", size:8.5, box:true, min:LOD.cuenta });
    }
    g.items.forEach(function(it, i){
      const px = ox + 1.4 + (i % 3) * 2.7, py = oy + 0.8 + Math.floor(i/3) * 2.2;
      ponerEquipo(px, py, it.eq, it.ev, { body:"#4f8fe0" });
    });
  });
}

/* =====================================================================
   EL EDIFICIO: bullpen al centro, ocho oficinas alrededor
   ===================================================================== */
function vecUnit(dx, dy){
  const m = Math.hypot(dx, dy) || 1;
  return { x:dx/m, y:dy/m };
}
/* La puerta de una oficina mira SIEMPRE al bullpen: es la conexión directa. */
function puertaDe(d){
  const v = vecUnit(EDIF.cx - d.cx, EDIF.cy - d.cy);
  return { gx: d.cx + v.x * (EDIF.ow/2), gy: d.cy + v.y * (EDIF.od/2), v:v };
}
/* Dónde toca el corredor el borde del bullpen. */
function bocaBullpen(d){
  const v = vecUnit(d.cx - EDIF.cx, d.cy - EDIF.cy);
  const z = ZONA.bullpen;
  return { gx: EDIF.cx + v.x * (z.w/2 - 0.5), gy: EDIF.cy + v.y * (z.d/2 - 0.5) };
}

function zonaEdificio(datos){
  const z = ZONA.bullpen;

  /* --- corredores: se dibujan primero, por debajo de todo --- */
  DEPTOS.forEach(function(d){
    const a = bocaBullpen(d), b = puertaDe(d);
    push(Math.min(a.gx,b.gx), Math.min(a.gy,b.gy) - 0.2, function(){
      const pasos = 14;
      for(let i=0;i<=pasos;i++){
        const t = i/pasos;
        const gx = a.gx + (b.gx-a.gx)*t, gy = a.gy + (b.gy-a.gy)*t;
        tile(Math.round(gx*2)/2, Math.round(gy*2)/2, "#31363a", null);
      }
    });
  });

  /* --- el bullpen --- */
  push(z.x, z.y, function(){
    floor(z.x, z.y, z.w, z.d, z.piso, z.linea);
    /* borde elevado: se ve que es un pozo central y no un cuarto más */
    isoBox(z.x - 0.3, z.y - 0.3, z.w + 0.6, 0.3, 7, "#3a4044", { line:"#474d51" });
    isoBox(z.x - 0.3, z.y + z.d, z.w + 0.6, 0.3, 7, "#3a4044", { line:"#474d51" });
    isoBox(z.x - 0.3, z.y, 0.3, z.d, 7, "#343a3e", { line:"#474d51" });
    isoBox(z.x + z.w, z.y, 0.3, z.d, 7, "#343a3e", { line:"#474d51" });
    /* mesa larga del bullpen */
    isoBox(EDIF.cx - 3.6, EDIF.cy - 1.2, 7.2, 2.4, 14, "#4a4038", { line:"#5b5045" });
  });
  rotuloZona(z);

  /* --- JARVIS, en el centro del bullpen --- */
  CENTRALES.forEach(function(c){
    const gx = EDIF.cx + c.dx - 0.9, gy = EDIF.cy + c.dy - 0.7;
    const p = w2s(gx + 0.9, gy + 0.7);
    push(gx, gy, function(){
      /* torre + pantalla encendida */
      isoBox(gx, gy, 1.8, 1.4, 20, "#2b3033", { line:"#454b4f", z:14 });
      const f = 0.55 + 0.45*Math.sin((Date.now()-t0)/(c.id === "jarvis" ? 420 : 300));
      isoBox(gx + 0.2, gy + 0.15, 1.4, 0.2, 13, shade(c.col, 0.3 + f*0.8), { z:20 });
      /* halo */
      ctx.save(); ctx.globalAlpha = 0.10 + 0.08*f; ctx.fillStyle = c.col;
      ctx.beginPath(); ctx.ellipse(p.x, p.y - 6, 34, 17, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
    }, { x:p.x-22, y:p.y-46, w:44, h:56 }, function(){ fichaCentral(c); });
    label(p.x, p.y - 50, c.nombre, { col:c.col, size:12, w:"800", fam:"disp", box:true });
    label(p.x, p.y - 38, c.id === "jarvis" ? "IA central" : "IA central · el mundo",
          { col:"#8b9096", size:8, box:true });
  });

  /* --- las ocho oficinas --- */
  DEPTOS.forEach(function(d){ oficinaDepto(d, datos); });
}

function oficinaDepto(d, datos){
  const pu = puertaDe(d);
  push(d.x, d.y, function(){
    floor(d.x, d.y, d.w, d.d, d.piso, d.linea);
    /* paredes bajas alrededor, con el color del depto en el canto */
    isoBox(d.x - 0.25, d.y - 0.25, d.w + 0.5, 0.25, 30, "#383d41", { line:"#464c50" });
    isoBox(d.x - 0.25, d.y, 0.25, d.d, 30, "#31363a", { line:"#464c50" });
    isoBox(d.x - 0.25, d.y - 0.25, d.w + 0.5, 0.25, 3, d.col, { z:30 });
    /* la puerta, mirando al bullpen */
    isoBox(pu.gx - 0.6, pu.gy - 0.3, 1.2, 0.3, 22, "#22262a", { line:d.col });
  });

  /* rótulo arriba de la oficina */
  const c = centroZona(d);
  const alto = (d.w + d.d) * HH / 2 + 42;
  d._ytit = c.y - alto;
  label(c.x, d._ytit, d.nombre, { col:d.col, size:12, w:"800", fam:"disp", box:true });
  if(d.sub) label(c.x, d._ytit + 12, d.sub, { col:"#8b9096", size:8.5, box:true });

  /* la gente */
  d.gente.forEach(function(g, i){
    const gx = d.x + 1.4 + i * 2.4, gy = d.y + d.d - 1.7;
    const p = w2s(gx, gy);
    const sx = Math.round(p.x - 6), sy = Math.round(p.y + HH - 20);
    push(gx, gy, function(){
      sombra(gx, gy, 7);
      ctx.drawImage(persona(g.tipo === "gen" && i ? "gen2" : (g.tipo || "gen")), sx, sy);
    }, { x:sx-4, y:sy-4, w:20, h:28 }, function(){ fichaDepto(d, datos); });
    if(g.n) label(p.x, sy - 7, g.n.toUpperCase(), { col:"#8b9096", size:8, box:true });
  });

  /* lo que esa oficina muestra de verdad */
  contenidoDepto(d, datos);

  /* toda la oficina es tappable por su piso */
  const cc = w2s(d.x + d.w/2, d.y + d.d/2);
  push(d.x + d.w/2, d.y + d.d/2, function(){}, { x:cc.x-40, y:cc.y-10, w:80, h:30 },
       function(){ fichaDepto(d, datos); });
}

/* Cada oficina muestra sus propios datos. Si no tiene fuente todavía, lo
   dice: la oficina existe pero está vacía, y eso se ve. */
function contenidoDepto(d, datos){
  const c = centroZona(d);
  /* debajo del título, no debajo de la oficina: abajo está el bullpen */
  const bajo = (d._ytit || (c.y - 60)) + (d.sub ? 24 : 13);
  const filas = [];

  if(d.muestra === "caja"){
    const P = datos.papeles;
    if(P.err) filas.push(["no se pudo leer", "#e5534b"]);
    else if(P.sinSede) filas.push(["sin sede asignada", "#565b5f"]);
    else {
      filas.push([P.por.rev.length + " esperando decisión", P.por.rev.length ? "#f5a524" : "#565b5f"]);
      filas.push([P.por.pend.length + " pendientes · " + P.por.liq.length + " liquidados", "#8b9096"]);
    }
    /* escritorios con papeles: la versión chica de las cuatro estaciones */
    ESTACIONES.slice(0,4).forEach(function(st, i){
      const gx = d.x + 0.8 + (i%2)*3.2, gy = d.y + 0.7 + Math.floor(i/2)*1.9;
      const n = (datos.papeles.por[st.id] || []).length;
      push(gx, gy, function(){
        isoBox(gx, gy, 2.0, 1.2, 11, "#3a3f43", { line:"#4a5054", topCol: shade(MESA[st.id], 0.34) });
        for(let k=0;k<Math.min(n,4);k++){
          const pp = w2s(gx + 0.4 + k*0.45, gy + 0.4);
          ctx.drawImage(papel(MESA[st.id]), Math.round(pp.x-4), Math.round(pp.y+HH-23));
        }
      });
    });
  }
  else if(d.muestra === "bodega"){
    const B = datos.bodega;
    if(B.err) filas.push(["no se pudo leer", "#e5534b"]);
    else{
      const negs = B.sedes.reduce((a,s)=>a + s.productos.filter(p=>p.neto<0).length, 0);
      const prods = B.sedes.reduce((a,s)=>a + s.productos.length, 0);
      filas.push([prods + " productos", "#8b9096"]);
      filas.push([negs + " en negativo", negs ? "#e5534b" : "#565b5f"]);
    }
    for(let i=0;i<3;i++){
      const gx = d.x + 0.7 + i*2.4, gy = d.y + 0.8;
      push(gx, gy, function(){
        isoBox(gx, gy, 0.22, 1.1, 30, "#5b5045", { line:"#6b5e50" });
        isoBox(gx+2.1, gy, 0.22, 1.1, 30, "#5b5045", { line:"#6b5e50" });
        isoBox(gx, gy, 2.32, 1.1, 2, "#4a4038", { z:2,  line:"#6b5e50" });
        isoBox(gx, gy, 2.32, 1.1, 2, "#4a4038", { z:16, line:"#6b5e50" });
        for(let k=0;k<2;k++) isoBox(gx+0.4+k*0.9, gy+0.2, 0.7, 0.7, 9, "#a9741f", { z:18, line:"#101213" });
      });
    }
  }
  else if(d.muestra === "kpis"){
    filas.push([selected.size + " de 51 KPIs colgados", "#8b9096"]);
    filas.push([FIX_IDS.size + " sin energía", "#e5534b"]);
    /* pared de cuadros, versión chica */
    [...selected].slice(0, 8).forEach(function(id, i){
      const gx = d.x + 0.8 + (i%4)*1.7, gy = d.y + 0.6 + Math.floor(i/4)*1.4;
      const p = w2s(gx, gy);
      push(gx, gy, function(){
        objetoKpi(Math.round(p.x-9), Math.round(p.y+HH-30), "cuadro", FIX_IDS.has(id), true);
      });
    });
    isoBoxDepto(d, 3.6, 3.8, 3.0, 1.6, 13, "#4a4038");
  }
  else if(d.muestra === "renta"){
    const f = datos.flota;
    filas.push([f.renta + " equipos en renta", f.renta ? "#4f8fe0" : "#565b5f"]);
    filas.push([f.patio.length + " disponibles para vender/rentar", "#3ecf7e"]);
    isoBoxDepto(d, 0.8, 0.8, 2.8, 1.6, 13, "#4a4038");
    isoBoxDepto(d, 4.4, 0.8, 2.6, 1.6, 13, "#4a4038");
  }
  else if(d.muestra === "radar"){
    const rd = state.radar;
    const ok = rd && typeof rd === "object";
    filas.push([ok ? "RADAR responde" : "RADAR sin conectar", ok ? "#3ecf7e" : "#e5534b"]);
    if(ok && rd.cache_edad_seg != null) filas.push(["caché de " + rd.cache_edad_seg + " s", "#8b9096"]);
    isoBoxDepto(d, 0.9, 0.9, 3.4, 1.8, 14, "#3a3f43");
    isoBoxDepto(d, 5.0, 0.9, 2.0, 1.8, 22, "#2b3033");
  }
  else if(d.muestra === "gente"){
    filas.push([ROLES_MUNDO + " roles con acceso", "#8b9096"]);
    filas.push(["la oficina de Elia", "#c77dd1"]);
    isoBoxDepto(d, 0.9, 0.9, 3.0, 1.8, 13, "#4a4038");
  }
  else{
    filas.push(["sin fuente de datos todavía", "#565b5f"]);
    filas.push(["la oficina existe, está vacía", "#565b5f"]);
    isoBoxDepto(d, 0.9, 0.9, 3.0, 1.8, 13, "#4a4038");
  }

  filas.forEach(function(f, i){
    label(c.x, bajo + i*11, f[0], { col:f[1], size:8.5, box:true });
  });
}

function isoBoxDepto(d, ox, oy, w, dd, h, col){
  const gx = d.x + ox, gy = d.y + oy;
  push(gx, gy, function(){ isoBox(gx, gy, w, dd, h, col, { line:shade(col,1.3) }); });
}
const ROLES_MUNDO = 11;
/* El color de cada estación del flujo de caja chica. Se usa en la oficina de
   Finanzas, que es donde ese flujo vive ahora. */
const MESA = { pend:"#57606a", rev:"#f5a524", aprob:"#3ecf7e", liq:"#4f8fe0", rech:"#e5534b" };

/* =====================================================================
   LOS MENSAJES QUE CRUZAN EL EDIFICIO
   ---------------------------------------------------------------------
   No son adorno: cada punto que viaja es un registro real. Sale de la
   oficina de quien lo pidió, entra al bullpen, ahí se procesa, y sigue
   hacia la oficina que le toca. Si no hay nada pendiente, no cruza nada.
   ===================================================================== */
const ROL_DEPTO = {
  contabilidad:"finanzas", almacen_sps:"almacen", almacen_choloma:"almacen",
  ventas1:"ventas", ventas2:"ventas", ventas3:"ventas", ventas4:"ventas",
  gerente_general:"omar", gerente_comercial:"ventas", rrhh:"hr", admin:"fabri"
};
const COL_MSG = { encargo:"#4f8fe0", aprobacion:"#f5a524", mejora:"#c9c6bd" };
let pulsos = [];

function computePulsos(datos){
  const out = [];
  const vivos = ["Sin traducir","Entregado","Aceptado"];
  (state.encargos || []).forEach(function(e){
    const de = ROL_DEPTO[e.de_rol], a = ROL_DEPTO[e.para_rol];
    if(!DEPTO[de] || !DEPTO[a] || vivos.indexOf(e.estado) < 0) return;
    out.push({ de:de, a:a, tipo:"encargo", texto:(e.titulo_visible || "encargo") });
  });
  (state.mejoras || []).forEach(function(m){
    const de = ROL_DEPTO[m.rol];
    if(!DEPTO[de] || m.estado !== "Nueva") return;
    out.push({ de:de, a:"fabri", tipo:"mejora", texto:(m.titulo || "pedido de mejora") });
  });
  /* los gastos esperando decisión: de finanzas al bullpen y de ahí a gerencia */
  const rev = (datos.papeles.por && datos.papeles.por.rev) ? datos.papeles.por.rev : [];
  rev.slice(0, 6).forEach(function(r){
    out.push({ de:"finanzas", a:"omar", tipo:"aprobacion",
               texto:(r.concepto || "gasto") + " · " + fmtL(r.monto) });
  });
  out.forEach(function(p, i){ p.off = (i * 0.37) % 1; });
  return out.slice(0, 24);
}

const CICLO_MS = 5200;
function dibujarPulsos(){
  if(!pulsos.length) return;
  const ahora = Date.now();
  pulsos.forEach(function(p){
    const d1 = DEPTO[p.de], d2 = DEPTO[p.a];
    if(!d1 || !d2) return;
    const f = (((ahora / CICLO_MS) + p.off) % 1);
    const A = puertaDe(d1), C = { gx:EDIF.cx, gy:EDIF.cy }, B = puertaDe(d2);
    let gx, gy, brillo = 1;
    if(f < 0.42){                                  // oficina -> bullpen
      const t = f / 0.42;
      gx = A.gx + (C.gx - A.gx) * t; gy = A.gy + (C.gy - A.gy) * t;
    }else if(f < 0.58){                            // se procesa en el centro
      gx = C.gx; gy = C.gy;
      brillo = 0.45 + 0.55 * Math.abs(Math.sin((f - 0.42) * 28));
    }else{                                         // bullpen -> la otra oficina
      const t = (f - 0.58) / 0.42;
      gx = C.gx + (B.gx - C.gx) * t; gy = C.gy + (B.gy - C.gy) * t;
    }
    const w = w2s(gx, gy);
    const col = COL_MSG[p.tipo] || "#8b9096";
    ctx.save();
    ctx.globalAlpha = 0.22 * brillo; ctx.fillStyle = col;
    ctx.beginPath(); ctx.ellipse(w.x, w.y - 10, 9, 5, 0, 0, Math.PI*2); ctx.fill();
    ctx.globalAlpha = brillo;
    ctx.fillStyle = "#101213"; ctx.fillRect(Math.round(w.x-3), Math.round(w.y-14), 6, 6);
    ctx.fillStyle = col;       ctx.fillRect(Math.round(w.x-2), Math.round(w.y-13), 4, 4);
    ctx.restore();
  });
}
