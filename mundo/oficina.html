<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Mi Oficina · Mundo Montasa</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Oficina">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#17191a">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#17191a; --panel:#202325; --panel-line:#34383b;
    --amber:#f5a524; --amber-dim:#a9741f; --green:#3ecf7e; --red:#e5534b; --blue:#4f8fe0;
    --ink:#eae7e0; --ink-dim:#8b9096; --ink-faint:#565b5f;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;overflow:hidden;}
  body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Mono',monospace;
    -webkit-font-smoothing:antialiased;overscroll-behavior:none;}
  .display{font-family:'Barlow Condensed',sans-serif;}
  button{font-family:inherit;cursor:pointer;}

  /* ================= LOGIN ================= */
  #login{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;
    padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));
    display:flex;align-items:center;justify-content:center;}
  .card{background:var(--panel);border:1px solid var(--panel-line);padding:24px 20px;
    max-width:440px;width:100%;}
  .card h1{font-family:'Barlow Condensed',sans-serif;font-size:26px;font-weight:800;letter-spacing:.5px;line-height:1;}
  .card .sub{color:var(--ink-dim);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin:6px 0 20px;}
  .roles{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px;}
  .role{background:transparent;border:1px solid var(--panel-line);color:var(--ink-dim);
    font-size:11px;text-align:left;padding:9px 10px;display:flex;align-items:center;gap:8px;}
  .role .d{width:7px;height:7px;border-radius:50%;flex:0 0 auto;}
  .role.on{border-color:var(--amber);color:var(--ink);background:rgba(245,165,36,.07);}
  #codigo{width:100%;background:#191c1d;border:1px solid var(--panel-line);color:var(--ink);
    font-family:inherit;font-size:15px;letter-spacing:3px;padding:11px 12px;text-align:center;}
  #codigo:focus{outline:none;border-color:var(--amber);}
  .primary{width:100%;margin-top:10px;background:var(--amber);border:0;color:#1a1a1a;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:16px;letter-spacing:2px;
    text-transform:uppercase;padding:12px;}
  .primary:disabled{background:var(--panel-line);color:var(--ink-faint);cursor:default;}
  .err{color:var(--red);font-size:11px;margin-top:10px;min-height:15px;line-height:1.4;}
  .nota{font-size:10px;line-height:1.6;color:var(--ink-dim);border-left:2px solid var(--panel-line);
    padding-left:9px;margin-top:16px;}
  .nota b{color:var(--ink);}
  .volver{display:inline-block;margin-top:14px;color:var(--ink-faint);font-size:10px;
    letter-spacing:1.5px;text-transform:uppercase;text-decoration:none;}
  .volver:hover{color:var(--amber);}

  /* ================= APP ================= */
  #app{display:none;}
  #sala{position:fixed;inset:0;display:block;touch-action:manipulation;}

  #top{position:fixed;left:0;right:0;top:0;z-index:5;pointer-events:none;
    padding:calc(8px + env(safe-area-inset-top)) 10px 8px;
    background:linear-gradient(180deg,rgba(23,25,26,.94) 62%,rgba(23,25,26,0));
    display:flex;align-items:center;gap:8px;}
  #top > *{pointer-events:auto;}
  .icobtn{width:30px;height:30px;flex:0 0 auto;border:1px solid var(--panel-line);
    background:var(--panel);color:var(--ink-dim);font-size:14px;line-height:1;
    display:flex;align-items:center;justify-content:center;text-decoration:none;}
  .icobtn:active{border-color:var(--amber);color:var(--amber);}
  .icobtn.avisa{border-color:var(--amber);color:var(--amber);}
  .quien{min-width:0;}
  .quien b{display:block;font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:17px;
    line-height:1;letter-spacing:.4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .quien span{display:block;font-size:8.5px;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--ink-dim);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  #motor{margin-left:auto;flex:0 0 auto;font-size:8.5px;letter-spacing:1px;text-align:right;
    line-height:1.5;color:var(--ink-dim);white-space:nowrap;}
  #motor b{display:block;font-size:9.5px;letter-spacing:1.2px;}
  #motor.on b{color:var(--green);} #motor.off b{color:var(--red);}

  /* bandeja de tareas */
  #bandeja{position:fixed;left:0;right:0;bottom:0;z-index:5;
    padding:8px 10px calc(8px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg,rgba(23,25,26,.95) 58%,rgba(23,25,26,0));}
  .bhead{display:flex;align-items:baseline;gap:8px;margin-bottom:6px;padding:0 2px;}
  .bhead b{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:12px;
    letter-spacing:1.8px;text-transform:uppercase;}
  .bhead span{font-size:9px;color:var(--ink-dim);}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex:0 0 auto;max-width:74vw;background:var(--panel);border:1px solid var(--panel-line);
    color:var(--ink);text-align:left;padding:7px 10px;display:flex;flex-direction:column;gap:3px;}
  .chip i{font-style:normal;font-size:8px;letter-spacing:1.4px;text-transform:uppercase;color:var(--amber);}
  .chip u{text-decoration:none;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;}
  .chip.crit{border-color:var(--red);} .chip.crit i{color:var(--red);}
  .chip.listo{border-color:var(--green);} .chip.listo i{color:var(--green);}
  .chip.espera{border-color:var(--blue);} .chip.espera i{color:var(--blue);}
  .vacio{font-size:10.5px;color:var(--ink-faint);padding:8px 2px;}

  /* ================= MODAL ================= */
  #modal{position:fixed;inset:0;z-index:30;background:rgba(10,11,12,.72);
    display:none;align-items:flex-end;justify-content:center;}
  #modal.on{display:flex;}
  .sheet{background:var(--panel);border-top:2px solid var(--amber);width:100%;max-width:620px;
    max-height:88vh;display:flex;flex-direction:column;
    padding:14px 14px calc(14px + env(safe-area-inset-bottom));}
  .sheet.q{border-top-color:var(--amber);} .sheet.c{border-top-color:var(--blue);}
  .sheet.ok{border-top-color:var(--green);} .sheet.bad{border-top-color:var(--red);}
  .shead{display:flex;align-items:flex-start;gap:10px;margin-bottom:10px;}
  .shead .k{font-size:8.5px;letter-spacing:2px;text-transform:uppercase;color:var(--amber);}
  .shead h2{font-family:'Barlow Condensed',sans-serif;font-size:20px;font-weight:800;
    letter-spacing:.4px;line-height:1.1;margin-top:3px;}
  .shead .x{margin-left:auto;flex:0 0 auto;width:28px;height:28px;background:transparent;
    border:1px solid var(--panel-line);color:var(--ink-dim);font-size:13px;}
  .sbody{overflow-y:auto;flex:1;min-height:0;}
  .ctx{background:#191c1d;border:1px solid var(--panel-line);padding:10px;font-size:11px;
    line-height:1.65;color:var(--ink-dim);white-space:pre-wrap;word-break:break-word;}
  .ctx b{color:var(--ink);}
  label.lab{display:block;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--ink-dim);margin:14px 0 6px;}
  textarea{width:100%;min-height:88px;background:#191c1d;border:1px solid var(--panel-line);
    color:var(--ink);font-family:inherit;font-size:12.5px;line-height:1.6;padding:10px;resize:vertical;}
  textarea:focus{outline:none;border-color:var(--amber);}
  .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap;}
  .acts button{flex:1 1 auto;min-width:110px;padding:11px 8px;border:1px solid var(--panel-line);
    background:transparent;color:var(--ink);font-family:'Barlow Condensed',sans-serif;
    font-weight:700;font-size:14px;letter-spacing:1.2px;text-transform:uppercase;}
  .acts .go{border-color:var(--amber);color:var(--amber);}
  .acts .ok{border-color:var(--green);color:var(--green);}
  .acts .no{border-color:var(--red);color:var(--red);}
  .acts button:disabled{opacity:.4;cursor:default;}
  .ops{display:flex;flex-direction:column;gap:7px;margin-top:12px;}
  .ops button{width:100%;text-align:left;padding:11px 12px;border:1px solid var(--panel-line);
    background:transparent;color:var(--ink);font-size:12px;line-height:1.5;}
  .ops button:active{border-color:var(--amber);}

  /* la vista de "cocinando" */
  .cook{margin-top:12px;}
  .cookbar{height:3px;background:var(--panel-line);overflow:hidden;margin-bottom:10px;}
  .cookbar i{display:block;height:100%;width:34%;background:var(--amber);
    animation:slide 1.15s ease-in-out infinite;}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(390%)}}
  .think{font-size:11px;line-height:1.7;color:var(--ink-dim);white-space:pre-wrap;
    max-height:34vh;overflow-y:auto;border-left:2px solid var(--amber-dim);padding-left:10px;}
  .think:empty::after{content:'arrancando…';color:var(--ink-faint);}
  .informe{font-size:12.5px;line-height:1.75;white-space:pre-wrap;word-break:break-word;}
  .accion{background:#191c1d;border:1px solid var(--blue);padding:10px;margin-top:12px;
    font-size:11.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;}
  .accion b{color:var(--blue);letter-spacing:1px;text-transform:uppercase;font-size:9px;display:block;margin-bottom:6px;}
  .warn{font-size:10.5px;line-height:1.6;color:var(--amber);border-left:2px solid var(--amber-dim);
    padding-left:9px;margin-top:12px;}
  .dim{font-size:10.5px;line-height:1.6;color:var(--ink-dim);border-left:2px solid var(--panel-line);
    padding-left:9px;margin-top:12px;}

  #toast{position:fixed;left:50%;bottom:100px;transform:translate(-50%,14px);z-index:35;
    background:var(--panel);border:1px solid var(--amber);padding:9px 14px;font-size:11px;
    opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:88vw;text-align:center;}
  #toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>
<body>

<!-- ============ ACCESO ============ -->
<div id="login">
  <div class="card">
    <h1 class="display">MI OFICINA</h1>
    <div class="sub">Mundo Montasa · acceso de empleados</div>
    <div class="roles" id="roles"></div>
    <input id="codigo" type="password" inputmode="numeric" autocomplete="off"
           placeholder="CÓDIGO" aria-label="Código de acceso">
    <button class="primary" id="entrar" disabled>Entrar</button>
    <div class="err" id="err"></div>
    <div class="nota" id="nota-auth">
      Se usa el <b>mismo código</b> de la app de Bitácora SGI. Si tu rol todavía no tiene
      código, alguien con acceso de administrador tiene que crearlo allá primero —
      desde acá no se pueden crear códigos nuevos.
    </div>
    <a class="volver" href="index.html">← Volver al mundo</a>
  </div>
</div>

<!-- ============ OFICINA ============ -->
<div id="app">
  <canvas id="sala"></canvas>

  <div id="top">
    <a class="icobtn" href="index.html" title="Volver al mundo" aria-label="Volver al mundo">&#8592;</a>
    <div class="quien"><b id="quien-rol" class="display">—</b><span id="quien-sub">—</span></div>
    <div id="motor"><b id="motor-est">—</b><span id="motor-sub">—</span></div>
    <button class="icobtn" id="pas-btn" title="Pasillo" aria-label="Pasillo">&#9723;</button>
    <button class="icobtn" id="proc-btn" title="Mi proceso" aria-label="Mi proceso">&#9776;</button>
    <button class="icobtn" id="salir" title="Cerrar sesión" aria-label="Cerrar sesión">&#9211;</button>
  </div>

  <div id="bandeja">
    <div class="bhead"><b class="display">Bandeja</b><span id="bandeja-sub">—</span></div>
    <div class="chips" id="chips"></div>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<!-- El núcleo: reglas, datos y estado. La vista de abajo solo dibuja.
     Sigue sin build: es un archivo estático más. -->
<script src="nucleo.js"></script>

<script>
"use strict";

/* =====================================================================
   LA VISTA "OFICINA" (escritorio)
   ---------------------------------------------------------------------
   Todo lo que hay acá es dibujo, DOM y eventos. Las reglas, los datos y el
   estado viven en nucleo.js: esta vista los mira y los muestra.
   La regla al revés también vale: si acá aparece una regla de negocio,
   está en el lugar equivocado.
   ===================================================================== */

let rolElegido = null;

/* Dónde se para cada agente en ESTA sala. El núcleo no sabe de salas —
   el celular no tiene una y no tendría por qué cargar con estas coordenadas. */
const POS = {
  mant:   { gx:0.5, gy:0.4 },
  caja:   { gx:4.3, gy:0.3 },
  bodega: { gx:6.2, gy:2.0 },
  flota:  { gx:0.3, gy:3.5 },
  radar:  { gx:5.7, gy:4.3 },
  mejoras:{ gx:2.8, gy:2.4 }
};
AGENTES.forEach(function(a){ const p = POS[a.id]; if(p){ a.gx = p.gx; a.gy = p.gy; } });
/* =====================================================================
   OFICINA VIRTUAL — Mundo Montasa
   ---------------------------------------------------------------------
   El empleado entra con su código, cae en su oficina isométrica, y ahí
   tiene agentes de IA en sus estaciones. Las tareas NO son inventadas:
   salen de condiciones reales de la base (equipos vencidos, gastos
   esperando decisión, existencia negativa en bodega...).

   El empleado abre una tarea, escribe qué quiere que se haga, y el agente
   se pone a COCINAR: Claude trabaja y su razonamiento se ve en vivo en la
   pantalla del agente. Claude puede devolver tres cosas:

     pregunta      -> el agente tira un pop-up de seguimiento
     confirmacion  -> el agente pide permiso ANTES de escribir en la base
     listo         -> queda el informe

   NINGUNA escritura ocurre sin que el empleado la confirme en el pop-up.
   Ese candado es a la vez la mecánica del juego y la regla de seguridad.
   ===================================================================== */


/* =====================================================================
   3. ACCESO
   ---------------------------------------------------------------------
   Mismo mecanismo que la app de Bitácora SGI: el código se convierte en
   SHA-256 y se compara contra /bitacora/auth-config. La diferencia: acá
   NO se pueden crear códigos nuevos. Bitácora, si falta el código de un
   rol, lo crea con lo que escribas; eso está bien en una app interna de
   configuración, pero una puerta que se abre sola no es una puerta.
   ===================================================================== */
function pintarRoles(){
  document.getElementById("roles").innerHTML = ROLES.map(function(r){
    return '<button class="role" data-rol="'+r.id+'"><span class="d" style="background:'+r.dot+'"></span>'+r.label+'</button>';
  }).join("");
  [...document.querySelectorAll(".role")].forEach(function(b){
    b.onclick = function(){
      rolElegido = b.dataset.rol;
      [...document.querySelectorAll(".role")].forEach(x=>x.classList.remove("on"));
      b.classList.add("on");
      document.getElementById("entrar").disabled = false;
      document.getElementById("err").textContent = "";
    };
  });
}
async function intentarEntrar(){
  const err = document.getElementById("err");
  const btn = document.getElementById("entrar");
  const code = document.getElementById("codigo").value.trim();
  if(!rolElegido){ err.textContent = "Elegí tu rol."; return; }
  if(!code){ err.textContent = "Escribí tu código."; return; }
  btn.disabled = true; err.textContent = "Verificando…";

  /* CAMINO BUENO: el servidor compara el código contra la base y devuelve
     un token firmado. El navegador nunca ve el hash guardado, y el proxy
     tiene con qué saber quién llama. */
  if(motorListo()){
    try{
      const r = await fetch(urlSesion(), {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ rol: rolElegido, codigo: code })
      });
      const j = await r.json().catch(()=>({}));
      if(!r.ok){ err.textContent = j.error || ("No se pudo entrar (HTTP " + r.status + ")");
                 btn.disabled = false; return; }
      sesion = { rolId: j.rol, label: j.label, empresa: empresaDeRol(j.rol), token: j.token };
      try{ sessionStorage.setItem("mundo_sesion", JSON.stringify(sesion)); }catch(e){}
      await abrirOficina();
      return;
    }catch(e){
      console.error("[Oficina] sesión:", e);
      err.textContent = "No se pudo hablar con el servidor: " + e.message;
      btn.disabled = false; return;
    }
  }

  /* MODO LOCAL (sin servidor): se verifica en el navegador. Alcanza para
     elegir qué pantalla mostrar; no alcanza para que nadie confíe en el
     resultado — y como no hay motor, tampoco hay nada que proteger. */
  try{
    const cfg = await getBit("auth-config");
    if(!cfg || !cfg.roles){
      err.textContent = "La base no tiene códigos configurados todavía. Configuralos en la app de Bitácora SGI.";
      btn.disabled = false; return;
    }
    const entry = cfg.roles[rolElegido];
    if(!entry || !entry.code){
      err.textContent = "Ese rol todavía no tiene código. Pedile a SGI que lo cree en la app de Bitácora — desde acá no se pueden crear.";
      btn.disabled = false; return;
    }
    if(entry.code !== await hashCode(code)){
      err.textContent = "Código incorrecto.";
      btn.disabled = false; return;
    }
    const rol = ROLES.find(r=>r.id === rolElegido);
    sesion = { rolId: rol.id, label: rol.label, empresa: empresaDeRol(rol.id) };
    try{ sessionStorage.setItem("mundo_sesion", JSON.stringify(sesion)); }catch(e){}
    await abrirOficina();
  }catch(e){
    console.error("[Oficina] login:", e);
    err.textContent = "No se pudo leer la base: " + e.message;
    btn.disabled = false;
  }
}
/* La sede del rol decide qué empresa mira su oficina (SPS = Montasa,
   Choloma = Monhaco). Los roles sin sede arrancan en Montasa. */

/* =====================================================================
   4. LA SALA (canvas isométrico, cámara fija)
   ---------------------------------------------------------------------
   A diferencia del mundo grande, acá NO hay que navegar: es un solo
   cuarto y entra completo en la pantalla. La cámara se calcula para que
   la sala quepa, y listo. Un tile mide 32 x 16 a escala 1x, igual que en
   index.html, y el escalado es por enteros con el suavizado apagado.
   ===================================================================== */
/* Tile de 48 x 24 (no 32 x 16 como el mundo grande): la sala es un solo
   cuarto y en un celular de 380 px entra completa recién a este tamaño.
   Con tiles chicos la escala entera caía a 1x y no se veía nada. */
const TW = 48, TH = 24, HW = TW/2, HH = TH/2;
function w2s(gx, gy){ return { x:(gx-gy)*HW, y:(gx+gy)*HH }; }

const SALA = { w:8, h:6 };
/* El pasillo: las puertas de todas las oficinas. No se ve adentro de ninguna
   —son cerradas— pero sí la puerta y su aviso. */
/* El pasillo corre EN DIAGONAL en coordenadas de tile, que es lo mismo que
   decir que baja RECTO en pantalla. Es la única forma de que once puertas
   entren una debajo de otra en un celular: un corredor "recto" en tiles se
   iría en diagonal y se saldría por los costados. */
const PASILLO = { n:11, paso:6, ancho:2 };
function posPuerta(k){
  const sPos = 4 + k * PASILLO.paso;      // avance por el corredor
  return { gx:(sPos - 2)/2, gy:(sPos + 2)/2 };
}
function bandaPasillo(){
  const largo = 4 + (PASILLO.n - 1) * PASILLO.paso + PASILLO.paso;
  return { largo:largo, alto:(largo) * HH + 70 };
}
let vista = "oficina";                 // "oficina" | "pasillo"
const camP = { y:0, min:0, max:0 };    // desplazamiento vertical del pasillo

/* Dónde está parado el empleado, y hacia dónde camina. Abrir una tarea lo
   manda a la estación de ese agente: el trabajo se hace yendo hasta ahí. */
const yo = { gx:4.2, gy:5.4, tx:4.2, ty:5.4 };
function irAEstacion(agenteId){
  const a = AG[agenteId];
  if(!a) return;
  yo.tx = a.gx + 1.2; yo.ty = a.gy + 1.5;
}
const cv  = document.getElementById("sala");
const ctx = cv.getContext("2d");
let CW=0, CH=0, DPR=1, ESC=2, OX=0, OY=0;

function medir(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  CW = window.innerWidth; CH = window.innerHeight;
  cv.width = Math.round(CW*DPR); cv.height = Math.round(CH*DPR);
  cv.style.width = CW+"px"; cv.style.height = CH+"px";
  /* la sala vive entre la barra de arriba (~78 px) y la bandeja (~104 px) */
  const TOPE = 82, PISO = 108;
  const dispW = CW - 12, dispH = CH - TOPE - PISO;
  /* Alto real de lo dibujado, en unidades de mundo: desde el borde de arriba
     de las paredes (-62) hasta el pie del piso. Centrar con eso —y no con el
     centro de la huella— es lo que deja la sala parada en medio del hueco. */
  const ALTO_PARED = 62;
  if(vista === "pasillo"){
    const B = bandaPasillo();
    /* Escala chica a propósito: entran más puertas de una sola mirada, y el
       aviso de cada una se lee igual porque los rótulos no se escalan. */
    ESC = CW < 700 ? 1 : 2;
    OX = CW/2;                                   // el corredor baja por el centro
    const alto = B.alto * ESC;
    camP.min = Math.min(0, dispH - alto - 30);
    camP.max = 0;
    camP.y = Math.max(camP.min, Math.min(camP.max, camP.y));
    OY = TOPE + 70 + camP.y;
  }else{
    const R = SALA;
    const yTop = -ALTO_PARED, yBot = (R.w + R.h) * HH + TH;
    const salaW = (R.w + R.h) * HW, salaH = yBot - yTop;
    ESC = Math.max(1, Math.min(4, Math.floor(Math.min(dispW/salaW, dispH/salaH))));
    const c = w2s(R.w/2, R.h/2);
    OX = CW/2 - c.x*ESC;
    OY = TOPE + dispH/2 - ((yTop + yBot)/2) * ESC;
  }
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", function(){ medir(); pintar(); });

function aplicar(){
  const s = ESC*DPR;
  ctx.setTransform(s,0,0,s, Math.round(OX*DPR), Math.round(OY*DPR));
  ctx.imageSmoothingEnabled = false;
}
function pantallaDe(wx, wy){ return { x: wx*ESC + OX, y: wy*ESC + OY }; }

function shade(hex, f){
  const n = parseInt(hex.slice(1),16);
  const r = Math.max(0,Math.min(255,Math.round(((n>>16)&255)*f)));
  const g = Math.max(0,Math.min(255,Math.round(((n>>8)&255)*f)));
  const b = Math.max(0,Math.min(255,Math.round((n&255)*f)));
  return "#" + ((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}
function tile(gx, gy, col, line){
  const p = w2s(gx, gy);
  ctx.beginPath();
  ctx.moveTo(p.x, p.y); ctx.lineTo(p.x+HW, p.y+HH);
  ctx.lineTo(p.x, p.y+TH); ctx.lineTo(p.x-HW, p.y+HH);
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  if(line){ ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.stroke(); }
}
function isoBox(gx, gy, w, d, h, col, opt){
  opt = opt || {};
  const z0 = opt.z || 0, z1 = z0 + h;
  const A=w2s(gx,gy), B=w2s(gx+w,gy), C=w2s(gx+w,gy+d), D=w2s(gx,gy+d);
  const top = opt.topCol || shade(col, opt.topF || 1.0);
  ctx.beginPath(); ctx.moveTo(B.x,B.y-z1); ctx.lineTo(C.x,C.y-z1); ctx.lineTo(C.x,C.y-z0); ctx.lineTo(B.x,B.y-z0);
  ctx.closePath(); ctx.fillStyle = shade(col, .74); ctx.fill();
  ctx.beginPath(); ctx.moveTo(D.x,D.y-z1); ctx.lineTo(C.x,C.y-z1); ctx.lineTo(C.x,C.y-z0); ctx.lineTo(D.x,D.y-z0);
  ctx.closePath(); ctx.fillStyle = shade(col, .55); ctx.fill();
  ctx.beginPath(); ctx.moveTo(A.x,A.y-z1); ctx.lineTo(B.x,B.y-z1); ctx.lineTo(C.x,C.y-z1); ctx.lineTo(D.x,D.y-z1);
  ctx.closePath(); ctx.fillStyle = top; ctx.fill();
  if(opt.line){ ctx.strokeStyle = opt.line; ctx.lineWidth = 1; ctx.stroke(); }
}


let t0 = Date.now();
function pintar(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle = "#17191a"; ctx.fillRect(0,0,CW,CH);
  aplicar();
  if(vista === "pasillo") return pintarPasillo();

  /* el empleado camina hacia donde lo mandaron */
  yo.gx += (yo.tx - yo.gx) * 0.12;
  yo.gy += (yo.ty - yo.gy) * 0.12;

  /* piso a cuadros */
  for(let j=0;j<SALA.h;j++) for(let i=0;i<SALA.w;i++)
    tile(i, j, ((i+j)%2 ? "#2d3032" : "#292c2e"), "#33373a");
  /* paredes del fondo */
  isoBox(0, -0.35, SALA.w, 0.35, 62, "#383c40", { line:"#454a4e" });
  isoBox(-0.35, 0, 0.35, SALA.h, 62, "#31363a", { line:"#454a4e" });
  /* el centro de la sala lo ocupa la estación de Mejoras (FORJA-1) */

  const visibles = agentesVisibles();
  /* orden de pintado por profundidad, para que no se tapen mal */
  visibles.slice().sort((a,b)=> (a.gx+a.gy) - (b.gx+b.gy)).forEach(dibujarAgente);

  /* el empleado, parado en la puerta */
  dibujarEmpleado(yo.gx, yo.gy);

  etiquetas(visibles);
}

function dibujarAgente(a){
  const est = estadoAgente[a.id];
  const apagado = (est === "apagado");
  const cocina  = (est === "cocinando");
  const col = apagado ? "#3a3e41" : a.col;

  /* subestación: escritorio + terminal */
  isoBox(a.gx, a.gy, 1.6, 1.1, 18, "#3a3f43", { line:"#4a5054" });
  /* pantalla del terminal: es lo que se enciende cuando está cocinando */
  const brillo = cocina ? (0.75 + 0.25*Math.sin((Date.now()-t0)/140)) : (apagado ? 0 : 0.34);
  isoBox(a.gx+0.25, a.gy+0.12, 0.85, 0.14, 16, "#22282c", { z:18, line:"#4a5054" });
  isoBox(a.gx+0.25, a.gy+0.12, 0.85, 0.14, 13,
         apagado ? "#26292b" : shade(col, 0.25 + brillo*0.9), { z:19 });

  /* el robot */
  const p = w2s(a.gx+1.25, a.gy+0.7);
  const bx = Math.round(p.x-10), by = Math.round(p.y+HH-42);
  ctx.save();
  if(apagado) ctx.globalAlpha = 0.38;
  ctx.fillStyle = "#000"; ctx.globalAlpha *= 1;
  ctx.save(); ctx.globalAlpha = apagado?0.15:0.3;
  ctx.beginPath(); ctx.ellipse(p.x, p.y+HH, 11, 5, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  ctx.fillStyle = "#101213"; ctx.fillRect(bx, by, 20, 30);                        // silueta
  ctx.fillStyle = shade(col, apagado?1:0.7); ctx.fillRect(bx+1, by+11, 18, 17);   // cuerpo
  ctx.fillStyle = shade(col, apagado?1:1.08); ctx.fillRect(bx+1, by+11, 18, 4);
  ctx.fillStyle = shade(col, apagado?1:0.5);  ctx.fillRect(bx+1, by+24, 18, 4);
  ctx.fillStyle = "#22282c"; ctx.fillRect(bx+3, by+2, 14, 9);                     // cabeza
  ctx.fillStyle = "#101213"; ctx.fillRect(bx+8, by-3, 4, 3);                      // antena
  ctx.fillStyle = apagado ? "#2f3336" : shade(col, 1.2); ctx.fillRect(bx+8, by-5, 4, 2);
  /* los ojos: apagados si no hay motor, parpadean si cocina */
  const ojo = apagado ? "#2f3336" : (cocina ? shade(col, 1.4) : shade(col, 0.95));
  const guino = (!apagado && !cocina && ((Date.now()-t0) % 4200) < 130);
  ctx.fillStyle = guino ? "#22282c" : ojo;
  ctx.fillRect(bx+5, by+5, 4, 3); ctx.fillRect(bx+11, by+5, 4, 3);
  ctx.fillStyle = "#101213"; ctx.fillRect(bx+5, by+28, 4, 3); ctx.fillRect(bx+11, by+28, 4, 3);
  ctx.restore();

  /* partículas mientras cocina: se ve que está trabajando */
  if(cocina){
    const t = (Date.now()-t0)/260;
    for(let k=0;k<3;k++){
      const f = ((t + k*0.33) % 1);
      ctx.save(); ctx.globalAlpha = 0.85*(1-f);
      ctx.fillStyle = a.col;
      ctx.fillRect(Math.round(p.x - 8 + k*7), Math.round(by - 10 - f*22), 3, 3);
      ctx.restore();
    }
  }
  /* globo de aviso */
  const globo = { espera:"?", listo:"✓" }[est];
  if(globo){
    const gc = est==="espera" ? "#4f8fe0" : "#3ecf7e";
    const gx = Math.round(p.x + 14), gy = Math.round(by - 4);
    ctx.fillStyle = "#101213"; ctx.fillRect(gx-9, gy-10, 18, 17);
    ctx.fillStyle = gc;        ctx.fillRect(gx-8, gy-9, 16, 15);
    ctx.fillStyle = "#101213"; ctx.font = "bold 11px 'IBM Plex Mono',monospace";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(globo, gx, gy-1);
  }
}

/* El empleado: sos vos, parado en tu oficina. */
function dibujarEmpleado(gx, gy){
  const p = w2s(gx, gy);
  const bx = Math.round(p.x-9), by = Math.round(p.y+HH-34);
  ctx.save(); ctx.globalAlpha = .3; ctx.fillStyle = "#000";
  ctx.beginPath(); ctx.ellipse(p.x, p.y+HH, 11, 5, 0, 0, Math.PI*2); ctx.fill(); ctx.restore();
  ctx.fillStyle = "#101213"; ctx.fillRect(bx, by, 18, 34);
  ctx.fillStyle = "#57606a"; ctx.fillRect(bx+1, by+12, 16, 15);
  ctx.fillStyle = "#eae7e0"; ctx.fillRect(bx+1, by+12, 16, 3);
  ctx.fillStyle = "#3a3f43"; ctx.fillRect(bx+1, by+27, 16, 6);
  ctx.fillStyle = "#8b7355"; ctx.fillRect(bx+4, by+2, 10, 9);
  ctx.fillStyle = "#5a4a38"; ctx.fillRect(bx+4, by+2, 10, 3);
  /* el rótulo va a los PIES, no arriba: arriba choca con los escritorios */
  empleadoAnclaje = { x: p.x, y: p.y + HH + 10 };
}
let empleadoAnclaje = { x:0, y:0 };

/* ---------- EL PASILLO: las puertas de todas las oficinas ----------
   Se ve la puerta, no lo de adentro. El aviso dice si la persona está y
   cuánto tiene entre manos — dos cosas que salen del latido real, no de
   una animación. */
function puertasDelPasillo(){
  return ROLES.slice(0, PASILLO.n).map(function(r, i){
    const p = posPuerta(i);
    return { rol:r, gx:p.gx, gy:p.gy };
  });
}
function pintarPasillo(){
  const B = bandaPasillo();
  /* el piso: una banda diagonal en tiles = un corredor recto en pantalla */
  for(let sPos=0; sPos<=B.largo; sPos++){
    for(let d=-PASILLO.ancho; d<=PASILLO.ancho; d++){
      if(((sPos + d) % 2) !== 0) continue;         // gx debe ser entero
      const gx = (sPos + d)/2, gy = (sPos - d)/2;
      tile(gx, gy, (d === 0) ? "#2b2422" : ((sPos % 4 < 2) ? "#26292b" : "#232628"),
           (d === 0) ? "#332a27" : "#2e3234");
    }
  }

  /* Centro de Distribución, al fondo (arriba del todo) */
  const cd = posPuerta(-0.6);
  isoBox(cd.gx - 0.8, cd.gy - 0.8, 2.0, 2.0, 24, "#3a3f43", { line:"#4a5054", topCol:"#4a4038" });
  isoBox(cd.gx - 0.4, cd.gy - 0.4, 1.2, 1.2, 15, "#22282c", { z:24, line:"#4a5054" });
  isoBox(cd.gx - 0.4, cd.gy - 0.4, 1.2, 1.2, 12, shade("#c9c6bd", 0.55), { z:25 });

  puertasDelPasillo().forEach(function(p){
    const dentro  = estaEn(p.rol.id);
    const yoMismo = (p.rol.id === sesion.rolId);
    const pr = presencia[p.rol.id] || {};
    /* la pared con la puerta, mirando al corredor */
    isoBox(p.gx - 1.1, p.gy + 0.1, 1.1, 0.3, 50, "#33373a", { line:"#414649" });
    isoBox(p.gx - 0.05, p.gy + 0.05, 1.15, 0.35, 52, "#3a3f43",
           { line: dentro ? "#f5a524" : "#4a5054" });
    /* el vano: si está, se ve luz adentro; si no, negro */
    isoBox(p.gx + 0.06, p.gy + 0.09, 0.95, 0.28, 44,
           yoMismo ? "#2a2f33" : "#1b1e20", { line: dentro ? "#a9741f" : "#3a4044" });
    /* la placa con el color del rol */
    isoBox(p.gx + 0.1, p.gy + 0.06, 0.88, 0.08, 6, p.rol.dot, { z:45 });

    const w0 = w2s(p.gx + 0.55, p.gy + 0.2);
    /* la luz de presencia, sobre el marco */
    ctx.fillStyle = "#101213"; ctx.fillRect(Math.round(w0.x-4), Math.round(w0.y-58), 8, 8);
    ctx.fillStyle = dentro ? "#3ecf7e" : "#3a3e41";
    ctx.fillRect(Math.round(w0.x-3), Math.round(w0.y-57), 6, 6);
    /* trabajando: la luz late por debajo de la puerta */
    if(dentro && (pr.cocinando > 0 || pr.trabajando > 0)){
      const f = 0.5 + 0.5*Math.sin((Date.now()-t0)/300);
      ctx.save(); ctx.globalAlpha = 0.3 + 0.4*f; ctx.fillStyle = "#f5a524";
      ctx.fillRect(Math.round(w0.x-11), Math.round(w0.y-4), 22, 3); ctx.restore();
    }
  });
}
function etiquetasPasillo(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.textBaseline = "middle"; ctx.textAlign = "center";
  const cdp = posPuerta(-0.6);
  const cd = w2s(cdp.gx, cdp.gy);
  const sc = pantallaDe(cd.x, cd.y - 44);
  if(sc.y > 74 && sc.y < CH-110){
    ctx.font = "800 12px 'Barlow Condensed',sans-serif";
    const w1 = ctx.measureText("CENTRO DE DISTRIBUCIÓN").width + 12;
    ctx.fillStyle = "rgba(23,25,26,.88)";
    ctx.fillRect(Math.round(sc.x-w1/2), Math.round(sc.y-9), Math.round(w1), 17);
    ctx.fillStyle = "#c9c6bd"; ctx.fillText("CENTRO DE DISTRIBUCIÓN", Math.round(sc.x), Math.round(sc.y));
    ctx.font = "400 8.5px 'IBM Plex Mono',monospace"; ctx.fillStyle = "#8b9096";
    ctx.fillText("traduce lo que una oficina le pide a otra", Math.round(sc.x), Math.round(sc.y+13));
  }
  puertasDelPasillo().forEach(function(p){
    const w0 = w2s(p.gx + 0.55, p.gy + 0.2);
    const s0 = pantallaDe(w0.x, w0.y - 72);
    if(s0.y < 74 || s0.y > CH-110) return;
    const dentro = estaEn(p.rol.id), pr = presencia[p.rol.id] || {};
    const mio = (p.rol.id === sesion.rolId);
    ctx.font = "700 10.5px 'Barlow Condensed',sans-serif";
    const nom = p.rol.label.toUpperCase() + (mio ? " (VOS)" : "");
    const w1 = ctx.measureText(nom).width + 10;
    ctx.fillStyle = "rgba(23,25,26,.88)";
    ctx.fillRect(Math.round(s0.x-w1/2), Math.round(s0.y-8), Math.round(w1), 15);
    ctx.fillStyle = dentro ? p.rol.dot : "#565b5f";
    ctx.fillText(nom, Math.round(s0.x), Math.round(s0.y));
    ctx.font = "400 8.5px 'IBM Plex Mono',monospace";
    /* "cc" lo escribe el Claude Code de esa persona (ver claude-code/PUENTE.md) */
    const ccVivo = !!(pr.cc && pr.ccVisto && (Date.now() - pr.ccVisto) < VIVO_MS * 4);
    const aviso = dentro
      ? ("está · " + (pr.trabajando || 0) + (pr.trabajando === 1 ? " tarea" : " tareas") +
         (ccVivo ? " · + Claude Code" : ""))
      : (ccVivo ? ("no está · su Claude Code sí") : ("no está · " + haceCuanto(p.rol.id)));
    const w2c = ctx.measureText(aviso).width + 10;
    ctx.fillStyle = "rgba(23,25,26,.88)";
    ctx.fillRect(Math.round(s0.x-w2c/2), Math.round(s0.y+4), Math.round(w2c), 14);
    ctx.fillStyle = dentro ? (pr.cocinando ? "#f5a524" : "#3ecf7e") : "#565b5f";
    ctx.fillText(aviso, Math.round(s0.x), Math.round(s0.y+11));
  });
}

/* Los rótulos van en espacio de pantalla, sin escalar: así se leen sin
   zoom en un celular chico. */
function etiquetas(visibles){
  if(vista === "pasillo") return etiquetasPasillo();
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.textBaseline = "middle"; ctx.textAlign = "center";
  /* el rótulo del empleado */
  if(sesion){
    const se = pantallaDe(empleadoAnclaje.x, empleadoAnclaje.y);
    if(se.y > 62 && se.y < CH-110){
      ctx.font = "700 10px 'Barlow Condensed',sans-serif";
      const w0 = ctx.measureText(sesion.label.toUpperCase()).width + 10;
      ctx.fillStyle = "rgba(23,25,26,.85)";
      ctx.fillRect(Math.round(se.x-w0/2), Math.round(se.y-7), Math.round(w0), 14);
      ctx.fillStyle = "#8b9096";
      ctx.fillText(sesion.label.toUpperCase(), Math.round(se.x), Math.round(se.y));
    }
  }
  const ETQ = { apagado:["SIN ENERGÍA","#565b5f"], libre:["libre","#8b9096"],
                cocinando:["cocinando…","#f5a524"], espera:["te pregunta","#4f8fe0"],
                listo:["listo","#3ecf7e"] };
  visibles.forEach(function(a){
    const w = w2s(a.gx+0.9, a.gy+0.6);
    const s = pantallaDe(w.x, w.y - 62);
    if(s.y < 62 || s.y > CH-116) return;
    const est = ETQ[estadoAgente[a.id]] || ETQ.libre;
    ctx.font = "700 11px 'Barlow Condensed',sans-serif";
    const tw = ctx.measureText(a.nombre).width + 10;
    ctx.fillStyle = "rgba(23,25,26,.85)";
    ctx.fillRect(Math.round(s.x-tw/2), Math.round(s.y-8), Math.round(tw), 15);
    ctx.fillStyle = estadoAgente[a.id]==="apagado" ? "#565b5f" : a.col;
    ctx.fillText(a.nombre, Math.round(s.x), Math.round(s.y));
    ctx.font = "400 8.5px 'IBM Plex Mono',monospace";
    ctx.fillStyle = est[1];
    ctx.fillText(est[0], Math.round(s.x), Math.round(s.y+12));
  });
}

let raf = null;
function bucle(){
  pintar();
  if(vista === "pasillo") etiquetasPasillo();
  raf = requestAnimationFrame(bucle);
}

/* tocar un agente abre su tarea pendiente (o dice que no tiene) */
/* arrastre vertical, solo en el pasillo */
let arr = { on:false, y:0, mov:0 };
cv.addEventListener("pointerdown", function(e){
  if(vista !== "pasillo") return;
  arr.on = true; arr.y = e.clientY; arr.mov = 0;
});
cv.addEventListener("pointermove", function(e){
  if(!arr.on) return;
  const d = e.clientY - arr.y;
  arr.mov += Math.abs(d); arr.y = e.clientY;
  camP.y = Math.max(camP.min, Math.min(camP.max, camP.y + d));
  medir();
});
cv.addEventListener("pointerup", function(){ arr.on = false; });
cv.addEventListener("pointercancel", function(){ arr.on = false; });

cv.addEventListener("click", function(e){
  if(vista === "pasillo"){
    if(arr.mov > 8) return;
    let mej = null, md = 1e9;
    puertasDelPasillo().forEach(function(p){
      const w0 = w2s(p.gx + 0.55, p.gy + 0.2);
      const s0 = pantallaDe(w0.x, w0.y - 30);
      const d = Math.hypot(s0.x - e.clientX, s0.y - e.clientY);
      if(d < md){ md = d; mej = p; }
    });
    if(mej && md < 70) verPuerta(mej.rol.id);
    return;
  }
  const visibles = agentesVisibles();
  let mejor = null, mejorD = 1e9;
  visibles.forEach(function(a){
    const w = w2s(a.gx+1.0, a.gy+0.7);
    const s = pantallaDe(w.x, w.y - 20);
    const d = Math.hypot(s.x - e.clientX, s.y - e.clientY);
    if(d < mejorD){ mejorD = d; mejor = a; }
  });
  if(mejor && mejorD < 60) tocarAgente(mejor.id);
});

const modal = document.getElementById("modal");
const sheet = document.getElementById("sheet");
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" })[c]); }
function cerrar(){ modal.classList.remove("on"); sheet.className = "sheet"; tareaEnPantalla = null; }
function abrir(clase, kicker, titulo, cuerpo, cerrable){
  sheet.className = "sheet" + (clase ? " " + clase : "");
  sheet.innerHTML =
    '<div class="shead"><div><div class="k">' + esc(kicker) + '</div>' +
    '<h2 class="display">' + esc(titulo) + '</h2></div>' +
    (cerrable === false ? '' : '<button class="x" id="mx" aria-label="Cerrar">&#10005;</button>') +
    '</div><div class="sbody">' + cuerpo + '</div>';
  modal.classList.add("on");
  const x = document.getElementById("mx");
  if(x) x.onclick = cerrar;
}
modal.addEventListener("click", e => { if(e.target === modal) cerrar(); });
function toast(m){
  const t = document.getElementById("toast");
  t.textContent = m; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2400);
}

const NIVEL_CLASE = { crit:"crit", warn:"", info:"" };
function tareaDe(id){ return tareas.find(t => t.id === id); }

/* --- 1. la tarea: contexto + el "entry" para Claude --- */
function abrirTarea(t){
  const a = AG[t.agente];
  tareaEnPantalla = t.id;
  /* Overcooked: el trabajo se hace yendo hasta la estación. */
  if(vista === "oficina" && a) irAEstacion(t.agente);
  if(t.especial === "encargo"){ verEncargo(t); return; }
  if(t.especial === "form-mejora"){ verFormMejora(); return; }
  if(t.id === "sin-proceso"){ verProceso(); return; }
  if(t.estado === "cocinando"){ verCocina(t); return; }
  if(t.estado === "espera"){ verPendiente(t); return; }
  if(t.estado === "listo"){ verInforme(t); return; }

  const sinMotor = !motorListo();
  const cuerpo =
    '<div class="ctx"><b>' + esc(a.nombre) + '</b> · ' + esc(a.oficio) + '\n' +
    esc(t.detalle) + '\n\n' + esc(t.contexto) + '</div>' +
    (sinMotor
      ? '<div class="warn"><b>Agente sin energía.</b> Falta conectar el motor de Claude: ' +
        'no hay <code>apiBase</code> configurada en <code>mundo/oficina.html</code>. ' +
        'El contexto de arriba es real y está completo — lo único que falta es quién lo procese. ' +
        'Ver <code>mundo/servidor/README.md</code>.</div>'
      : '<label class="lab" for="entry">¿Qué querés que haga ' + esc(a.nombre) + '?</label>' +
        '<textarea id="entry" placeholder="Escribí acá…">' + esc(t.sugerencia || "") + '</textarea>' +
        '<div class="acts"><button class="go" id="go">Mandar al agente</button></div>' +
        (herramientasDe(t.agente).length
          ? '<div class="dim">Este agente puede pedir permiso para escribir en la base. ' +
            'Nunca escribe sin que vos confirmes en pantalla.</div>'
          : '<div class="dim">Tu rol es de solo lectura para este módulo: el agente analiza y ' +
            'recomienda, pero no puede proponer escrituras.</div>'));

  abrir("", a.nombre + " · " + a.oficio, t.titulo, cuerpo);
  const go = document.getElementById("go");
  if(go) go.onclick = function(){
    const txt = document.getElementById("entry").value.trim();

/* --- 2. cocinando: se ve el razonamiento en vivo --- */
function verCocina(t){
  const a = AG[t.agente];
  abrir("", a.nombre + " · cocinando", t.titulo,
    '<div class="cook"><div class="cookbar"><i></i></div>' +

    '<div class="dim">Podés cerrar esto: el agente sigue trabajando y te avisa en su estación.</div>');
}
function pintarPensado(t){
  const el = document.getElementById("think");

    el.textContent = t._pensado || "";
    el.scrollTop = el.scrollHeight;

/* --- 3. lo que el agente pregunta o quiere confirmar --- */
function verPendiente(t){
  const a = AG[t.agente], p = t.pendiente;
  if(!p) return abrirTarea(t);

  if(p.tipo === "pregunta"){
    const ops = Array.isArray(p.sobre.opciones) ? p.sobre.opciones : [];
    abrir("q", a.nombre + " · te pregunta", t.titulo,
      '<div class="informe">' + esc(p.sobre.mensaje || "") + '</div>' +
      (ops.length
        ? '<div class="ops">' + ops.map((o,i) =>
            '<button data-op="' + i + '">' + esc(o) + '</button>').join("") + '</div>' +
          '<label class="lab" for="resp">…o contestá con tus palabras</label>'
        : '<label class="lab" for="resp">Tu respuesta</label>') +
      '<textarea id="resp" placeholder="Escribí acá…"></textarea>' +
      '<div class="acts"><button class="go" id="env">Responder</button></div>');
    [...sheet.querySelectorAll("[data-op]")].forEach(function(b){
      b.onclick = function(){ responder(t, ops[+b.dataset.op]); };
    });
    document.getElementById("env").onclick = function(){
      const v = document.getElementById("resp").value.trim();
      if(!v){ toast("Escribí una respuesta o elegí una opción."); return; }
      responder(t, v);
    };
    return;
  }

  /* confirmación: acá está el candado. Se muestra la acción EXACTA. */
  const acc  = p.sobre.accion || {};
  const her  = HERRAMIENTAS[acc.herramienta];
  const ok   = !!her && herramientasDe(t.agente).indexOf(acc.herramienta) >= 0;
  const resumen = ok ? her.resumir(acc.args || {}) : null;
  abrir("c", a.nombre + " · pide permiso", t.titulo,
    '<div class="informe">' + esc(p.sobre.mensaje || "") + '</div>' +
    (ok
      ? '<div class="accion"><b>Va a hacer esto</b>' + esc(resumen) + '</div>' +
        '<div class="acts"><button class="ok" id="si">Autorizar</button>' +
        '<button class="no" id="no">No autorizar</button></div>' +
        '<div class="dim">Se escribe en Firebase con tu nombre (' + esc(sesion.label) +
        ') y queda registrado en el historial de cambios.</div>'
      : '<div class="warn">El agente pidió una herramienta que no existe o que tu rol no ' +
        'tiene habilitada (<b>' + esc(acc.herramienta || "sin nombre") + '</b>). ' +
        'No se ejecuta nada.</div>' +
        '<div class="acts"><button class="no" id="no">Devolverle el error</button></div>'));
  const si = document.getElementById("si"), no = document.getElementById("no");
  if(si) si.onclick = function(){ confirmar(t, true); };
  if(no) no.onclick = function(){ confirmar(t, false, ok ? null :
    "La herramienta \"" + (acc.herramienta||"?") + "\" no existe o no está habilitada para este rol."); };
}

/* --- 4. el informe --- */
function verInforme(t){
  const a = AG[t.agente];
  const inf = t.informe || {};
  const crudo = inf.estado === "crudo";
  abrir(crudo ? "bad" : "ok", a.nombre + (crudo ? " · respuesta no entendida" : " · listo"), t.titulo,
    (crudo
      ? '<div class="warn">El agente no devolvió el formato esperado. Se muestra tal cual llegó, ' +
        'sin interpretar nada.</div><div class="informe">' + esc(inf.texto || "") + '</div>'
      : '<div class="informe">' + esc(inf.informe || inf.mensaje || "") + '</div>') +

/* --- MI PROCESO: ver, pegar y guardar el proceso propio --- */
function verProceso(){
  const cargado = !!proceso;
  let cuerpo = "";

  if(cargado){
    const L = [];
    L.push("<b>" + esc(proceso.persona || sesion.label) + "</b> · actualizado " +
           esc(proceso.actualizado || "sin fecha"));
    if(proceso.resumen) L.push(esc(proceso.resumen));
    proceso.procesos.forEach(function(pr){
      L.push("");
      L.push("<b>" + esc(pr.nombre) + "</b>  [" + esc(pr.frecuencia || "—") + "]");
      if(pr.disparador) L.push("  arranca: " + esc(pr.disparador));
      (pr.pasos||[]).forEach(function(ps){
        L.push("  " + (ps.n||"-") + ". " + esc(ps.hace) +
          (ps.donde ? ("  [" + esc(ps.donde) + (ps.dato ? "/" + esc(ps.dato) : "") + "]") : "") +
          (ps.duele ? ("\n       duele: " + esc(ps.duele)) : ""));
      });
    });
    cuerpo += '<div class="ctx">' + L.join("\n") + '</div>';

    if((proceso.nunca_automatizar||[]).length){
      cuerpo += '<div class="accion" style="border-color:var(--red)"><b style="color:var(--red)">' +
        'Nunca automatizar</b>' + proceso.nunca_automatizar.map(esc).join("\n· ").replace(/^/, "· ") +
        '</div>';
    }
    if((proceso.huecos||[]).length){
      cuerpo += '<div class="warn"><b>Quedó sin contestar</b>\n· ' +
        proceso.huecos.map(esc).join("\n· ") + '</div>';
    }
    cuerpo += '<div class="dim">Tus agentes trabajan con esto. Revisalo de vez en cuando: ' +
      'un proceso viejo es peor que ninguno, porque nadie lo nota.</div>';
  }else{
    cuerpo += '<div class="warn"><b>Todavía no cargaste tu proceso.</b> Tus agentes están ' +
      'usando pasos que supuso quien armó el módulo, no los tuyos.</div>' +
      '<div class="ctx">1. Pedí el archivo <b>ENTREVISTA.md</b> (mundo/procesos/)\n' +
      '2. Pegalo completo en tu propio Claude\n' +
      '3. Te entrevista 20 minutos y te devuelve un bloque\n' +
      '4. Pegá ese bloque acá abajo</div>';
  }

  cuerpo += '<label class="lab" for="pjson">' + (cargado ? "Reemplazar por un bloque nuevo" : "Pegá el bloque que te dio tu Claude") + '</label>' +
    '<textarea id="pjson" placeholder="Pegá acá, incluyendo los ```json si vinieron…"></textarea>' +
    '<div class="acts"><button class="go" id="pguardar">Guardar mi proceso</button>' +
    (cargado ? '<button class="no" id="pborrar">Borrar</button>' : '') + '</div>';

  abrir(cargado ? "ok" : "", "Mi proceso", cargado ? "Así trabajás vos" : "Tus agentes no te conocen", cuerpo);

  document.getElementById("pguardar").onclick = async function(){
    const txt = document.getElementById("pjson").value;
    if(!txt.trim()){ toast("Pegá el bloque primero."); return; }
    const r = validarProceso(txt);
    if(r.fallas){
      abrir("bad", "Mi proceso", "El bloque tiene problemas",
        '<div class="warn">No se guardó nada. Un proceso a medias es peor que ninguno: ' +
        'los agentes lo tomarían como verdad.</div><div class="ctx">· ' +
        r.fallas.map(esc).join("\n· ") + '</div>' +
        '<div class="dim">Volvé a tu Claude, mostrale estos puntos y pedile el bloque corregido.</div>' +
        '<div class="acts"><button class="go" id="pvolver">Volver a intentar</button></div>');
      document.getElementById("pvolver").onclick = verProceso;
      return;
    }
    try{
      const res = await fetch(CC_FB + "/" + NODO_PROCESOS + "/" + sesion.rolId + ".json", {
        method:"PUT", headers:{"Content-Type":"application/json"}, body: JSON.stringify(r.ok) });
      if(!res.ok) throw new Error("HTTP " + res.status);
      proceso = r.ok;
      await registrar("proceso", { procesos: r.ok.procesos.length, cargadoPor: sesion.label });
      await anotarBitacora("Mundo", "Cargó su proceso (" + r.ok.procesos.length +
        " procesos) desde la oficina virtual");
      generarTareas(); pintarProcBtn();
      toast("Guardado · tus agentes ya trabajan con tu proceso");
      if(r.avisos && r.avisos.length){
        abrir("", "Mi proceso", "Guardado, con observaciones",
          '<div class="warn">· ' + r.avisos.map(esc).join("\n· ") + '</div>' +
          '<div class="dim">Se guardó igual. Si querés, pedile a tu Claude que complete ' +
          'esos puntos y volvé a pegar el bloque.</div>');
      }else verProceso();
    }catch(e){ toast("No se pudo guardar: " + e.message); }
  };
  const pb = document.getElementById("pborrar");
  if(pb) pb.onclick = async function(){
    try{
      await fetch(CC_FB + "/" + NODO_PROCESOS + "/" + sesion.rolId + ".json", { method:"DELETE" });
      proceso = null; await registrar("proceso", { borrado:true }); generarTareas(); pintarProcBtn();
      toast("Borrado"); verProceso();
    }catch(e){ toast("No se pudo borrar: " + e.message); }
  };
}
function pintarProcBtn(){
  document.getElementById("proc-btn").classList.toggle("avisa", !proceso);
}

/* --- la puerta de otra oficina --- */
function verPuerta(rolId){
  const rol = ROLES.find(r => r.id === rolId);
  const dentro = estaEn(rolId), pr = presencia[rolId] || {};
  const mio = (rolId === sesion.rolId);
  const abiertos = encargos.filter(e => e.para_rol === rolId && e.de_rol === sesion.rolId &&
                                        ["Hecho","Rechazado"].indexOf(e.estado) < 0);

  abrir(dentro ? "ok" : "", "Puerta", rol.label + (mio ? " · tu oficina" : ""),
    '<div class="ctx">' +
      (dentro ? "<b>Está en su oficina.</b>" : "<b>No está.</b> Último ingreso: " + esc(haceCuanto(rolId))) +
      "\nTareas entre manos: <b>" + (dentro ? (pr.trabajando || 0) : 0) + "</b>" +
      (dentro && pr.cocinando ? ("\nAgentes trabajando ahora: <b>" + pr.cocinando + "</b>") : "") +
    '</div>' +
    '<div class="dim">Las oficinas son cerradas: desde acá se ve la puerta y su aviso, ' +
    'no lo que hay adentro.</div>' +
    (abiertos.length
      ? '<label class="lab">Lo que ya le mandaste</label><div class="lst">' +
        abiertos.map(e => '<div><i>' + esc(e.titulo_visible || e.texto_original) +
          '</i><b>' + esc(e.estado) + '</b></div>').join("") + '</div>'
      : '') +
    (mio ? '' :
      '<label class="lab" for="enc">Mandarle un encargo</label>' +
      '<textarea id="enc" placeholder="Escribilo en TUS palabras. El Centro de Distribución lo traduce al entorno de ' +
        esc(rol.label) + '."></textarea>' +
      '<div class="acts"><button class="go" id="encgo">Mandar por el Centro</button></div>' +
      (motorListo()
        ? '<div class="dim">Pasa por el Centro de Distribución: se traduce a los pasos y las ' +
          'palabras de ' + esc(rol.label) + ' antes de llegarle.</div>'
        : '<div class="warn">Sin motor no hay traducción: le va a llegar tu texto tal cual, ' +
          'marcado como <b>sin traducir</b>.</div>')));

  const b = document.getElementById("encgo");
  if(b) b.onclick = async function(){
    const txt = document.getElementById("enc").value.trim();
    if(!txt){ toast("Escribí qué necesitás."); return; }
    b.disabled = true;
    const reg = {
      id: "enc_" + Date.now().toString(36),
      fecha: new Date().toISOString(),
      de_rol: sesion.rolId, de_persona: sesion.label,
      para_rol: rolId,
      texto_original: txt,
      titulo_visible: txt.slice(0, 70),
      traduccion: null, estado: "Sin traducir",
      respuesta: null, cerradoEn: null
    };
    abrir("c", "Centro de Distribución", "Traduciendo el encargo",
      '<div class="cook"><div class="cookbar"><i></i></div>' +
      '<div class="think">Pasándolo al entorno de ' + esc(rol.label) + '…</div></div>', false);
    try{
      const tr = await traducirEncargo(reg);
      if(tr){ reg.traduccion = tr; reg.estado = "Entregado"; reg.titulo_visible = tr.titulo; }
      await crearEncargo(reg);
      await anotarBitacora("Mundo", "Encargo a " + rol.label + ": " + reg.titulo_visible);
      generarTareas(); pintarChips();
      abrir(tr ? "ok" : "", "Centro de Distribución", tr ? "Entregado" : "Entregado sin traducir",
        (tr
          ? '<div class="informe"><b>' + esc(tr.titulo) + '</b>\n\n' + esc(tr.que_necesita || "") + '</div>' +
            ((tr.pasos_sugeridos||[]).length ? '<div class="ctx">Pasos, en el proceso de ' +
              esc(rol.label) + ':\n· ' + tr.pasos_sugeridos.map(esc).join("\n· ") + '</div>' : '') +
            ((tr.avisos||[]).length ? '<div class="warn">· ' + tr.avisos.map(esc).join("\n· ") + '</div>' : '')
          : '<div class="warn">No se pudo traducir, así que le llega tu texto tal cual y ' +
            'marcado como <b>sin traducir</b>. Se entrega igual: retenerlo sería peor.</div>' +
            '<div class="ctx">' + esc(txt) + '</div>') +
        '<div class="dim">Vas a ver en qué va desde la puerta de ' + esc(rol.label) + '.</div>');
      toast("Entregado · " + rol.label);
    }catch(e){
      toast("No se pudo mandar: " + e.message);
      verPuerta(rolId);
    }
  };
}

/* --- un encargo que me llegó --- */
function verEncargo(t){
  const e = encargos.find(x => x.id === t.encargoId);
  if(!e) return toast("Ese encargo ya no está.");
  const tr = e.traduccion;
  const deQuien = (ROLES.find(r => r.id === e.de_rol) || {}).label || e.de_rol;

  abrir("c", "Centro de Distribución · de " + deQuien, tr ? tr.titulo : "Encargo sin traducir",
    (tr
      ? '<div class="informe">' + esc(tr.que_necesita || "") + '</div>' +
        '<div class="ctx"><b>Para qué lo necesita</b>\n' + esc(tr.por_que || "—") +
        ((tr.pasos_sugeridos||[]).length ? '\n\n<b>En tu proceso</b>\n· ' +
           tr.pasos_sugeridos.map(esc).join("\n· ") : '') +
        ((tr.datos||[]).length ? '\n\n<b>Toca</b>: ' + tr.datos.map(esc).join(", ") : '') + '</div>' +
        ((tr.avisos||[]).length ? '<div class="warn">El Centro no pudo traducir todo:\n· ' +
          tr.avisos.map(esc).join("\n· ") + '</div>' : '')
      : '<div class="warn">Llegó <b>sin traducir</b>: es el texto tal cual lo escribió ' +
        esc(deQuien) + '. Si no se entiende, rechazalo diciendo qué falta.</div>') +
    '<div class="dim">Como lo escribió ' + esc(deQuien) + ':\n«' + esc(e.texto_original) + '»</div>' +
    '<div class="acts">' +
      (e.estado === "Entregado" ? '<button class="ok" id="eacep">Lo tomo</button>' : '') +
      (e.estado === "Aceptado" ? '<button class="ok" id="ehecho">Ya está hecho</button>' : '') +
      '<button class="no" id="erech">No lo tomo</button></div>' +
    (tr ? '<div class="acts"><button class="go" id="eagente">Pasárselo a un agente</button></div>' : ''));

  async function mover(estado, pedirNota){
    let nota = null;
    if(pedirNota){
      nota = prompt("¿Por qué no lo tomás? (le llega a " + deQuien + ")", "");
      if(nota === null) return;
    }
    try{
      await moverEncargo(e.id, estado, nota);
      generarTareas(); cerrar();
      toast(estado);
    }catch(err){ toast("No se pudo: " + err.message); }
  }
  const a1 = document.getElementById("eacep"), a2 = document.getElementById("ehecho"),
        a3 = document.getElementById("erech"), a4 = document.getElementById("eagente");
  if(a1) a1.onclick = function(){ mover("Aceptado", false); };
  if(a2) a2.onclick = function(){ mover("Hecho", false); };
  if(a3) a3.onclick = function(){ mover("Rechazado", true); };
  if(a4) a4.onclick = function(){
    const dest = tareas.find(x => x.id === "libre") || tareas[0];
    if(!dest) return;
    dest.estado = "abierta"; dest.conv = null; dest.informe = null;
    dest.sugerencia = (tr.que_necesita || tr.titulo) + "\n\n(Encargo de " + deQuien +
      ". Para qué: " + (tr.por_que || "—") + ")";
    abrirTarea(dest);
  };
}

/* --- Departamento de Mejoras: pedir y ver lo pedido --- */

    '<label class="lab" for="mtit">En una línea</label>' +
    '<textarea id="mtit" style="min-height:44px" placeholder="Ej: el agente de caja debería ver también los viáticos"></textarea>' +
    '<label class="lab" for="mdet">Contalo con detalle (opcional pero ayuda)</label>' +
    '<textarea id="mdet" placeholder="Cuándo te pasa, qué esperabas que hiciera, qué hizo…"></textarea>' +
    '<div class="acts"><button class="go" id="menviar">Mandar el pedido</button></div>' +
    (puedeTriar()
      ? '<div class="dim">Como administrador del SGI, además podés pedirle a FORJA-1 que ' +
        'tría los pedidos de todos: está en la bandeja.</div>'
      : '<div class="dim">Lo van a ver el administrador del SGI y FORJA-1. Vas a poder seguir ' +

  [...sheet.querySelectorAll("[data-tipo]")].forEach(function(b){

  });
  document.getElementById("menviar").onclick = async function(){
    const tit = document.getElementById("mtit").value.trim();
    if(!tit){ toast("Escribí al menos una línea."); return; }
    const reg = {
      id: "mej_" + Date.now().toString(36),
      fecha: new Date().toISOString(),
      rol: sesion.rolId, persona: sesion.label,
      tipo: tipoElegido, titulo: tit,
      detalle: document.getElementById("mdet").value.trim(),
      estado: "Nueva", nota: "", decididoPor: null, decididoEn: null
    };
    try{
      reg._k = await anexar(NODO_MEJORAS, reg);   // anexa, no reescribe la lista
      mejoras.push(reg);

      await anotarBitacora("Mundo", "Pedido de mejora: " + tit);
      generarTareas();
      toast("Mandado · " + reg.id);
      verFormMejora();
    }catch(e){ toast("No se pudo mandar: " + e.message); }
  };
}

/* ---------- lo que el núcleo avisa y esta vista dibuja ---------- */
Mundo.on("aviso", function(txt){ toast(txt); });
Mundo.on("tareas", function(){ pintarChips(); });
Mundo.on("tarea:pensando", function(t){ pintarPensado(t); });
Mundo.on("herramienta:corriendo", function(d){
  abrir("c", AG[d.tarea.agente].nombre, d.tarea.titulo,
    '<div class="cook"><div class="cookbar"><i></i></div>' +
    '<div class="think">ejecutando ' + esc(d.herramienta) + '…</div></div>', false);
});
/* Las tres transiciones de una tarea. Si la ficha de ESA tarea está abierta se
   actualiza; si no, se avisa y el agente lo muestra en su estación. */
function siEstaAbierta(t, dibujar, avisoTxt){
  if(modal.classList.contains("on") && tareaEnPantalla === t.id) dibujar(t);
  else if(avisoTxt) toast(avisoTxt);
}
let tareaEnPantalla = null;
Mundo.on("tarea:cocina",    function(t){ siEstaAbierta(t, verCocina, null); });
Mundo.on("tarea:pendiente", function(t){
  siEstaAbierta(t, verPendiente, AG[t.agente].nombre + " te " +
    (t.pendiente && t.pendiente.tipo === "pregunta" ? "pregunta algo" : "pide permiso"));
});
Mundo.on("tarea:listo", function(t){
  siEstaAbierta(t, verInforme, AG[t.agente].nombre + " terminó · " + t.titulo);
});

function pintarChips(){
  const cont = document.getElementById("chips");
  const vis  = agentesVisibles().map(a => a.id);
  const lista = tareas.filter(t => vis.indexOf(t.agente) >= 0);
  const orden = { espera:0, cocinando:1, listo:2, abierta:3 };
  lista.sort((a,b)=> (orden[a.estado]-orden[b.estado]) ||
                     ({crit:0,warn:1,info:2}[a.nivel] - {crit:0,warn:1,info:2}[b.nivel]));

  const abiertas = lista.filter(t => t.estado === "abierta" && t.id !== "libre").length;
  document.getElementById("bandeja-sub").textContent =
    abiertas + (abiertas === 1 ? " tarea abierta" : " tareas abiertas") +
    (resueltas ? (" · " + resueltas + " resueltas hoy") : "");

  if(!lista.length){ cont.innerHTML = '<div class="vacio">Sin tareas. Todo en orden.</div>'; return; }
  const ETQ = { abierta:null, cocinando:"cocinando", espera:"te responde", listo:"listo" };
  cont.innerHTML = lista.map(function(t){
    const cls = t.estado === "espera" ? "espera" : t.estado === "listo" ? "listo"
              : (t.nivel === "crit" ? "crit" : "");
    const kick = ETQ[t.estado] || AG[t.agente].nombre;
    return '<button class="chip ' + cls + '" data-t="' + esc(t.id) + '">' +
           '<i>' + esc(kick) + '</i><u>' + esc(t.titulo) + '</u></button>';
  }).join("");
  [...cont.querySelectorAll("[data-t]")].forEach(function(b){
    b.onclick = function(){ const t = tareaDe(b.dataset.t); if(t) abrirTarea(t); };
  });
}

function pintarMotor(){
  const el = document.getElementById("motor");
  el.className = motorListo() ? "on" : "off";
  document.getElementById("motor-est").textContent = motorListo() ? "CLAUDE OK" : "SIN MOTOR";
  document.getElementById("motor-sub").textContent = motorListo() ? CLAUDE.modelo : "falta proxy";
  el.onclick = function(){
    abrir(motorListo() ? "" : "bad", "Motor", motorListo() ? "Claude conectado" : "Claude sin conectar",
      motorListo()
        ? '<div class="ctx">Servidor: <b>' + esc(CLAUDE.apiBase) + '</b>\nModelo declarado: <b>' +
          esc(CLAUDE.modelo) + '</b>\nTope de turnos por tarea: <b>' + CLAUDE.maxTurnos + '</b>\n' +
          'Sesión verificada en el servidor: <b>' + (sesion && sesion.token ? "sí" : "no") + '</b></div>' +
          '<div class="dim">El modelo, los topes de tokens y la validación del código los fija ' +
          'el servidor, no esta página.</div>'
        : '<div class="warn">Los agentes están <b>sin energía</b> porque no hay servidor configurado.\n\n' +
          'La API key de Anthropic no puede ir en este archivo: el repo es público y una key ' +
          'en un .html es una key regalada. Por eso todo pasa por dos funciones serverless ' +
          'que guardan la key del lado del servidor.</div>' +
          '<div class="ctx">1. Desplegar <b>servidor/sesion.js</b> y <b>servidor/claude-proxy.js</b>\n' +
          '2. Poner ANTHROPIC_API_KEY y MUNDO_SESSION_SECRET como variables de entorno\n' +
          '3. Pegar la URL base en CLAUDE.apiBase (arriba del script de este archivo)</div>' +
          '<div class="warn">Ojo: la licencia de <b>Claude Enterprise</b> (los asientos de ' +
          'claude.ai) no sirve para esto. Hace falta una organización del <b>Developer ' +
          'Platform</b> (console.anthropic.com), que es un alta aparte.</div>' +
          '<div class="dim">Instrucciones completas en <b>mundo/servidor/README.md</b>. ' +
          'Mientras tanto, las tareas y el contexto que ves son reales: lo único que falta ' +
          'es quién los procese.</div>');
  };
}

/* =====================================================================
   13. ARRANQUE
   ===================================================================== */
async function abrirOficina(){
  document.getElementById("login").style.display = "none";
  document.getElementById("app").style.display = "block";
  document.getElementById("quien-rol").textContent = sesion.label;
  document.getElementById("quien-sub").textContent =
    sesion.empresa + (soloLectura() ? " · solo lectura" : "") +
    (permisos().sede ? (" · " + permisos().sede) : "");
  pintarMotor();
  medir();
  if(!raf) bucle();
  await refrescar();
  setInterval(refrescar, 60000);
  /* El latido de presencia: lo que hace que la puerta diga la verdad. */
  latir(false);
  setInterval(function(){ latir(false); }, LATIDO_MS);
  window.addEventListener("pagehide", function(){ latir(true); });
  window.addEventListener("beforeunload", function(){ latir(true); });
  document.addEventListener("visibilitychange", function(){ if(!document.hidden) refrescar(); });
}
async function refrescar(){
  /* no se pisa una tarea que está a medio trabajar */
  await cargarTodo();
  generarTareas();
  pintarChips();
  pintarProcBtn();
}
/* En el pasillo, las puertas se miran seguido: si no, el aviso miente. */
setInterval(function(){ if(sesion && vista === "pasillo") cargarPresencia(); }, 15000);
document.getElementById("pas-btn").onclick = function(){
  vista = (vista === "oficina") ? "pasillo" : "oficina";
  if(vista === "pasillo"){ camP.y = 0; cargarPresencia().then(function(){ medir(); }); }
  document.getElementById("pas-btn").innerHTML = (vista === "pasillo") ? "&#8962;" : "&#9723;";
  document.getElementById("pas-btn").title = (vista === "pasillo") ? "Mi oficina" : "Pasillo";
  cerrar(); medir();
};
document.getElementById("proc-btn").onclick = verProceso;
document.getElementById("salir").onclick = async function(){
  await latir(true);                       // apagar la luz de la puerta al salir
  try{ sessionStorage.removeItem("mundo_sesion"); }catch(e){}
  location.reload();
};
document.getElementById("entrar").onclick = intentarEntrar;
document.getElementById("codigo").addEventListener("keydown", function(e){
  if(e.key === "Enter") intentarEntrar();
});

/* La nota de la puerta dice la verdad sobre dónde se verifica el código. */

  n.innerHTML = 'Se usa el <b>mismo código</b> de la app de Bitácora SGI. Si tu rol todavía no ' +
    'tiene código, alguien con acceso de administrador tiene que crearlo allá primero — ' +
    'desde acá no se pueden crear códigos nuevos.' +
    (motorListo()
      ? '<br><br>Tu código se verifica <b>en el servidor</b>, no en este navegador.'
      : '<br><br><b>Modo local:</b> sin servidor configurado, el código se verifica en este ' +
        'navegador y los agentes quedan sin energía.');
})();

pintarRoles();
/* si ya había sesión en esta pestaña, se entra directo */
(function(){
  try{
    const s = JSON.parse(sessionStorage.getItem("mundo_sesion"));
    /* con servidor configurado, una sesión sin token no vale: se vuelve a la puerta */
    const sirve = s && s.rolId && ROLES.some(r => r.id === s.rolId) && (!motorListo() || s.token);
    if(sirve){ sesion = s; abrirOficina(); }
    else if(s){ try{ sessionStorage.removeItem("mundo_sesion"); }catch(e){} }
  }catch(e){}
})();
</script>
