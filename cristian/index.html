<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El tablero se mudó</title>

<!-- ============================================================
     ESTA PÁGINA YA NO ES EL TABLERO. Es el cartel que dice dónde quedó.

     El tablero de flota vivía en /cristian/ y ahora es la raíz del sitio.
     Este archivo se queda por una sola razón: el link viejo está repartido
     en WhatsApp y en la pantalla de inicio de más de un teléfono, y un 404
     no le explica nada a nadie. Redirige solo, y si el navegador no deja,
     el botón está ahí.

     `replace` y no `href`: así el botón de "atrás" del teléfono vuelve a
     donde la persona estaba, en vez de traerla acá otra vez y rebotarla.
     ============================================================ -->
<script>location.replace("../");</script>
<link rel="canonical" href="../">

<style>
  :root{
    --papel:#F6F5F1; --tinta:#171D1B; --tinta2:#4A5450; --acento:#0F766E;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --papel:#101614; --tinta:#E9EDEB; --tinta2:#A7B2AE; --acento:#4FC0B1;
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --papel:#101614; --tinta:#E9EDEB; --tinta2:#A7B2AE; --acento:#4FC0B1;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{background:var(--papel);color:var(--tinta);margin:0;min-height:100vh;
    display:flex;align-items:center;justify-content:center;padding:24px;
    font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:16px;line-height:1.55;text-align:center}
  .caja{max-width:34rem}
  h1{font-size:1.5rem;font-weight:600;letter-spacing:-.015em;margin:0 0 12px}
  p{color:var(--tinta2);margin:0 0 20px}
  a{display:inline-block;background:var(--acento);color:var(--papel);
    text-decoration:none;font-weight:600;padding:11px 20px;border-radius:8px}
</style>
</head>
<body>
  <div class="caja">
    <h1>El tablero se mudó</h1>
    <p>Ahora abre directo, sin el <code>/cristian</code> al final.
       Si no te lleva solo en un segundo, tocá el botón.</p>
    <a href="../">Ir al tablero</a>
  </div>
</body>
</html>
